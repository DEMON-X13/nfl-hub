name: Update prop model

on:
  schedule:
    # Every run is free since 20 October 2026 (the owner's call: no scheduled paid pull). Each one downloads
    # nflverse's files, bakes the payload, reads DraftKings' game lines and player lines from ESPN's free feed
    # with the page's own reader (props/build/espn_read.js) and publishes that read with it, then runs the audit
    # and the suggestions record, which takes each Suggested Parlays set from the last run before its lock (2 hours
    # before kickoff). No odds-API key is mapped here, and nothing here can spend a credit.
    # GitHub fires this repo's scheduled runs 2 to 9.4 hours late (measured across every job in October 2026), so
    # the times are set by what they must land before: props/build/test_lock_runs.py reads these lines and holds
    # them to every set's lock of the season (a run sure to land before it, reading no more than 12 hours before it,
    # and 24 with that run dropped). Never on the hour: :00 is the minute most likely to be dropped under load.
    - cron: "17 8 * * 1"    # Monday (lands ~10am-6pm UTC): Monday night's read, before its lock
    - cron: "17 8 * * 3"    # Wednesday: Thanksgiving's early game
    - cron: "17 8 * * 4"    # Thursday: Thursday night, Thanksgiving, Black Friday and Christmas games
    - cron: "17 5 * * 6"    # Saturday 05:17 UTC: the weekend, Saturday's games and the Sunday slate, read by
                            # Saturday morning Pacific so the owner has all of Saturday to look (October 2026)
    # Sunday 04:47 UTC (lands 06:47-14:11 UTC): the Sunday slot's set (every Sunday game before 7 pm Eastern) locks
    # 2 hours before its first kickoff, 15:00 UTC under daylight time and 16:00 after 1 November; until this the last
    # run sure to land before it was Saturday's 23:07, its read up to 15 hours old at the lock
    - cron: "47 4 * * 0"
    # post-game: finals, game bets settled, started games out of the suggestions
    - cron: "7 6 * * 5"     # after Thursday night
    - cron: "7 23 * * 0"    # after Sunday early
    - cron: "7 2 * * 1"     # after Sunday late
    - cron: "7 6 * * 1"     # after Sunday night
    - cron: "7 6 * * 2"     # after Monday night
    # player stats: nflverse's stats file trails the final score by hours (Thursday
    # night's game landed about nine hours after the whistle), so these runs pick them up
    - cron: "7 16 * * 5"    # Thursday night's stats
    - cron: "7 16 * * 1"    # Sunday's stats
    - cron: "7 16 * * 2"    # Monday night's stats
    # Saturday: 16:07 lands Saturday 9am-6:30pm PDT; 23:07 is the last run sure to land before a London kickoff's
    # lock on Sunday morning
    - cron: "7 16 * * 6"    # Saturday afternoon
    - cron: "7 23 * * 6"    # Saturday evening
    # every day: the injury report, rosters and depth charts. nflverse posts all three once a day, at about
    # 14:20 UTC (seen 9 October 2026); this fires at 12:07, so landing 3-9 hours late it reads that day's files
    # rather than the day before's, and it is the run that lands before Thursday, Sunday and Monday nights' locks.
    - cron: "7 12 * * *"    # daily: lands ~3-9pm UTC, after nflverse's afternoon posting
  workflow_dispatch:
    inputs:
      no_odds:
        # kept so a dispatch with -f no_odds=true (the old way to rebuild without buying) still starts; weekly.py
        # accepts --no-odds and does nothing with it
        description: "No effect since 20 October 2026: the job buys no prices (every run reads DraftKings' lines from ESPN for free)."
        type: boolean
        default: false

permissions:
  contents: write
  # the props-refused issue: opened (or commented on) when weekly.py refuses a run, closed on the next
  # clean publish (the two steps below that use it)
  issues: write

concurrency:
  # one group per workflow: GitHub cancels a pending run whenever a newer one queues
  # in the same group, and post-game runs in all three would have collided
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  props:
    # pinned: ubuntu-latest moves to Ubuntu 26.04 on 19 October 2026; try ubuntu-26.04 on purpose, in a dispatched run on a branch, before moving this line
    runs-on: ubuntu-24.04
    # a normal run takes a few minutes (the last 40 runs before the touchdown shadow: weekly.py 2.4 minutes at the
    # median, 8 at most, every other step seconds). Every step has a cap of its own: the publish's steps, up to and
    # including the issue it closes, add to 45 (the job's whole cap until the shadow came, so a stalled publish holds
    # the props concurrency group no longer than before: a stalled download, which lib/netfetch.py and .js give each
    # try a timeout and the run ten minutes of retry waits, fails at weekly.py's 32 and refuses the run, opening the
    # props-refused issue below); the touchdown shadow's steps add to 39; the two after it to 3. 90: all of them and
    # 3 minutes of GitHub's own set-up and post steps, so no step that runs to its own cap cuts off one after it, and
    # the shadow never turns the run red. .github/scripts/test_props_gate.py holds every cap and both sums
    timeout-minutes: 90
    steps:
      # the branch as it stands when the run starts, not the commit it was queued on: runs of one job wait
      # in line (concurrency), and one queued behind another would otherwise start from the state the other
      # has since replaced, and lose the push to a conflict on its own file
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        timeout-minutes: 1
        with:
          python-version: "3.12"
      - run: pip install -r props/requirements.txt
        timeout-minutes: 3
      - uses: actions/setup-node@v7
        timeout-minutes: 1
        with:
          node-version: 22
      - run: npm ci
        timeout-minutes: 2
        working-directory: props/build
      - name: Weekly refresh (downloads, bake, assemble, ESPN read, audit)
        id: weekly
        # 32 minutes (its longest of the last 40 runs, 8): one that stalls past it fails here and refuses the run,
        # as the job's 45 did before every step had a cap; the props-refused issue below then opens
        timeout-minutes: 32
        working-directory: props/build
        env:
          PYTHONUTF8: "1"
        # weekly.py exits 1 when it refuses the run: a required nflverse download failed or came back wrong, the
        # stats would cover fewer games than the published payload, the ESPN read could not be applied, or the
        # audit has a failure or a runtime error. Then the commit step below is skipped and the last good data
        # stays live. ESPN not answering never refuses: the last read stays published, and a game's lines left
        # unread for a day near its kickoff turns the last step below red. The audit's warnings (its presentation
        # checks: audit.js names each and why) never refuse either: the run publishes and the last step goes red,
        # listing them. The no_odds input is read by nothing; a run queued before 20 October 2026 may still start
        # with the old run line's --catch-up or --no-odds, which weekly.py accepts and does nothing with.
        run: python weekly.py --no-commit
      - name: Commit if anything changed
        timeout-minutes: 3
        # props/raw/feat.pkl changes only on the first run of a new season, when weekly.py adds the
        # season just finished to it (the baselines come from there); it is committed here so the
        # next run finds it ready. A refused run never commits it. props/data carries the
        # suggestions record too, props/data/suggest_ledger.json (props/build/suggest_ledger.js, run
        # by weekly.py after a clean audit): each prime-time game's Suggested Parlays set and each week's Sunday
        # slot, locked 2 hours before kickoff and graded after (and the retired all-games panel's entries,
        # frozen and still graded); a run whose record the script refused leaves the last good one in place.
        # And the archive of DraftKings' player lines on ESPN, props/data/espn_lines_<season>.json (espn_archive.py,
        # weekly.py's step 5b, 27 October 2026): research data, each played game frozen once.
        # The ESPN read's raw answers (props/raw/espn/) are never committed: the read is in the payload.
        run: |
          git config user.name "nfl-hub bot"
          git config user.email "bot@users.noreply.github.com"
          git add props/data props/raw/feat.pkl
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "props: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            # each job has its own concurrency group now, so two can finish together:
            # retry the pull-and-push, and fail honestly if all three attempts lose
            ok=0
            for i in 1 2 3; do
              if git pull --rebase && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true   # a failed rebase left in place fails every retry
              echo "push raced another job, retrying ($i)"; sleep 15
            done
            [ "$ok" = 1 ]
          fi
      - name: Close the props-refused issue (this run published)
        # a clean run after a refusal: the issue the refusal opened says when the site caught up, and
        # closes. Never fails the run (continue-on-error), and does nothing when no issue is open
        if: success() && steps.weekly.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          open=$(gh issue list --label props-refused --state open --json number --jq '.[].number' 2>/dev/null || true)
          if [ -z "$open" ]; then echo "no props-refused issue is open"; exit 0; fi
          at=$(python -c "import json; print(json.load(open('props/data/payload.json'))['baked_at'])")
          for n in $open; do
            gh issue close "$n" --comment "Published: the payload baked at $at is on the site, by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          done
      # The anytime-touchdown shadow (props/research/propmodel/README.md, "The touchdown shadow"; PREREGISTRATION.md
      # section 8). Research only: no page reads its ledger and nothing on the site uses it. It runs after this run's
      # payload is pushed, on main only, and touches nothing the steps above decided: every step is continue-on-error
      # with its own timeout-minutes (the job's cap is the publish's 45, all of theirs and the last two's), none writes the build's
      # problems file (the last step's only input), the ledger is written aside, checked and only then moved into
      # place, and it goes in a commit of its own. The model runs on Python 3.13 with requirements.txt's pins, in a
      # venv of its own (`python` stays 3.12 for every step after: refused_note.py imports weekly.py). The off switch is
      # the repository variable TD_SHADOW=off (`gh variable set TD_SHADOW --body off`; `gh variable delete TD_SHADOW`
      # resumes it); after a FAIL, or once the season's last grade is written, the plan says there is nothing to do.
      - name: "TD shadow: what this run has to do"
        id: tdplan
        if: success() && steps.weekly.outcome == 'success' && github.ref_name == 'main' && vars.TD_SHADOW != 'off'
        continue-on-error: true
        timeout-minutes: 2
        run: python -I props/research/propmodel/td_shadow.py plan --payload props/data/payload.json --ledger props/research/propmodel/shadow/td_ledger.json
      - name: "TD shadow: Python 3.13"
        id: tdpy
        if: success() && steps.tdplan.outputs.work == 'run'
        continue-on-error: true
        timeout-minutes: 4
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          update-environment: false
      - name: "TD shadow: the 2010-2025 files (cached)"
        id: tdhist
        if: success() && steps.tdplan.outputs.hist == 'true' && steps.tdpy.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 4
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/pm-hist
          key: propmodel-hist-v1-${{ hashFiles('props/research/propmodel/frozen/MANIFEST.json') }}
      - name: "TD shadow: calls, freezes and grades (research only, never shown)"
        id: tdshadow
        if: success() && steps.tdplan.outputs.work == 'run' && steps.tdpy.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PY313: ${{ steps.tdpy.outputs.python-path }}
        # td_shadow.py run exits 0 (written), 2 (written, a phase skipped: DEGRADED) or 1 (REFUSED, nothing written);
        # the ledger it writes to $T is moved over the committed one only once td_shadow_check.py passes it, and the
        # step ends with run's own code, so a DEGRADED run shows orange with its ledger committed. A step killed at its
        # cap dies before the move: the tree keeps the committed ledger
        run: |
          L=props/research/propmodel/shadow/td_ledger.json; T="$RUNNER_TEMP/tdshadow"; mkdir -p "$T"; P="$T/problems.txt"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if ! { "$PY313" -m venv "$T/venv" && "$T/venv/bin/pip" install -q -r props/research/propmodel/requirements.txt; }; then
            echo "REFUSED: the model's Python 3.13 libraries did not install" >> "$P"; exit 1
          fi
          node props/research/propmodel/td_shadow_page.js --payload props/data/payload.json --ledger "$L" \
               --now "$NOW" --out "$T/page.json" || echo "DEGRADED: the page could not be read: no call this run" >> "$P"
          rc=0
          "$T/venv/bin/python" -I props/research/propmodel/td_shadow.py run --now "$NOW" --payload props/data/payload.json \
               --page "$T/page.json" --props-raw props/raw --hist "$RUNNER_TEMP/pm-hist" --data "$T/data" \
               --ledger "$L" --out "$T/td_ledger.json" --evidence "$T/evidence.json" --problems "$P" || rc=$?
          if [ -f "$T/hist_ok" ]; then echo "hist_ok=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$rc" != 0 ] && [ "$rc" != 2 ]; then exit 1; fi
          "$T/venv/bin/python" -I props/research/propmodel/td_shadow_check.py --ledger "$T/td_ledger.json" \
               --payload props/data/payload.json --page "$T/page.json" --evidence "$T/evidence.json" \
               --data "$T/data" --problems "$P" || { echo "REFUSED: the check failed: the ledger stays as committed" >> "$P"; exit 1; }
          cp "$T/td_ledger.json" "$L.part" && mv "$L.part" "$L"
          exit "$rc"
      - name: "TD shadow: keep the 2010-2025 files"
        if: success() && steps.tdshadow.outputs.hist_ok == 'true' && steps.tdhist.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 4
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/pm-hist
          key: propmodel-hist-v1-${{ hashFiles('props/research/propmodel/frozen/MANIFEST.json') }}
      - name: "TD shadow: commit its ledger"
        # the ledger alone, in a commit of its own after the publish's; the tree holds either the committed ledger (no
        # change, nothing to commit) or one td_shadow_check.py passed
        if: success() && (steps.tdshadow.outcome == 'success' || steps.tdshadow.outcome == 'failure')
        continue-on-error: true
        timeout-minutes: 3
        run: |
          L=props/research/propmodel/shadow/td_ledger.json
          git config user.name "nfl-hub bot"
          git config user.email "bot@users.noreply.github.com"
          git add "$L"
          if git diff --cached --quiet; then echo "the shadow's ledger did not change"; exit 0; fi
          git commit -m "props: touchdown shadow $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "push raced another job, retrying ($i)"; sleep 15
          done
          echo "WARN: the ledger's commit lost its push three times: the next run starts from the last committed ledger" >> "$RUNNER_TEMP/tdshadow/problems.txt"
          exit 1
      - name: "TD shadow: the td-shadow issue"
        # one open issue labelled td-shadow, commented only when its problems change and closed by the next clean run,
        # and the td-shadow-verdict issue opened once, at 2,000 (td_shadow.py notify); the props run itself stays green
        if: success() && steps.tdplan.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOMES: "plan=${{ steps.tdplan.outcome }} py=${{ steps.tdpy.outcome }} hist=${{ steps.tdhist.outcome }} shadow=${{ steps.tdshadow.outcome }}"
        run: python -I props/research/propmodel/td_shadow.py notify --tmp "$RUNNER_TEMP/tdshadow" --ledger props/research/propmodel/shadow/td_ledger.json --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Open or update the props-refused issue (why, and what to do)
        # a refusal reaches the owner (an issue in his own repo: email and GitHub Mobile) and a Claude
        # session can be pointed at it: why it refused, the run, and what to do (props/build/refused_note.py).
        # Nothing is held: a refused run commits nothing, and the next clean run publishes from scratch.
        # One issue at a time: a second refusal comments on the open one. Never fails the run, and
        # never stands in for the red run below
        if: failure() && steps.weekly.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          body="$RUNNER_TEMP/props-refused.md"
          python props/build/refused_note.py --problems "$RUNNER_TEMP/props-build-problems.txt" --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$body"
          gh label create props-refused --force --color B60205 --description "The props job refused a run: nothing published"
          n=$(gh issue list --label props-refused --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file "$body"
          else gh issue create --title "Props job refused: nothing published" --label props-refused --body-file "$body"; fi
      - name: Fail the run if the build reported problems
        if: always()
        timeout-minutes: 1
        run: |
          f="$RUNNER_TEMP/props-build-problems.txt"
          if [ -s "$f" ]; then
            if grep -q '^BLOCKED\|^AUDIT' "$f"; then echo "::error::the weekly build refused this run: nothing was published, the last good data is still live"
            else echo "::error::the weekly build reported problems; what it built was published, and these are what it could not do or what needs a look"; fi
            sed 's/^/  - /' "$f"
            exit 1
          fi
          echo "the build reported no problems"
