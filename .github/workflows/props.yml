name: Update prop model

on:
  schedule:
    # 14:00 UTC, four days a week. Each run prices only the games that kick off
    # before the next run, so every game is priced by the last pull before it
    # starts and none is priced twice. About 7 credits a game, ~112 a week.
    - cron: "0 14 * * 1"    # Monday: Monday night
    - cron: "0 14 * * 3"    # Wednesday: holiday games, nothing in an ordinary week
    - cron: "0 14 * * 4"    # Thursday: Thursday night, and a Friday game if there is one
    - cron: "0 14 * * 6"    # Saturday: the Sunday slate
  workflow_dispatch:
    inputs:
      no_odds:
        description: "Skip the price pull. Leave unticked to pull fresh prices, about 7 credits a game; tick it to rebuild off the prices already here and spend nothing."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r props/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: props/build
      - name: Weekly refresh (downloads, prices, bake, assemble, audit)
        working-directory: props/build
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PYTHONUTF8: "1"
        run: python weekly.py --no-commit ${{ inputs.no_odds && '--no-odds' || '' }}
      - name: Publish the pages
        run: node props/build/publish.js
      - name: Commit if anything changed
        run: |
          git config user.name "nfl-hub bot"
          git config user.email "bot@users.noreply.github.com"
          git add props/index.html props/admin.html props/app props/data
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "props: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
      - name: Fail the run if the build reported problems
        if: always()
        run: |
          f="$RUNNER_TEMP/props-build-problems.txt"
          if [ -s "$f" ]; then
            echo "::error::the weekly build reported problems; whatever worked was still published"
            sed 's/^/  - /' "$f"
            exit 1
          fi
          echo "the build reported no problems"
