name: Update prop model

on:
  schedule:
    # Four runs a week. Each prices only the games that kick off before the next
    # run, so every game is priced by the last pull before it starts and none is
    # priced twice. About 7 credits a game, ~112 a week. Times must match
    # PULL_TIMES in props/build/weekly.py.
    # Overnight, and never on the hour: this repo's scheduled runs land 2-4.5 hours
    # late, so the cushion before kickoff has to absorb that, and :00 is the minute
    # most likely to be dropped under load.
    - cron: "17 8 * * 1"    # Monday 04:17 ET: Monday night, ~16h of cushion
    - cron: "17 8 * * 3"    # Wednesday 04:17 ET: holiday games, nothing in an ordinary week
    - cron: "17 8 * * 4"    # Thursday 04:17 ET: Thursday night, and Thanksgiving's early game
    - cron: "17 23 * * 6"   # Saturday 19:17 ET: the Sunday slate, priced ~18h out
    # post-game, score only: finals, game bets settled, started games out of the
    # suggestions. Every one of these sits on minute 7, and the run step passes
    # --no-odds for any schedule starting "7 ", so none of them spends a credit.
    - cron: "7 6 * * 5"     # after Thursday night
    - cron: "7 23 * * 0"    # after Sunday early
    - cron: "7 2 * * 1"     # after Sunday late
    - cron: "7 6 * * 1"     # after Sunday night
    - cron: "7 6 * * 2"     # after Monday night
  workflow_dispatch:
    inputs:
      no_odds:
        description: "Skip the price pull. Leave unticked to pull fresh prices, about 7 credits a game; tick it to rebuild off the prices already here and spend nothing."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # one group per workflow: GitHub cancels a pending run whenever a newer one queues
  # in the same group, and post-game runs in all three would have collided
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r props/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: props/build
      - name: Weekly refresh (downloads, prices, bake, assemble, audit)
        working-directory: props/build
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PYTHONUTF8: "1"
        # a scheduled run cannot carry the no_odds input, so the post-game crons are
        # recognised by their minute: they all start "7 ", the price pulls start "17 "
        run: python weekly.py --no-commit ${{ (inputs.no_odds || startsWith(github.event.schedule, '7 ')) && '--no-odds' || '' }}
      - name: Publish the pages
        run: node props/build/publish.js
      - name: Commit if anything changed
        run: |
          git config user.name "nfl-hub bot"
          git config user.email "bot@users.noreply.github.com"
          git add props/index.html props/admin.html props/app props/data
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "props: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            # each job has its own concurrency group now, so two can finish together:
            # retry the pull-and-push, and fail honestly if all three attempts lose
            ok=0
            for i in 1 2 3; do
              if git pull --rebase && git push; then ok=1; break; fi
              echo "push raced another job, retrying ($i)"; sleep 15
            done
            [ "$ok" = 1 ]
          fi
      - name: Fail the run if the build reported problems
        if: always()
        run: |
          f="$RUNNER_TEMP/props-build-problems.txt"
          if [ -s "$f" ]; then
            echo "::error::the weekly build reported problems; whatever worked was still published"
            sed 's/^/  - /' "$f"
            exit 1
          fi
          echo "the build reported no problems"
