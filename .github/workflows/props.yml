name: Update prop model

on:
  schedule:
    # Two pulls a week, 10am Eastern (14:00 UTC in season). The price pull spends
    # odds-API credits (about 7 a game): Thursday covers the Thursday night game,
    # Saturday covers the rest of the slate. Nothing else on this schedule.
    - cron: "0 14 * * 4"    # Thursday
    - cron: "0 14 * * 6"    # Saturday
  workflow_dispatch:
    inputs:
      no_odds:
        description: "Skip the price pull (spends no credits)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r props/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: props/build
      - name: Weekly refresh (downloads, prices, bake, assemble, audit)
        working-directory: props/build
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PYTHONUTF8: "1"
        run: python weekly.py --no-commit ${{ inputs.no_odds && '--no-odds' || '' }}
      - name: Publish the pages
        run: node props/build/publish.js
      - name: Commit if anything changed
        run: |
          git config user.name "nfl-hub bot"
          git config user.email "bot@users.noreply.github.com"
          git add props/index.html props/admin.html props/app props/data
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "props: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
