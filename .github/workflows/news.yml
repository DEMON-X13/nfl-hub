name: Update season tracker
# the news job: results, the stat bars (stats2026.js and stats.json), the Deep Dive (units2026.js and
# units.json) and the reading pack, which X NFL Bets and Stats' Game snapshot reads at runtime; the
# tracker's own page was retired on 14 October 2026 (its games are in the snapshot), the job was not

on:
  schedule:
    # GitHub starts this repo's scheduled runs late: 2.3 to 9.4 hours after the cron time, median
    # about 6.5 (every workflow here, measured Sep 17 to Oct 9, 2026), and now and then not at all.
    # So a run that has to land before a kickoff is set early enough to make it 9.4 hours late, and
    # has a twin. Times are UTC. Free sources only (ESPN feeds, TeamRankings tables, nflverse): no credits.
    #
    # post-game: results, records and team stats. The game notes (news/data/notes/) are written by hand
    # each Wednesday and never touched here.
    - cron: "27 6 * * 5"    # Fri, after Thursday night
    - cron: "27 23 * * 0"   # Sun, after the early games
    - cron: "27 2 * * 1"    # Mon, after the late games
    - cron: "27 6 * * 1"    # Mon, after Sunday night; also Saturday's report for Monday night
    - cron: "27 6 * * 2"    # Tue, after Monday night
    - cron: "47 11 * * 1,2,5"  # Mon, Tue, Fri: the day's refresh once the night's runs have settled
    # the Deep Dive's lineups: nflverse files a day's injury report about 14:30 UTC the next morning,
    # and ESPN shows the game statuses the evening they are filed (about 20:00 UTC)
    - cron: "7 15 * * 2"    # Tue: Monday's report (a Wednesday game's statuses: week 12, Nov 25)
    - cron: "7 15 * * 3"    # Wed: Tuesday's report
    - cron: "7 21 * * 3"    # Wed: ESPN's Wednesday statuses for Thursday (lands by 06:30 Thu)
    - cron: "7 3 * * 4"     # Thu: the same again, before Thanksgiving's 12:30pm ET kickoff
    - cron: "47 14 * * 4"   # Thu: nflverse's Wednesday report, before Thursday night (lands by 00:10 Fri)
    - cron: "7 21 * * 5"    # Fri: ESPN's Friday statuses for Sunday; nflverse's Thursday report
    - cron: "7 15 * * 6"    # Sat: nflverse's Friday report, Sunday's game statuses ...
    - cron: "7 19 * * 6"    # Sat ... with three more chances to land before Sunday morning
    - cron: "7 23 * * 6"    # Sat
    - cron: "7 3 * * 0"     # Sun: lands by 12:30 UTC, before the London kickoff (13:30 UTC)
    - cron: "7 7 * * 0"     # Sun: lands by 16:30 UTC, before the 1pm ET games
  workflow_dispatch:
  push:
    # a change to the job's code runs it once, so a fix is proven straight away; so does a week's game notes,
    # so a note the rules refuse (it quotes a spread or the site's own ranks, say) shows on its own push (the
    # smoke warns, after the commit), not on the next scheduled run hours later. The smoke test draws every
    # game with the Deep Dive module the Game snapshot inlines (nflbets/build/deepdive.js), so a
    # change to it runs this job too, and the retired page's address (news/index.html) is held here
    branches: [main]
    paths: ["news/tools/pull-week.js", "news/tools/run-auto.js", "news/tools/smoke.js", "news/tools/context.js", "news/tools/lib.js", "lib/netfetch.js", "news/tools/lineup-checks.js", "news/tools/deepdive-checks.js", "news/tools/cases.js",
            "news/tools/notes.js", "news/data/notes/**", "news/index.html", "nflbets/build/deepdive.js"]

permissions:
  contents: write

concurrency:
  # one group per workflow: GitHub cancels a pending run whenever a newer one queues
  # in the same group, and post-game runs in all three would have collided
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  news:
    # pinned: ubuntu-latest moves to Ubuntu 26.04 on 19 October 2026; try ubuntu-26.04 on purpose, in a dispatched run on a branch, before moving this line
    runs-on: ubuntu-24.04
    # a normal run takes a few minutes; a stalled download (lib/netfetch.py and .js give each try a
    # timeout and the run ten minutes of retry waits) fails the run here, not at GitHub's six hours
    timeout-minutes: 30
    steps:
      # the branch as it stands when the run starts, not the commit it was queued on: runs of one job wait
      # in line (concurrency), and one queued behind another would otherwise start from the state the other
      # has since replaced, and lose the push to a conflict on its own file
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: news
      # a required nflverse file that does not download fails this step (context.js writes nothing),
      # so nothing below runs and the last good data stays live
      - name: Pull scores, stats and the week's reading pack
        working-directory: news
        run: node tools/run-auto.js
      # the data the Game snapshot reads, and the lineups against the injury report, roster and schedule
      # they were built from. Its failures hold the run's files back; its warnings (who the Deep Dive lists
      # and its notes, and anything wrong in a game note: smoke.js names them) publish, and the last step
      # goes red on them
      - name: Smoke test the data
        id: smoke
        working-directory: news
        env:
          SMOKE_WARNINGS_FILE: ${{ runner.temp }}/news-smoke-warnings.txt
        run: node tools/smoke.js
      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name "nfl-hub bot"
          git config user.email "bot@users.noreply.github.com"
          git add news/data/results.js news/data/stats2026.js news/data/stats.json news/data/units2026.js news/data/units.json news/tools/out
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "news: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            # each job has its own concurrency group now, so two can finish together:
            # retry the pull-and-push, and fail honestly if all three attempts lose
            ok=0
            for i in 1 2 3; do
              if git pull --rebase && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true   # a failed rebase left in place fails every retry
              echo "push raced another job, retrying ($i)"; sleep 15
            done
            [ "$ok" = 1 ]
          fi
      - name: Fail the run if the smoke test warned (the files are already published)
        # only after a smoke with no failure (a failed smoke holds the commit back and says so itself;
        # smoke.js writes the file only then too), and worded from the commit's own outcome
        if: always() && steps.smoke.outcome == 'success'
        env:
          COMMIT: ${{ steps.commit.outcome }}
        run: |
          f="${{ runner.temp }}/news-smoke-warnings.txt"
          if [ -s "$f" ]; then
            if [ "$COMMIT" = success ]; then
              echo "::error::the news smoke test warned: the files were published, and these presentation checks need a look"
            else
              echo "::error::the news smoke test passed its blocking checks and warned, but the commit step did not succeed ($COMMIT), so the files were not published; these presentation checks need a look too"
            fi
            sed 's/^/  - /' "$f"
            exit 1
          fi
          echo "the smoke test reported no warnings"
