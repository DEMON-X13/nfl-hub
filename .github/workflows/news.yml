name: Update season tracker

on:
  schedule:
    # After the Thursday, Sunday and Monday games (8am Eastern = 12:00 UTC in season).
    # Free sources only (ESPN feeds, TeamRankings tables): no credits.
    - cron: "0 12 * * 5"    # Friday
    - cron: "0 12 * * 1"    # Monday
    - cron: "0 12 * * 2"    # Tuesday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: news
      - name: Pull scores, stats and the week's reading pack
        working-directory: news
        run: node tools/run-auto.js
      - name: Smoke test the page
        working-directory: news
        run: node tools/smoke.js
      - name: Commit if anything changed
        run: |
          git config user.name "nfl-hub bot"
          git config user.email "bot@users.noreply.github.com"
          git add news/data/results.js news/data/stats2026.js news/data/week*.js news/tools/out
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "news: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
