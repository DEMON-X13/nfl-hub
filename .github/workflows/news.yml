name: Update season tracker

on:
  schedule:
    # After the Thursday, Sunday and Monday games (8am Eastern = 12:00 UTC in season).
    # Free sources only (ESPN feeds, TeamRankings tables): no credits.
    - cron: "0 12 * * 5"    # Friday
    - cron: "0 12 * * 1"    # Monday
    - cron: "0 12 * * 2"    # Tuesday
    # post-game: results and team stats the same night. The narrative is untouched;
    # run-auto only refreshes the self-updating parts and drafts a week it cannot show.
    - cron: "27 6 * * 5"    # after Thursday night
    - cron: "27 23 * * 0"   # after Sunday early
    - cron: "27 2 * * 1"    # after Sunday late
    - cron: "27 6 * * 1"    # after Sunday night
    - cron: "27 6 * * 2"    # after Monday night
  workflow_dispatch:
  push:
    # a change to the tracker's pull code runs it once, so a fix is proven straight away
    branches: [main]
    paths: ["news/tools/pull-week.js", "news/tools/run-auto.js", "news/tools/smoke.js", "news/tools/context.js"]

permissions:
  contents: write

concurrency:
  # one group per workflow: GitHub cancels a pending run whenever a newer one queues
  # in the same group, and post-game runs in all three would have collided
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: news
      - name: Pull scores, stats and the week's reading pack
        working-directory: news
        run: node tools/run-auto.js
      - name: Smoke test the page
        working-directory: news
        run: node tools/smoke.js
      - name: Commit if anything changed
        run: |
          git config user.name "nfl-hub bot"
          git config user.email "bot@users.noreply.github.com"
          git add news/data/results.js news/data/stats2026.js news/data/ranks2026.js news/data/players2026.js news/data/units2026.js news/data/week*.js news/tools/out
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "news: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            # each job has its own concurrency group now, so two can finish together:
            # retry the pull-and-push, and fail honestly if all three attempts lose
            ok=0
            for i in 1 2 3; do
              if git pull --rebase && git push; then ok=1; break; fi
              echo "push raced another job, retrying ($i)"; sleep 15
            done
            [ "$ok" = 1 ]
          fi
