name: dklink-test
on:
  push:
    branches: [claude/wonderful-feynman-8ujzid]
    paths: [props/research/dklink/cards.py, props/research/dklink/legs.json, .github/workflows/dklink-test.yml]
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 props/research/dklink/cards.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add props/research/dklink; git commit -m "DraftKings link test: the four test cards' links" && git push
