name: dklink-test
on:
  push:
    branches: [claude/wonderful-feynman-8ujzid]
    paths: [props/research/dklink/dklink.py, .github/workflows/dklink-test.yml]
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install "qrcode[pil]"
      - run: python3 props/research/dklink/dklink.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add props/research/dklink; git commit -m "DraftKings link test: tonight's ATL v BAL legs and their QR codes" && git push
