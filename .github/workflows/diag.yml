name: Diagnostic (temporary)
on:
  push:
    paths: [".github/workflows/diag.yml", ".github/diag/**"]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/diag/ua_test.mjs
      - run: |
          for u in "https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv"; do
            echo "$u $(curl -s -o /dev/null -w '%{http_code}' "$u")"; done
