name: elo

# The Player Elo ratings and the roster model: every player rated by position, game by game
# since 2012, the matchup formula, and the game model fitted on those ratings, re-run once the week's player stats
# are on nflverse, and the coming week called on the latest depth charts, roster and injury report
# (who last took the field only where a chart is silent).
#
# GitHub starts this repo's scheduled runs late: 4 to 9 hours after the cron time, measured on
# every run since the daily slot began (2026-10-04 to 10-08: 4.4, 8.1, 5.9, 6.4 and 6.3 hours).
# So the times below are when a run is queued, not when it lands, and every run that has to
# land before a kickoff is set early enough to make it at nine hours late:
#   - 12:40 UTC daily (08:40 EDT, 07:40 EST): lands early-to-late afternoon Eastern. Tuesday's
#     takes in Monday night; Thursday's and Monday's land before the night game; the rest move
#     who is expected to play as the depth charts and practice reports change.
#   - 20:40 UTC Saturday and 03:40 UTC Sunday: Sunday's calls on Friday's final injury report
#     (on nflverse overnight into Saturday), landing by about 05:40 and 12:40 UTC Sunday, before
#     the London kickoffs (13:30 UTC in October) and the 1pm Eastern games (17:00 or 18:00 UTC).
#     The daily Saturday run gives a third chance. A call is frozen at kickoff, so a run that
#     lands after one changes nothing about that game's pick.
# A run that fails its gate (the build, elo/check.py, elo/check_tab.js) commits nothing: the last good
# files stay live. The Bets and Stats page smoke runs after the commit: it checks the page, not the Elo
# data, so a failure there turns the run red without holding back the ratings (it held them back on a
# tied final and on a top 25 with 24 quarterbacks, in October 2026, until each fix landed).
on:
  schedule:
    - cron: "40 12 * * *"    # daily, queued 12:40 UTC (08:40 EDT / 07:40 EST); lands 4-9h later
    - cron: "40 20 * * 6"    # Saturday 20:40 UTC; lands before Sunday's first kickoff
    - cron: "40 3 * * 0"     # Sunday 03:40 UTC; lands before the London and 1pm Eastern kickoffs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  rate:
    # pinned: ubuntu-latest moves to Ubuntu 26.04 on 19 October 2026; try ubuntu-26.04 on purpose, in a dispatched run on a branch, before moving this line
    runs-on: ubuntu-24.04
    # a normal run takes about five minutes; a stalled download fails the run here, not at GitHub's six hours
    timeout-minutes: 40
    steps:
      # the branch as it stands when the run starts, not the commit it was queued on: runs of one job wait
      # in line (concurrency), and one queued behind another would otherwise start from the state the other
      # has since replaced, and lose the push to a conflict on its own file
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r elo/requirements.txt
      # The finished seasons' nflverse files (2012 to last season's player stats, depth charts and injury
      # reports, last season's play-by-play once this one is under way, and the season before last's,
      # which Overall Offense and Overall Defense carry in until the rankings move to the new season
      # and which is not read after: in season about 230 MB, 43 of the 49 files a run reads) never
      # change, so they are kept between runs instead of asked for again five
      # times a day: one failed request among them refused the run of 13 October 2026. The season in
      # play, games.csv and the roster are never kept: build.py deletes and downloads them every run.
      # build.py writes elo/cache/past.lst, the finished seasons' files it read, once every source was
      # had; the steps after the gates keep exactly those, under a key that changes only when that set
      # does (a new season). A restore that misses only means a full download, as before. Bump v1 to
      # throw the kept files away (if nflverse ever republishes a past season).
      - name: Restore the finished seasons' files
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: elo/cache-past
          key: elo-nflverse-past-v1-none            # never saved: the newest under the prefix is taken
          restore-keys: elo-nflverse-past-v1-
      - run: mkdir -p elo/cache && if [ -d elo/cache-past ]; then cp elo/cache-past/* elo/cache/ 2>/dev/null || true; ls elo/cache | wc -l; fi
      - name: Rate every player and fit the roster model
        # exits 1 without writing anything when a required source cannot be downloaded (lib/netfetch.py
        # has tried each failed one five times, over nearly two minutes, first)
        run: python elo/build.py
      - name: Check the files against the roster, the injury report, the schedule and the published record
        run: python elo/check.py
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: props/build
      - name: Check the ELO Ratings tab on the new files
        run: node elo/check_tab.js
      - name: Is there a week to call
        id: season
        # between the Super Bowl and the fortnight before a new week 1 there is no game to call
        # and no matchup to project, and the page smoke's Elo picks checks need one: then it is
        # skipped (the two checks above are the gate either way)
        run: echo "calls=$(python -c "import json; print(len(json.load(open('elo/data/model.json'))['next']['games']))")" >> "$GITHUB_OUTPUT"
      - name: Commit if anything changed
        run: |
          git config user.name "nfl-hub bot"
          git config user.email "bot@users.noreply.github.com"
          git add elo/data
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "elo: rate $(date -u +'%Y-%m-%d %H:%M UTC')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true   # a failed rebase left in place fails every retry
              echo "push raced another job, retrying ($i)"; sleep 15
            done
            [ "$ok" = 1 ]
          fi
      - name: Check the page still reads what was written (after the commit; a red here never holds back the ratings)
        # a page check, not a check of the Elo data (check.py and check_tab.js gate that, above;
        # check_tab.js runs the files through market + form, the Elo matchup chance and the Elo
        # picks, the code that touches a chance or a price): the whole Bets and Stats page booted on
        # the files just committed. It runs once the commit has
        # landed, so a page case the smoke has never seen turns the run red with the ratings already
        # live, and is fixed in the page or the smoke
        if: steps.season.outputs.calls != '0'
        run: node nflbets/build/smoke.js
      - name: Stage the finished seasons' files to keep
        id: past
        if: always()
        run: |
          [ -f elo/cache/past.lst ] || { echo "no past.lst: the build did not get its sources, nothing to keep"; exit 0; }
          rm -rf elo/cache-past && mkdir elo/cache-past
          while read -r f; do cp "elo/cache/$f" elo/cache-past/; done < elo/cache/past.lst
          echo "key=elo-nflverse-past-v1-$(sort elo/cache/past.lst | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Keep them for the next run (a new entry only when the set of finished seasons changes)
        if: always() && steps.past.outputs.key != '' && steps.past.outputs.key != steps.restore.outputs.cache-matched-key
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: elo/cache-past
          key: ${{ steps.past.outputs.key }}
