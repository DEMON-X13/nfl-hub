name: Clean up merged branches and retired runs (one-off)

# One-off, dispatched by hand on 16 November 2026 at the owner's ask, then removed.
# Deletes the 49 branches whose head is still exactly the commit checked against its merged
# pull request (each can be brought back from that PR's "Restore branch"), and the runs of
# five workflows whose files were deleted long ago. Nothing else: a branch whose head moved
# since the check is skipped and named.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete the merged branches
        run: |
          set -u
          gone=0; kept=0
          while read -r b want; do
            [ -z "$b" ] && continue
            case "$b" in main|claude/nice-newton-e43jf6) echo "never: $b"; continue;; esac
            have=$(gh api "repos/$REPO/git/ref/heads/$b" --jq .object.sha 2>/dev/null || true)
            if [ -z "$have" ]; then echo "already gone: $b"; continue; fi
            if [ "$have" != "$want" ]; then echo "SKIPPED (head moved to $have): $b"; kept=$((kept+1)); continue; fi
            gh api -X DELETE "repos/$REPO/git/refs/heads/$b" && { echo "deleted: $b"; gone=$((gone+1)); }
          done <<'LIST'
            claude/admiring-davinci-jplz8w f77592364bb85c50d4ea008862c378e5eabbb95f
            claude/admiring-hawking-c6kc4e cdd74a4f03423f5cbadd40373c79d26eb6b86af0
            claude/admiring-ritchie-5c2rph 781f97627e8e225f3ad589c9ec239d72e4936ac3
