          LIST
          echo "branches deleted: $gone, skipped: $kept"
      - name: Delete the retired workflows' runs
        run: |
          set -u
          n=0
          for w in 386923018 381359023 380695922 362436206 367529762; do
            for id in $(gh api --paginate "repos/$REPO/actions/workflows/$w/runs?per_page=100" --jq '.workflow_runs[].id'); do
              gh api -X DELETE "repos/$REPO/actions/runs/$id" && { echo "deleted run $id (workflow $w)"; n=$((n+1)); }
            done
          done
          echo "runs deleted: $n"
