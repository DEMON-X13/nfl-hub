name: Update sites

on:
  schedule:
    # Three windows, in UTC (Eastern is UTC-4 in season). nflverse publishes the
    # stats files overnight after games, so each window has a morning run and an
    # afternoon catch-up in case the file was late. Runs that find nothing new
    # commit nothing. This job downloads only free nflverse files: no credits.
    - cron: "0 11 * * 5"    # Friday 7am ET: Thursday night game
    - cron: "0 17 * * 5"    # Friday 1pm ET: catch-up
    - cron: "0 11 * * 1"    # Monday 7am ET: Sunday games
    - cron: "0 17 * * 1"    # Monday 1pm ET: catch-up
    - cron: "0 11 * * 2"    # Tuesday 7am ET: Monday night game, week rolls over
    - cron: "0 17 * * 2"    # Tuesday 1pm ET: catch-up
    # post-game: about an hour after the latest finish each slot sees all season,
    # so AI Picks and the records update the same night. nflverse posts a final
    # within minutes of the whistle. Free, like everything else in this job.
    - cron: "47 5 * * 5"    # Thursday night game
    - cron: "17 22 * * 0"   # Sunday early games
    - cron: "47 1 * * 1"    # Sunday late games
    - cron: "47 5 * * 1"    # Sunday night game
    - cron: "47 5 * * 2"    # Monday night game
    # injury reports: a game's Out / Doubtful statuses come on the last report before it,
    # Wednesday afternoon for Thursday night and Friday afternoon for Sunday and Monday.
    # Without these runs the picks go into the weekend without them. Off the hour: this
    # repo's scheduled runs land hours late and :00 is the minute most often dropped.
    - cron: "23 12 * * 4"   # Thursday 8:23am ET: Wednesday's report, for Thursday night
    - cron: "23 12 * * 6"   # Saturday 8:23am ET: Friday's report, for Sunday and Monday
    # every hour: nflverse's games.csv carries the spread, moneylines and total, and the
    # Joker reads them, so its picks follow the line within the hour. Free like the rest;
    # a run that finds nothing new writes nothing and commits nothing. The runs above stay
    # as the ones that matter, since this repo's scheduled runs are sometimes dropped.
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Replay the betting season from the preseason board"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # one group per workflow: GitHub cancels a pending run whenever a newer one queues
  # in the same group, and post-game runs in all three would have collided
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  betting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: betting/tools
      - name: Grade the week and write state.json
        run: node betting/tools/update.js ${{ inputs.rebuild && '--rebuild' || '' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: betting/joker/requirements.txt
      - run: pip install -r betting/joker/requirements.txt
      - name: Score The Joker and write its picks into state.json
        run: python betting/joker/joker.py
      - name: Build the pages
        run: node betting/tools/build.js
      - name: Viewer smoke test
        run: node betting/tools/smoke.js
      - name: Commit if anything changed
        run: |
          git config user.name "nfl-hub bot"
          git config user.email "bot@users.noreply.github.com"
          git add betting/state.json betting/joker.json
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "betting: update $(date -u +'%Y-%m-%d %H:%M UTC')"
            # each job has its own concurrency group now, so two can finish together:
            # retry the pull-and-push, and fail honestly if all three attempts lose
            ok=0
            for i in 1 2 3; do
              if git pull --rebase && git push; then ok=1; break; fi
              echo "push raced another job, retrying ($i)"; sleep 15
            done
            [ "$ok" = 1 ]
          fi
