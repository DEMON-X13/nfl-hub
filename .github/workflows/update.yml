name: Update sites

on:
  schedule:
    # every 6 hours; grading is idempotent so extra runs are harmless
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Replay the betting season from the preseason board"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  betting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: betting/tools
      - name: Grade the week and write state.json
        run: node betting/tools/update.js ${{ inputs.rebuild && '--rebuild' || '' }}
      - name: Build the pages
        run: node betting/tools/build.js
      - name: Viewer smoke test
        run: node betting/tools/smoke.js
      - name: Commit if anything changed
        run: |
          git config user.name "nfl-hub bot"
          git config user.email "bot@users.noreply.github.com"
          git add betting/state.json betting/index.html betting/admin.html
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "betting: update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
