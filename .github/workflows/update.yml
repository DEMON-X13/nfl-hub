name: Update sites

on:
  schedule:
    # Three windows, in UTC (Eastern is UTC-4 in season). nflverse publishes the
    # stats files overnight after games, so each window has a morning run and an
    # afternoon catch-up in case the file was late. Runs that find nothing new
    # commit nothing. This job downloads only free nflverse files: no credits.
    - cron: "0 11 * * 5"    # Friday 7am ET: Thursday night game
    - cron: "0 17 * * 5"    # Friday 1pm ET: catch-up
    - cron: "0 11 * * 1"    # Monday 7am ET: Sunday games
    - cron: "0 17 * * 1"    # Monday 1pm ET: catch-up
    - cron: "0 11 * * 2"    # Tuesday 7am ET: Monday night game, week rolls over
    - cron: "0 17 * * 2"    # Tuesday 1pm ET: catch-up
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Replay the betting season from the preseason board"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  betting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: betting/tools
      - name: Grade the week and write state.json
        run: node betting/tools/update.js ${{ inputs.rebuild && '--rebuild' || '' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: betting/joker/requirements.txt
      - run: pip install -r betting/joker/requirements.txt
      - name: Score The Joker and write its picks into state.json
        run: python betting/joker/joker.py
      - name: Build the pages
        run: node betting/tools/build.js
      - name: Viewer smoke test
        run: node betting/tools/smoke.js
      - name: Commit if anything changed
        run: |
          git config user.name "nfl-hub bot"
          git config user.email "bot@users.noreply.github.com"
          git add betting/state.json betting/joker.json betting/index.html betting/admin.html
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "betting: update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
