name: Probe goalie sources
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== NHL schedule"; curl -sSL -m 25 "https://api-web.nhle.com/v1/schedule/now" | head -c 600; echo
          echo "== NHL landing for a game (goalie matchup?)"; ID=$(curl -sSL -m 25 "https://api-web.nhle.com/v1/schedule/now" | grep -o '"id":[0-9]\{10\}' | head -1 | cut -d: -f2); echo "game $ID"; curl -sSL -m 25 "https://api-web.nhle.com/v1/gamecenter/$ID/landing" | grep -o '"goalieComparison[^}]\{0,400\}' | head -3; curl -sSL -m 25 "https://api-web.nhle.com/v1/gamecenter/$ID/landing" | grep -o '"[a-zA-Z]*":' | sort | uniq -c | sort -rn | head -40 | tr '\n' ' '; echo
          echo "== DailyFaceoff"; curl -sSL -m 25 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36" -o /tmp/df -w '%{http_code} %{size_download}\n' "https://www.dailyfaceoff.com/starting-goalies/"; grep -o 'Confirmed\|Likely\|Unconfirmed\|Expected\|Projected' /tmp/df | sort | uniq -c; grep -o '__NEXT_DATA__' /tmp/df | head -1; grep -o '"goalies":\[[^]]\{0,300\}' /tmp/df | head -2
          echo "== Rotowire"; curl -sSL -m 25 -A "Mozilla/5.0" "https://www.rotowire.com/hockey/nhl-lineups.php" | grep -o 'lineup__player[^<]\{0,200\}' | head -5
