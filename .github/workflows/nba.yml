name: Update NBA

on:
  schedule:
    # Once a morning after the last West Coast final (7am Eastern = 11:00 UTC in autumn, 12:00 in winter:
    # the later of the two is still hours after the last game). ESPN's public scoreboard only: no credits.
    # Off season and empty days cost a few requests and commit nothing.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "First day to pull (YYYY-MM-DD). Blank = the day after the last final in games.csv"
        type: string
        default: ""
      to:
        description: "Last day to pull (YYYY-MM-DD). Blank = ten days out"
        type: string
        default: ""
      fit:
        description: "Refit the model's parameters on the fit seasons"
        type: boolean
        default: false
  push:
    # a change to the NBA tools runs them once, so a fix is proven straight away. On a claude/ branch the
    # run commits to that branch; the schedule and the on-demand switch only work from main.
    branches: [main, "claude/**"]
    paths: ["nba-hub/tools/*.js"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  nba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the branch head, not the pushed commit: a run queued behind another must see what that one committed
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Pull results and the coming slate from ESPN
        run: node nba-hub/tools/fetch.js ${{ inputs.from && format('--from {0}', inputs.from) || '' }} ${{ inputs.to && format('--to {0}', inputs.to) || '' }}
      - name: Pull box scores, the injury report and the coaches
        run: node nba-hub/tools/fetch_box.js
      - name: Replay the ratings and price the slate
        run: node nba-hub/tools/elo.js ${{ inputs.fit && 'fit' || '' }}
      - name: Replay the player, coach and matchup model
        run: node nba-hub/tools/players.js ${{ inputs.fit && 'fit' || '' }}
      - name: Commit if anything changed
        run: |
          git config user.name "nfl-hub bot"
          git config user.email "bot@users.noreply.github.com"
          git add nba-hub/data nba-hub/model.json nba-hub/players.json
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "nba: update $(date -u +'%Y-%m-%d %H:%M UTC')"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase && git push; then ok=1; break; fi
              echo "push raced another job, retrying ($i)"; sleep 15
            done
            [ "$ok" = 1 ]
          fi
