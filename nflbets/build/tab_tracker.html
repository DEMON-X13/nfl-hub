<!-- The Season Tracker tab (every name nt-): the tracker, news/, framed from its own address. Its
     scripts and styles never meet this page's (both declare esc, currentWeek and seasonOver at the
     top level), and nothing of it is in this page, so a news job commit or a new week's script tag
     never needs this page rebuilt. The build reads nothing from news/; what this tab relies on in the
     tracker (#ov and its class on, .slot[data-game], ov.dataset.game, Escape, html.embed) is held by
     news/tools/smoke.js, which mounts this script on the real tracker, so a tracker change that would
     break the tab fails the news job, never the elo job's morning smoke.
     Inlined by build.js: the section beside the framed betting tabs, the styles in the head, the
     script last. -->
<style>
/* as tall as the slate, so the page scrolls as one (framed, the tracker is html.embed: its bar is the
   week's heading in the flow and its own back-to-top button is gone, news/css/style.css) */
#tab-tracker .nt-frame{display:block;width:100%;border:0;min-height:360px;background:transparent}
#tab-tracker .nt-frame.nt-failed{display:none}
/* while a game's window is open the frame is laid over the whole screen: the tracker's window is
   fixed to its frame, so it is then fixed to the screen as on the tracker's own page, and the slate
   under its backdrop is drawn exactly where it was (the body placed by the script). It stays
   transparent, as the framed tracker's canvas is, so the backdrop dims this page as it stands */
#tab-tracker .nt-frame.nt-lifted{position:fixed;inset:0;width:100%;height:100%!important;min-height:0;z-index:1000}
#tab-tracker .nt-note{margin:0 0 14px;padding:12px 16px;background:var(--gold-soft);border-radius:var(--r-md);color:#8A5E05;line-height:1.55}
#tab-tracker .nt-note[hidden]{display:none}
#tab-tracker .nt-note a{color:inherit;font-weight:600}
/* this page's back-to-top button, standing in for the tracker's own, on this tab only */
.nt-top{position:fixed;right:16px;bottom:16px;z-index:40;width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);box-shadow:var(--sh-md);font:inherit;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nt-top:hover{color:var(--ink)}
/* and gone with the tracker when the note says it did not load, leaving nothing to scroll (the note
   comes before it in the section) */
#tab-tracker .nt-note:not([hidden]) ~ .nt-top{display:none}
@media print{.nt-top{display:none}}
</style>
<section id="tab-tracker" hidden>
  <p class="nt-note" id="ntNote" hidden>The Season Tracker did not load here. <a href="../news/index.html?standalone">Open it on its own page</a>, or reload this page to try again.</p>
  <iframe class="nt-frame" data-src="../news/index.html" title="Season Tracker"></iframe>
  <button class="nt-top" id="ntTop" type="button" aria-label="Back to top">&uarr;</button>
</section>
<script>
(function(){
const sec=document.getElementById('tab-tracker'), f=sec&&sec.querySelector('iframe.nt-frame');
if(!f) return;
/* this page inside its own tracker frame (a tracker whose guard sent its framed copy here): it never
   frames the tracker again, so a misfire is one page deep, never a page inside a page inside a page */
try{ const fe=window.frameElement; if(fe&&fe.classList&&fe.classList.contains('nt-frame')) return; }catch(e){}
const root=document.documentElement, note=document.getElementById('ntNote'), top=document.getElementById('ntTop'), header=document.querySelector('header');
/* a scroll at once on a page that scrolls smoothly (html{scroll-behavior:smooth}): Chrome reads the
   behaviour before it restyles, so the inline 'auto' is read back before the scroll */
const jump=y=>{ root.style.scrollBehavior='auto'; void getComputedStyle(root).scrollBehavior; scrollTo(0,y); root.style.scrollBehavior=''; };
/* the page as if no game were open: the frame back in it, the page free to scroll, the header live.
   Called on every new document and whenever lifting or dropping throws, so the page is never left
   held still */
const release=()=>{ f.classList.remove('nt-lifted'); sec.style.minHeight=''; root.style.overflow=''; if(header) header.inert=false; if(top) top.inert=false; };
let cur=null, curDoc=null, poll=0;   /* the hooks on the tracker's current document, that document, and the look for it */
/* loaded the first time its tab is shown, like the betting frames. ?t= so a reload of this page
   takes the tracker's page fresh: it lists the week files, and an old copy of it beside a new
   data/weeks.js would name a week it never loads (the data files keep GitHub Pages' ten minutes).
   The tracker is hooked as soon as it has drawn its week (attach, below), so it is looked for every
   tenth of a second from here */
const load=()=>{ if(sec.hidden||f.dataset.loaded) return; f.dataset.loaded='1'; f.src=f.dataset.src+'?t='+Date.now(); poll=setInterval(()=>attach(false),100); };
/* leaving the tab (by the address; the bar is under the lifted frame) closes the window the tracker's own way */
const shut=()=>{ try{ if(cur) cur.shut(); }catch(e){ release(); } };
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{ shut(); setTimeout(load,0); }));
addEventListener('hashchange',shut);
if(top) top.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
/* the tracker is hooked as soon as it has drawn its week, not only at its load event: that waits for
   its web font (Manrope, which this page does not load), and until then the frame would be a 360px
   box scrolling by itself, with a game opened in it never laid over the screen. At the load event
   whatever is there is judged (a 404, an error page), and a document is never hooked twice: the one
   hooked is kept only once the hook took, so a page written into the same document after a failed
   one is still hooked */
const attach=done=>{
  let w,d; try{ w=f.contentWindow; d=f.contentDocument; }catch(e){ d=null; }
  if(done) clearInterval(poll);
  if(!d){
    /* on the web the tracker is this site's own page: a frame this page cannot read once it has loaded
       is the browser's error page (offline, a dropped connection) or a portal, said as a 404 is. From
       disk (file://, its own origin in Chrome) the tracker shows, unhooked */
    if(done&&/^https?:$/.test(location.protocol)){ release(); cur=null; curDoc=null; if(note) note.hidden=false; f.classList.add('nt-failed'); }
    return;
  }
  if(!w||!d.body||d===curDoc) return;
  if(!done&&(d.readyState==='loading'||!d.querySelector('#view .slot'))) return;
  release(); cur=null; curDoc=null;
  try{ cur=hook(w,d); }catch(e){ release(); }
  if(cur){ curDoc=d; clearInterval(poll); }
};
f.addEventListener('load',()=>attach(true));
/* the only load that fills the frame when the page is opened on #tracker, where news/ sends every
   visitor: the Pick'ems tab's routeTabs opens the tab during its boot, before the click listeners
   above exist */
load();

function hook(w,d){
  const dr=d.documentElement;
  /* the tracker drew its week, or what loaded is not the tracker (an error page, a tracker that
     threw): then it says so, with the tracker's own page, in place of a blank box */
  const ok=!!d.querySelector('#view .slot');
  if(note) note.hidden=ok;
  f.classList.toggle('nt-failed',!ok);
  if(!ok) return null;
  /* the frame takes its content's height and never scrolls up and down itself (frames() in
     tab_pickems.html says why); measured by the document's own height, which shrinks as well as
     grows (scrollHeight never drops below the frame's), so a phone turned back to portrait fits */
  dr.style.overflowY='hidden';
  const fit=()=>{ if(f.classList.contains('nt-lifted')) return;
    const h=Math.ceil(dr.getBoundingClientRect().height); if(h>0&&Math.abs(h-(parseFloat(f.style.height)||0))>1) f.style.height=h+'px'; };
  fit();
  if(window.ResizeObserver) new ResizeObserver(fit).observe(d.body); else setInterval(fit,800);
  /* a tracker with no game window is still fitted, and counts as hooked, so it is never hooked again */
  const ov=d.getElementById('ov'); if(!ov) return { shut(){} };
  ov.style.overscrollBehavior='contain';
  const tileOf=k=>[...d.querySelectorAll('.slot[data-game]')].find(s=>s.dataset.game===k)||null;
  let open=null;
  /* the body is placed where the frame was: same width and left edge, the frame's top as padding
     (or the document scrolled up by it), and room below so it can scroll that far */
  const place=r=>{ const vh=innerHeight;
    Object.assign(d.body.style,{width:r.width+'px',marginLeft:r.left+'px',paddingTop:Math.max(0,r.top)+'px',paddingBottom:Math.max(0,vh-r.bottom)+'px'});
    w.scrollTo(0,Math.max(0,-r.top)); };
  const follow=()=>{ const s=sec.getBoundingClientRect(); d.body.style.width=s.width+'px'; d.body.style.marginLeft=s.left+'px'; };
  const unplace=()=>{ Object.assign(d.body.style,{width:'',marginLeft:'',paddingTop:'',paddingBottom:''}); };
  const lift=()=>{
    /* a smooth scroll still running (a Tab onto a tile below the screen, then Enter at once) stops where
       it is: overflow:hidden does not stop it, and the page would go on moving under the slate */
    jump(scrollY);
    const r=f.getBoundingClientRect(), t=tileOf(ov.dataset.game);
    open={y:scrollY,vw:innerWidth,vh:innerHeight,key:ov.dataset.game,tileY:t?r.top+t.getBoundingClientRect().top:null};
    sec.style.minHeight=r.height+'px';          /* the page keeps its length while the frame is out of it */
    f.classList.add('nt-lifted'); root.style.overflow='hidden'; place(r);
    /* the page behind the window is out of reach, to a screen reader too */
    if(header) header.inert=true; if(top) top.inert=true;
    addEventListener('resize',follow);
  };
  const drop=()=>{
    const o=open; open=null; removeEventListener('resize',follow);
    unplace(); w.scrollTo(0,0); release(); fit();
    if(sec.hidden||!o) return;                   /* left by the address: nothing to put back */
    /* back where the visitor was, at once (this page scrolls smoothly), with the game's tile, which the
       focus goes back to, wholly in view: where it is not (opened by Enter while a Tab was still scrolling
       to it), the page scrolled the least that shows it whole. If the screen changed size while the window
       was open (a phone turned), with the tile where it stood, or as near as the turned screen allows,
       wholly in view: as low as it can stand whole. A tile taller than the screen is put at its top */
    const t=tileOf(o.key); let y=o.y;
    if(t){ const q=t.getBoundingClientRect(), at=scrollY+f.getBoundingClientRect().top+q.top, low=Math.max(0,innerHeight-Math.min(q.height,innerHeight));
      if((innerWidth!==o.vw||innerHeight!==o.vh)&&o.tileY!=null) y=at-Math.min(Math.max(0,o.tileY),low);
      else if(at-y<-1||at-y+q.height>innerHeight+1) y=at-(at-y<0?0:low); }
    jump(Math.max(0,y));
  };
  new MutationObserver(()=>{ const on=ov.classList.contains('on');
    try{ if(on&&!open) lift(); else if(!on&&open) drop(); }catch(e){ open=null; try{ unplace(); }catch(_){} release(); } })
    .observe(ov,{attributes:true,attributeFilter:['class']});
  /* a game the visitor opened before the tracker was hooked is laid over the screen now: the observer
     hears only a change of class */
  if(ov.classList.contains('on')) try{ lift(); }catch(e){ open=null; try{ unplace(); }catch(_){} release(); }
  return { shut(){ if(!open) return; d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true})); if(open) drop(); } };
}
})();
</script>
