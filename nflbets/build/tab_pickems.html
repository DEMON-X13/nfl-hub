<!-- The Pick'ems tab: its own styles, its section, its script. build.js sets these into the
     prop model's page, so every class and id here is prefixed pk- to stay clear of the prop
     model's own, which share the page. The script is one closure for the same reason. -->
<style>
/* the board row: the betting app's columns -- date, matchup, split bar, confidence, final
   score -- at the Props tab's size and type, so the two tabs read as one page: the same
   grid gutters, the same row padding, the same 13px display-face matchup and tags, the same
   date block, the same 20px score */
/* the split bar is back at the betting board's width; the free space goes between the columns, evenly */
.pk-gamehead,.pk-game{display:grid;grid-template-columns:120px 175px minmax(274px,358px) 138px 136px 136px;gap:14px;align-items:center;justify-content:space-between}
.pk-gamehead{padding:0 16px 8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pk-sep{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px;padding-top:12px;border-top:1px solid var(--line)}
.pk-gamehead .pk-c{text-align:center}
.pk-game{background:var(--panel);border:1px solid transparent;border-radius:var(--r-lg);padding:13px 16px;margin-bottom:10px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--sh-sm);transition:box-shadow .2s var(--ease),transform .2s var(--ease),border-color .2s var(--ease)}
.pk-game:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
/* a row is a button to its Game snapshot: Tab reaches it, Enter and Space open it */
.pk-game:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pk-game .pk-when{color:var(--ink-2);font-size:12px;line-height:1.35}
.pk-game .pk-when b{color:var(--ink);font-weight:600;display:block;font-size:13px;margin-bottom:5px}
.pk-matchup{font-family:var(--display);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;line-height:1;white-space:nowrap;min-width:0}
.pk-matchup .pk-at{color:var(--muted);font-size:11px;font-family:var(--body);font-weight:500;letter-spacing:.02em;flex:none}
.pk-matchup .pk-tw{position:relative;display:inline-flex;flex:none}
.pk-matchup .pk-res{position:absolute;top:-8px;width:16px;height:16px;border-radius:50%;background:var(--panel);border:1.5px solid currentColor;font-size:11px;font-weight:800;line-height:13px;text-align:center;font-family:var(--body);box-shadow:0 1px 2px rgba(15,27,45,.2)}
.pk-matchup .pk-tw.pk-away .pk-res{left:-9px} .pk-matchup .pk-tw.pk-home .pk-res{right:-9px}
.pk-matchup .pk-res.pk-ok{color:var(--pick)} .pk-matchup .pk-res.pk-bad{color:var(--miss)}
.pk-ttag{display:inline-block;text-align:center;font-family:var(--display);font-size:13px;font-weight:700;line-height:1;padding:5px 8px;border-radius:7px;border:1.5px solid;letter-spacing:.03em;flex:none;box-shadow:0 1px 2px rgba(15,27,45,.18),inset 0 1px 0 rgba(255,255,255,.18);text-shadow:0 1px 0 rgba(0,0,0,.12)}
.pk-ttag.pk-win{font-weight:800;box-shadow:0 2px 6px -1px rgba(15,27,45,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.pk-ttag.pk-mini{padding:4px 5px;min-width:40px;vertical-align:-1px}
.pk-probrow{display:flex;align-items:center;gap:10px;padding:0 14px;justify-content:center;min-width:0}
.pk-tlab{font-family:var(--display);font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.02em;flex:none;min-width:40px;text-align:center}
.pk-tlab.pk-win{color:var(--ink);font-weight:800}
.pk-probrow .pk-prob{flex:1;min-width:0}
.pk-prob{position:relative;height:28px;border-radius:999px;overflow:hidden;background:#E6EBF1;display:flex;box-shadow:inset 0 1px 3px rgba(15,27,45,.12)}
.pk-prob .pk-a,.pk-prob .pk-h{display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden}
.pk-prob .pk-a{justify-content:flex-start;border-right:1px solid rgba(15,27,45,.18)} .pk-prob .pk-h{justify-content:flex-end;margin-left:auto}
.pk-prob .pk-a span.pk-w,.pk-prob .pk-h span.pk-w{font-weight:800}
.pk-conf{text-align:center}
.pk-tier{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 10px 4px 8px;border-radius:999px;background:#E9EEF4;color:var(--ink-2);white-space:nowrap}
.pk-tier::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
.pk-tier.pk-high{background:var(--pick-soft);color:var(--pick)} .pk-tier.pk-med{background:var(--gold-soft);color:#8A5E05} .pk-tier.pk-coin{background:#FCECEA;color:#A8453A}
.pk-result{text-align:center;line-height:1.2;white-space:nowrap}
/* the score the model expects, in the final score's shape but quieter */
.pk-pred{text-align:center;line-height:1.2;white-space:nowrap}
.pk-pred .pk-psc{display:block;font-family:var(--display);font-size:17px;font-weight:700;color:var(--ink-2);letter-spacing:-.3px;font-variant-numeric:tabular-nums;margin-bottom:3px}
.pk-pred .pk-muted{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.pk-pred .pk-plab{display:none}
/* the side the model has ahead, as a smaller copy of the matchup's team tag */
.pk-pred .pk-pby{display:inline-flex;align-items:center;gap:5px}
.pk-pred .pk-pby .pk-ttag{font-size:10px;padding:3px 5px;min-width:32px;border-radius:5px;border-width:1px}
.pk-sc{display:block;font-family:var(--display);font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.pk-sc.pk-pend{color:var(--muted)}
.pk-result .pk-mwin{display:block;font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums;margin-bottom:3px}
.pk-result .pk-mwin.pk-ok{color:var(--pick)} .pk-result .pk-mwin.pk-bad{color:var(--miss)} .pk-result .pk-mwin.pk-tie{color:var(--ink-2)}
.pk-result .pk-muted{display:block;font-size:11px;color:var(--ink-2);line-height:1.3}
.livestamp.bad{color:var(--miss)}
.pk-note{margin:0 0 14px;padding:12px 16px;background:var(--gold-soft);border-radius:var(--r-md);color:#8A5E05;line-height:1.55}
/* a game at a neutral site: "vs", not "at" */
.pk-matchup .pk-at.pk-neutral{color:var(--ink-2);font-weight:600}
/* a framed betting tab: full width, no border, as tall as the tab it shows */
.pk-frame{display:block;width:100%;border:0;min-height:360px;background:transparent}
.pk-foot{margin:24px 0 0;color:var(--muted);font-size:12px;line-height:1.7}
.pk-foot a{color:var(--ink-2)}
/* between the phone card and a wide screen the six columns above need about 1,100px: narrower columns
   there, the split bar taking what is left, so the board never scrolls sideways (it did from 901 to
   about 1,100px wide, and the last column ran into the card's padding up to 1,140). The result column
   holds what the wide screen's does, a live "WAS leading 31–33" (about 134px at 15px), so it is 136px,
   the split bar giving up the room (at 108px that line ran past the card's edge on game day); and the
   layout runs to 1,160px, so a classic 15-17px scrollbar never leaves the wide layout short of its room
   (from 1,141 to 1,156px on Windows its last column ran into the card's padding) */
@media(min-width:901px) and (max-width:1160px){
  .pk-gamehead,.pk-game{grid-template-columns:96px 146px minmax(150px,1fr) 104px 112px 136px;gap:10px;justify-content:normal}
  .pk-gamehead{padding:0 12px 8px}
  .pk-game{padding:13px 12px}
  .pk-probrow{padding:0 4px}
  /* the matchup column names the teams already: the bar takes their labels' room */
  .pk-probrow .pk-tlab{display:none}
}
@media(max-width:900px){
  .pk-gamehead{display:none}
  /* one card per game, laid out the way the Props tab lays its out */
  .pk-game{grid-template-columns:1fr 1fr auto;gap:6px 10px;padding:13px 14px;justify-content:normal}
  .pk-game .pk-when{grid-column:1/3;grid-row:1;display:flex;gap:8px;align-items:baseline}
  .pk-game .pk-when b{display:inline;font-size:13px;margin:0}
  .pk-game .pk-result{grid-column:3;grid-row:1/3;align-self:center;padding-left:6px}
  .pk-matchup{grid-column:1/3;grid-row:2}
  .pk-probrow{grid-column:1/-1;grid-row:3;margin-top:4px;padding:0}
  .pk-conf{grid-column:1/3;grid-row:4;text-align:left}
  .pk-pred{grid-column:3;grid-row:4;text-align:right;padding-left:6px}
  .pk-pred .pk-psc{display:inline;font-size:15px;margin:0}
  .pk-pred .pk-plab{display:inline;font-size:11px;color:var(--muted);margin-right:6px}
  .pk-pred .pk-muted{display:none}
}
</style>
<section id="tab-pickems">
  <div class="bar">
    <label>Week <select id="pkWeek"></select></label>
    <span class="rec" id="pkWeekRec"></span>
    <span class="rec" id="pkSeasonRec"></span>
    <span class="grow"></span>
    <span class="livestamp" id="pkStamp"></span>
    <button class="btn quiet" id="pkNow" title="Read the scoreboard from ESPN now. Free: no odds-API credits, no job.">Refresh scores</button>
  </div>
  <div id="pkBoard"></div>
  <p class="pk-foot" id="pkFoot"></p>
</section>
<script>
/* ---------- the Pick'ems tab ----------
   Vegas is the baseline. The call on each game is the Vegas favourite: the chance each side
   wins from the closing moneylines nflverse publishes (state.json's odds, the book's margin
   taken out), the spread when a game has no moneyline, and the spread and total for the
   score it expects. The models (Alpha Model, the Joker and the ELO Model) are measured
   against it on the Pick'em Record. A tap on a game opens its Game snapshot (snapshot.html), with
   everything the site has on it; the snapshot's first button is the game's own page on the Props
   tab, where its game bets (to win, to cover and the total, the owner's call of 14 October 2026)
   and every player line are. Until that day a tap opened the row on those two buttons.

   Nothing is stored and nothing is picked here yet. */
(function(){
/*BETTING*/
const STATE_URL='betting/state.json';
/* season: the betting job's own, from state.json (the board's one source), never written in here */
const ST={sched:[],odds:{},season:null,state:null};
/* the scoreboard as last read, by game id: nothing here is saved anywhere */
const PK_LIVE={games:{},at:0,err:null,busy:false};
const el=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* the betting app's tag, in this tab's own class names */
const tag=(...a)=>BET.tag(...a).replace(/class="([^"]*)"/,(m,c)=>'class="'+c.split(' ').map(x=>'pk-'+x).join(' ')+'"');
/* the win-probability bar in the two clubs' own colours, as the NBA Hub and the NHL Hub draw theirs (the
   owner, 16 October 2026: the lime favourite read as neon). Each side wears its chip's colour (tagBg of
   tagColor), its percentage in textOn's ink, so it clears 4.5:1 as the chip does; where the two would read
   as one colour (two reds), the home side takes the first of its own colours that does not, else the
   track's grey. The pick's percentage is the bold one. Used by the board and the Game snapshot */
function probCols(a,h){
  const hsl=c=>{ const [r,g,b]=BET.hex2rgb(c).map(v=>v/255), mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
    const hh=!d?0:mx===r?((g-b)/d+6)%6:mx===g?(b-r)/d+2:(r-g)/d+4; return [hh*60,d,(mx+mn)/2]; };
  const near=(x,y)=>{ const [h1,c1,l1]=hsl(x), [h2,c2,l2]=hsl(y), dh=Math.min(Math.abs(h1-h2),360-Math.abs(h1-h2));
    return c1<.15||c2<.15 ? c1<.15&&c2<.15&&Math.abs(l1-l2)<.15 : dh<28&&Math.abs(l1-l2)<.18; };
  const ca=BET.tagBg(BET.tagColor(a));
  let ch=BET.tagBg(BET.tagColor(h));
  if(near(ca,ch)) ch=BET.teamCols(h).map(BET.tagBg).find(c=>!near(ca,c))||'#475068';
  return [{bg:ca,ink:BET.textOn(ca)},{bg:ch,ink:BET.textOn(ch)}];
}

/* the prop model's schedule row for a game, which is where its spread and the book's prices
   live. Keyed by the same nflverse id both sites use; null until the prop model has booted. */
const mkt=gid=>(typeof S==='object'&&S&&S.sched||[]).find(x=>x.id===gid)||null;

/* the schedule's kickoff (US Eastern) as an instant: Eastern's offset on that day is read
   from the browser's own zone tables, so the clock change needs no date written in here */
function kickAt(d,t){
  const guess=new Date(`${d}T${t}:00Z`);
  const inZone=z=>new Date(guess.toLocaleString('en-US',{timeZone:z}));
  const k=new Date(guess.getTime()+(inZone('UTC')-inZone('America/New_York')));
  return isNaN(k)?null:k;
}
/* the date and kickoff in the viewer's own time zone, with the zone's short name */
function fmtDate(g){
  if(!g.gameday) return ['',''];
  const k=g.gametime?kickAt(g.gameday,g.gametime):null, d=k||new Date(g.gameday+'T12:00:00');
  const day=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  const t=k?k.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',timeZoneName:'short'}):'';
  return [day,t];
}
const winnerOf=g=>g.result==null?null:(g.result>0?g.home_team:(g.result<0?g.away_team:null));
/* a game at a neutral site. nflverse marks most of them Neutral, but not every one (2026's
   PHI at JAX in London is down as a Jaguars home game), and every 9:30am Eastern kickoff is
   one played abroad, so either says it */
const neutral=g=>g.location==='Neutral'||g.gametime==='09:30';
/* nflverse runs the playoffs on as weeks 19-22 */
const PLAYOFF={19:'Wild Card',20:'Divisional',21:'Conference',22:'Super Bowl'};
const weekName=w=>w>18?(PLAYOFF[w]||'Playoffs '+(w-18)):'Week '+w;
/* ESPN's numbering: the regular season is seasontype 2, the playoffs seasontype 3 with weeks of
   their own (wild card 1 ... the Super Bowl 5, after the Pro Bowl's 4) */
const espnWeek=w=>w<=18?{type:2,week:w}:{type:3,week:w>=22?5:w-18};
/* where a game stands: the published result when the job has graded it, otherwise what the
   scoreboard said when it was last read. final says the game is over; live says it is on. */
function outcome(g){
  if(g.result!=null) return {final:true,live:false,as:g.away_score,hs:g.home_score,winner:winnerOf(g),clock:''};
  const s=PK_LIVE.games[g.game_id];
  if(!s||s.as==null||s.hs==null||s.state==='pre') return null;
  const winner=s.hs>s.as?g.home_team:(s.as>s.hs?g.away_team:null);
  return {final:s.state==='post',live:s.state==='live',as:s.as,hs:s.hs,winner,clock:s.clock||''};
}

/* what Vegas says: the home side's chance from the two moneylines with the book's margin
   taken out, or from the spread (a margin spread 13.5 points about it) where a game has no
   moneyline. The spread is the margin it expects, home side positive. Graded once the game
   has a published result. */
const ncdf=z=>{ const t=1/(1+0.2316419*Math.abs(z)), d=0.3989423*Math.exp(-z*z/2), q=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0?1-q:q; };
const mlImp=x=>x<0?-x/(-x+100):100/(x+100);
function call(g){
  const o=ST.odds[g.game_id], sp=g.spread_line!=null&&isFinite(g.spread_line)?+g.spread_line:null;
  let pHome=null;
  if(o&&isFinite(o.home)&&isFinite(o.away)&&o.home&&o.away){ const h=mlImp(+o.home), a=mlImp(+o.away); pHome=h/(h+a); }
  else if(sp!=null&&sp!==0) pHome=ncdf(sp/13.5);
  if(pHome==null) return null;
  const pick=pHome>=0.5?g.home_team:g.away_team, conf=Math.max(pHome,1-pHome);
  const margin=sp!=null?sp:13.5*Math.log(pHome/(1-pHome))/1.7;
  const graded=g.result!=null&&isFinite(g.result);
  return {pick,conf,pHome,margin,graded,correct:graded&&+g.result!==0?pick===winnerOf(g):null};
}

/* the game's own page on the Props tab, where its game bets (to win and to cover for both sides,
   and the total) and every player line are. The Game snapshot offers it where the prop model can
   open that page: it has the game, and the game's week is open there (weekOpen, as its slate keeps a
   game) */
function canProps(id){
  if(typeof S!=='object'||!S||!Array.isArray(S.sched)) return false;
  const row=mkt(id); return !!row&&(typeof weekOpen!=='function'||weekOpen(+row.w));
}
/* the page opened: its week chosen on the slate, the tab opened, then the page, as a click on the
   game there opens it (the prop model's own S.ui.game and renderSlate). With a player (pid, a gsis id
   as the lineups and the prop model's depth chart write it: a starter's name in the snapshot's Starters
   card, the owner's call of 16 October 2026, "in starters, make player names clickable to their props
   page"), the page opens with his row open, as a Mismatches bubble opens him (S.ui.open), brought into
   view, highlighted and focused; without one, or where the page draws no row for him, the Game bets
   card is brought into view as before */
function openOnProps(id,pid){
  const row=mkt(id); if(!row||typeof renderSlate!=='function') return;
  const ws=document.getElementById('weekSel');
  if(ws&&[...ws.options].some(o=>+o.value===+row.w)) ws.value=String(row.w);
  const tab=document.querySelector('#tabs button[data-tab="slate"]'); if(tab) tab.click();
  S.ui.game=row.id; S.ui.open=pid?{[pid]:true}:{}; save(); renderSlate();
  const pr=pid?[...document.querySelectorAll('#gameView [data-open]')].find(b=>b.dataset.open===pid):null;
  if(pr){ try{ if(typeof window.eloFocusPlayer==='function') window.eloFocusPlayer(pid); else if(pr.scrollIntoView) pr.scrollIntoView({block:'start'}); }catch(e){}
    try{ pr.focus({preventScroll:true}); }catch(e){} return; }
  /* the page opens at its head; this button was for the game bets, so they are brought into view
     (they follow the game's suggested parlays, which a phone shows a screen of first) */
  const gb=document.querySelector('#gameView .gbets'); try{ if(gb&&gb.scrollIntoView) gb.scrollIntoView({block:'start'}); }catch(e){}
}
/* the players the game's page on the Props tab draws as a row to open (renderGame: on its roster, as
   the page shows it, with a line to bet), so the snapshot links a starter there only where his row is;
   an empty set where the page cannot open the game or the prop model cannot say */
function propsPlayers(id){
  const out=new Set();
  try{ if(!canProps(id)||typeof rosterFor!=='function'||typeof statLines!=='function') return out;
    const g=mkt(id), R=rosterFor(g,!!(S.ui&&S.ui.showAll));
    for(const t of [g.a,g.h]) for(const x of (R[t]&&R[t].players)||[]) if(statLines(x).length) out.add(x.pl.id);
  }catch(e){ out.clear(); }
  return out;
}
/* a game's row is a button to its Game snapshot: a click, or Enter or Space with the row focused, as
   a button takes them: Enter as it goes down, Space as it comes up (opened on its way down, the focus
   already on the window's Close as it came up would click that). Wired once, on the board, so a
   redraw (a new week, a scoreboard read) never opens a window */
function wireRows(){
  const open=card=>{ if(card&&typeof window.gameSnapshot==='function') window.gameSnapshot(card.dataset.game,card); };
  const row=e=>{ const card=e.target&&e.target.closest&&e.target.closest('.pk-game[data-game]'); return card&&card===e.target?card:null; };
  const space=k=>k===' '||k==='Spacebar';
  let down=null;
  el('pkBoard').addEventListener('click',e=>{ open(e.target.closest&&e.target.closest('.pk-game[data-game]')); });
  el('pkBoard').addEventListener('keydown',e=>{
    const card=row(e); if(!card) return;
    if(e.key==='Enter'){ e.preventDefault(); open(card); }
    else if(space(e.key)){ e.preventDefault(); down=card; }
  });
  el('pkBoard').addEventListener('keyup',e=>{
    if(!space(e.key)) return;
    const card=row(e), was=down; down=null;
    if(card&&card===was){ e.preventDefault(); open(card); }
  });
}

/* did the call land: the job's grade once it has one, the scoreboard's winner until then */
function landed(c,o){
  if(!c||!o||!o.final) return null;
  if(c.graded) return c.correct;
  return o.winner?c.pick===o.winner:null;
}
/* the score Vegas expects: the spread split around the game's total. The total is the book's, posted before kickoff, when there
   is one, and otherwise the prop model's own points for each side, so nothing here knows the
   result. Whole points, and never a tie against the favourite. */
function predicted(g,c){
  if(!c||c.margin==null||!isFinite(c.margin)) return null;
  const row=mkt(g.game_id);
  /* nflverse's total beside its spread when state.json carries one, so the score is one line */
  let tot=g.total_line!=null&&isFinite(g.total_line)?+g.total_line:null, src='book total';
  if(tot==null) tot=row&&row.tot!=null&&isFinite(row.tot)?+row.tot:null;
  if(tot==null&&row&&typeof modelPoints==='function'){
    tot=modelPoints(g.away_team,g.home_team,false)+modelPoints(g.home_team,g.away_team,true); src='model total'; }
  if(tot==null||!isFinite(tot)) return null;
  let hs=Math.round((tot+c.margin)/2), as=Math.round((tot-c.margin)/2);
  if(hs===as){ if(c.pick===g.home_team) hs++; else as++; }
  return {as,hs,tot,src};
}
function predCell(g,c){
  const p=predicted(g,c);
  if(!p) return '<span class="pk-psc">–</span>';
  const lead=p.hs>p.as?g.home_team:g.away_team, by=Math.abs(p.hs-p.as);
  return `<span class="pk-plab">Predicted</span><span class="pk-psc" title="${esc(g.away_team)} ${p.as}, ${esc(g.home_team)} ${p.hs}: the model's margin around the ${p.src} of ${Math.round(p.tot*2)/2}">${p.as}–${p.hs}</span><span class="pk-muted pk-pby">${tag(lead,BET.tagColor(lead),false,'mini')} by ${by}</span>`;
}
function resultCell(g,c){
  const o=outcome(g);
  if(!o) return '<b class="pk-sc pk-pend">0 : 0</b>';
  const score=`${o.as}–${o.hs}`;
  if(o.live){
    /* on now: who leads, coloured by whether the call is ahead, the clock under it */
    const line=o.winner?`${o.winner} leading ${score}`:`Tied ${score}`;
    const cls=!c||!o.winner?'tie':(c.pick===o.winner?'ok':'bad');
    return `<span class="pk-mwin pk-${cls}">${esc(line)}</span><span class="pk-muted">${esc(o.clock)}</span>`;
  }
  const line=o.winner?`${o.winner} won ${score}`:`Tie ${score}`;
  const hit=landed(c,o);
  if(hit===null) return `<span class="pk-mwin pk-tie">${esc(line)}</span><span class="pk-muted">${c&&c.graded?'':'Awaiting stats'}</span>`;
  return `<span class="pk-mwin ${hit?'pk-ok':'pk-bad'}">${esc(line)}</span><span class="pk-muted">${hit?'Pick hit':'Pick missed'}</span>`;
}
function render(){
  const w=+el('pkWeek').value;
  const games=ST.sched.filter(g=>+g.week===w)
    .sort((a,b)=>((a.gameday||'')+(a.gametime||'')).localeCompare((b.gameday||'')+(b.gametime||'')));
  records(w);
  if(!games.length){ el('pkBoard').innerHTML='<div class="empty">No games scheduled for that week.</div>'; return; }
  /* the regular season over and no playoff game in the betting job's schedule: say so, rather
     than leave week 18 looking like a week still to come */
  const over=ST.sched.length&&ST.sched.every(g=>g.result!=null)&&!ST.sched.some(g=>+g.week>18)
    ?`<div class="pk-note" id="pkOver"><b>The ${esc(String(ST.season||''))} regular season is over.</b> The playoffs are not on this board: the betting job's schedule is the regular season. Every week stays here to look back on.</div>`:'';
  const HEAD='<div class="pk-gamehead"><div>Date</div><div>Matchup</div><div class="pk-c">Win probability</div><div class="pk-c">Confidence</div><div class="pk-c">Score prediction</div><div class="pk-c">Final score</div></div>';
  const row=g=>{
    const c=call(g), [day,time]=fmtDate(g), o=outcome(g), win=o&&o.final?o.winner:null;
    const pick=c?c.pick:null;
    const pa=c?Math.round((1-c.pHome)*100):50, ph=100-pa, pc=probCols(g.away_team,g.home_team);
    const [tc,tl]=c?BET.tier(c.conf):['','–'];
    /* tick or cross on the winner's tag: did the model's pick win? */
    let markA='',markH='';
    const hit=landed(c,o);
    if(win&&hit!==null){
      const mk=`<span class="pk-res ${hit?'pk-ok':'pk-bad'}" title="${hit?'Pick hit':'Pick missed'}">${hit?'✓':'✗'}</span>`;
      if(win===g.away_team) markA=mk; else markH=mk; }
    return `<div class="pk-game${o&&o.final?' pk-played':''}" data-game="${esc(g.game_id)}" role="button" tabindex="0" aria-haspopup="dialog">
      <div class="pk-when"><b>${esc(day)}</b>${esc(time)}</div>
      <div class="pk-matchup"><span class="pk-tw pk-away">${tag(g.away_team,BET.tagColor(g.away_team),pick===g.away_team,'mini')}${markA}</span>${neutral(g)?`<span class="pk-at pk-neutral" title="${esc('Neutral site'+(g.stadium?': '+g.stadium:''))}">vs</span>`:'<span class="pk-at">at</span>'}<span class="pk-tw pk-home">${tag(g.home_team,BET.tagColor(g.home_team),pick===g.home_team,'mini')}${markH}</span></div>
      <div class="pk-probrow" aria-label="${esc(g.away_team)} ${pa}%, ${esc(g.home_team)} ${ph}%">
        <span class="pk-tlab${pick===g.away_team?' pk-win':''}">${esc(g.away_team)}</span>
        <div class="pk-prob"><div class="pk-a" style="width:${pa}%;background:${pc[0].bg};color:${pc[0].ink}"><span class="${pick===g.away_team?'pk-w':''}">${pa>=14?pa+'%':''}</span></div><div class="pk-h" style="width:${ph}%;background:${pc[1].bg};color:${pc[1].ink}"><span class="${pick===g.home_team?'pk-w':''}">${ph>=14?ph+'%':''}</span></div></div>
        <span class="pk-tlab${pick===g.home_team?' pk-win':''}">${esc(g.home_team)}</span>
      </div>
      <div class="pk-conf">${c?`<span class="pk-tier pk-${tc}">${tl} ${Math.round(c.conf*100)}%</span>`:'<span class="pk-tier">no call yet</span>'}</div>
      <div class="pk-pred">${predCell(g,c)}</div>
      <div class="pk-result">${resultCell(g,c)}</div>
    </div>`;
  };
  /* the games still to play, live ones too, first in kickoff order; the finals under a heading,
     so the evening's games are not below a screen of results */
  const fin=g=>{ const o=outcome(g); return !!(o&&o.final); };
  const todo=games.filter(g=>!fin(g)), done=games.filter(fin);
  el('pkBoard').innerHTML=over+HEAD+todo.map(row).join('')+(done.length?'<div class="pk-sep">Completed</div>'+done.map(row).join(''):'');
}

/* the scoreboard, read from ESPN in this browser: free, no odds-API credits, no job. One
   call covers the week on screen, asked for in the season state.json is for and in ESPN's own
   numbering of the week, so a playoff week reads too. The prop model's own ESPN reader maps
   the games onto this board's week (both sites key them the same way). Nothing read here is
   stored or graded: the week is still settled by the betting job, from nflverse, on its next
   run. */
async function readScores(){
  if(PK_LIVE.busy) return;
  PK_LIVE.busy=true; stamp('reading…');
  try{
    const wk=+el('pkWeek').value, e=espnWeek(wk);
    const season=ST.season||(typeof SEASON!=='undefined'?SEASON:'');
    const r=await fetch(`${ESPN_SB}?seasontype=${e.type}&week=${e.week}&dates=${season}`,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    PK_LIVE.games=espnGames(await r.json(),ST.sched.filter(g=>+g.week===wk).map(g=>({id:g.game_id,h:g.home_team,a:g.away_team})));
    PK_LIVE.err=null; PK_LIVE.at=Date.now();
  }catch(e){ PK_LIVE.err=String(e&&e.message||e); }
  finally{ PK_LIVE.busy=false; }
  stamp(); render();
}
function stamp(text){
  const s=el('pkStamp'); if(!s) return;
  s.classList.toggle('bad',!!PK_LIVE.err);
  s.textContent=text!=null?text:(PK_LIVE.err?'scores not loading':(PK_LIVE.at?'scores '+new Date(PK_LIVE.at).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',second:'2-digit'}):''));
}

/* the Props tab's stamp, in this page's words: nothing until the scoreboard has been read,
   then when, or that it is not loading. The prop model's own version opens on "scores off",
   which named a picker this page does not have. */
window.slateStamp=function(){
  const s=document.getElementById('slateStamp'); if(!s) return;
  s.classList.toggle('bad',!!LIVE.err);
  s.textContent=LIVE.err?'scores not loading':(LIVE.at?'scores '+new Date(LIVE.at).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',second:'2-digit'}):(LIVE.busy?'reading…':''));
};

/* Vegas's record: the favourite against the result, game by game */
function records(w){
  const rows=ST.sched.map(g=>({week:+g.week,c:call(g)})).filter(r=>r.c&&r.c.graded);
  const line=f=>{ const r=rows.filter(f); const won=r.filter(x=>x.c.correct===true).length, lost=r.filter(x=>x.c.correct===false).length;
    return `${won}–${lost}`; };
  el('pkWeekRec').innerHTML=`Vegas · ${w>18?esc(weekName(w)):'week '+w} <b>${line(r=>r.week===w)}</b>`;
  el('pkSeasonRec').innerHTML=`Season <b>${line(()=>true)}</b>`;
}

function foot(){
  el('pkFoot').innerHTML=`Vegas is the baseline: each call is the Vegas favourite, its chance from the closing moneylines with the book's margin taken out, and its score from the spread and total. Alpha Model, the Joker and the ELO Model are measured against it on the Pick'em Record. Tap a game for its Game snapshot: everything the site has on it, the week's preview, Offense vs defense with the matchups position by position, the starters and the mismatches, and a button to its game bets and player props on the Props tab.`;
}

/* the Game snapshot (nflbets/build/snapshot.html) reads the board through this: the season as
   loaded (ST.state is state.json whole), the Vegas call, where a game stands, its kickoff and site,
   and whether the Props tab can open the game's page, which players it draws there, and the opening
   of it, at a player's row or its game bets */
window.pkBoard={ST,call,outcome,fmtDate,kickAt,neutral,weekName,winnerOf,tag,BET,probCols,propsPlayers,canProps,openOnProps};

/* tabs as addresses: a tab's address is its button's data-tab (#slate the Props tab, #suggest Suggest
   Parlays since app v111, #parlay the Parlay Builder), and a reload stays where it was. On a phone the
   bar is wider than the screen and scrolls sideways, so the chosen tab is brought into it, on load,
   on a new address and on a tap: landing on #xparlays (where the old Live Parlays links go) left
   its button off the bar's right edge. Only the bar scrolls, never the page. The Season Tracker tab
   is gone (14 October 2026: its games are in each Game snapshot), so its old address, #tracker, where
   news/ sent every visitor, lands here on the board. The board is the Matchups tab since the owner's
   call of 16 October 2026 ("change the name Pickems to matchups"), and #matchups its address; its
   section and button keep the id pickems, which the prop model's tab switch reads (tab-pickems), so
   the old #pickems, in every bookmark and pickems/'s redirect, and #tracker land on it, the address
   written over as #matchups.

   X Parlays and the X Bet Log are the site owner's tabs alone since 20 October 2026 (the owner's call,
   "hide only": the admin link, nflbets/build/admin.js, which runs in the page's head and says whose browser
   this is, window.HUB_ADMIN). Their buttons carry data-admin-only (theme.css hides them from the first
   paint unless html[data-admin="on"]); on a visitor's page they are taken off the bar before anything
   wires them, so nothing can open them, and #xparlays and #bets (the old Live Parlays links among them)
   land on the board, written over as #matchups, as #tracker does. Signing out (hub-admin) takes them off
   the bar the same way, and an X tab that was open lands on the board. */
function routeTabs(){
  const admin=()=>{ try{ return !!(window.HUB_ADMIN&&window.HUB_ADMIN.on()); }catch(e){ return false; } };
  const ADMIN_ADDR=new Set(['#xparlays','#bets']);
  if(!admin()) document.querySelectorAll('#tabs [data-admin-only]').forEach(b=>b.remove());
  const nav=document.getElementById('tabs'); let btns=[...document.querySelectorAll('#tabs button')];
  const reveal=b=>{ try{ if(!nav||!b) return; const n=nav.getBoundingClientRect(), r=b.getBoundingClientRect();
    if(r.left>=n.left&&r.right<=n.right) return;
    nav.scrollLeft+=(r.left+r.width/2)-(n.left+n.width/2); }catch(e){} };
  const chosen=()=>btns.find(x=>x.getAttribute('aria-selected')==='true');
  /* a tab's address is its id but for the board's (both the go and the click must read it, or the
     click go() makes would write #pickems back over #matchups) */
  const ADDR={pickems:'matchups'}, addr=b=>'#'+(ADDR[b.dataset.tab]||b.dataset.tab);
  const go=()=>{ if(location.hash==='#tracker'||location.hash==='#pickems'||(!admin()&&ADMIN_ADDR.has(location.hash))) history.replaceState(null,'','#matchups');
    const b=btns.find(x=>addr(x)===location.hash); if(b&&b.getAttribute('aria-selected')!=='true') b.click(); reveal(b||chosen()); };
  btns.forEach(b=>b.addEventListener('click',()=>{ if(location.hash!==addr(b)) history.replaceState(null,'',addr(b)); reveal(b); }));
  window.addEventListener('hashchange',go); go();
  /* Sign out: the two tabs leave the bar, and one that was open lands on the board */
  document.addEventListener('hub-admin',()=>{ if(admin()) return;
    const open=document.querySelector('#tabs [data-admin-only][aria-selected="true"]');
    document.querySelectorAll('#tabs [data-admin-only]').forEach(b=>b.remove());
    btns=[...document.querySelectorAll('#tabs button')];
    if(open||ADMIN_ADDR.has(location.hash)){ history.replaceState(null,'','#matchups'); const b=btns.find(x=>x.dataset.tab==='pickems'); if(b&&b.getAttribute('aria-selected')!=='true') b.click(); reveal(b||chosen()); } });
  /* the web fonts can widen the buttons after the first layout: once more when they are in */
  if(document.readyState!=='complete') window.addEventListener('load',()=>reveal(chosen()),{once:true});
  try{ if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>reveal(chosen())); }catch(e){}
}

/* the betting tabs are the betting site's own page, framed. A frame loads the first time its
   tab is opened and then follows the height of what it shows, so the page scrolls as one.
   The frame never scrolls itself up and down: its height is set from its content, so a vertical
   overflow is met by the frame growing, never by a scrollbar of its own. With one allowed, a
   classic scrollbar (Windows Chrome's, with its arrows) stuck there with nothing to scroll: the
   charts are drawn at the frame's width, so the content was measured with the scrollbar's 15-17px
   taken off, came out a few px taller without it, overflowed again, and Chrome kept the bar.
   Sideways it still scrolls when something is really wider than the frame.

   The frame's document is this page's own: the betting app is carried here as a string
   (BET_APP, set by the build) and becomes the frame's srcdoc when its tab is first opened,
   with the tab's name written in front of it. Nothing is fetched for it and nothing can be
   cached apart from this page, so a refresh of this page refreshes the frames with it. */
function frames(){
  /* the page's light or dark look (theme.js): a frame's document is given it when it is made and again
     when it loads, and a press of the switch reaches every frame already open */
  const look=()=>{ try{ if(window.hubTheme) return window.hubTheme.now(); }catch(e){} return document.documentElement.getAttribute('data-theme')==='light'?'light':'dark'; };
  const load=f=>{
    if(f.dataset.loaded||!f.dataset.embed||typeof BET_APP!=='string') return;
    f.dataset.loaded='1';
    f.addEventListener('load',()=>{
      let doc=null; try{ doc=f.contentDocument; }catch(e){ return; }
      if(!doc||!doc.documentElement) return;
      doc.documentElement.setAttribute('data-theme',look());
      doc.documentElement.style.overflowY='hidden';
      const fit=()=>{ const h=doc.documentElement.scrollHeight; if(h>0&&Math.abs(h-(parseFloat(f.style.height)||0))>2) f.style.height=h+'px'; };
      fit();
      if(window.ResizeObserver&&doc.body) new ResizeObserver(fit).observe(doc.body); else setInterval(fit,800);
    });
    let doc=BET_APP.replace('window.EMBED_TAB=null','window.EMBED_TAB='+JSON.stringify(f.dataset.embed));
    /* the hub look, laid over the app's own styles as it is over the page's (theme.css, by the build) */
    if(typeof window.THEME_FRAME_HEAD==='string'){ const i=doc.indexOf('</head>'); if(i>0) doc=doc.slice(0,i)+window.THEME_FRAME_HEAD+doc.slice(i); }
    /* in the frame's own <html> tag, so its first paint is in the page's look */
    doc=doc.replace(/<html\b/i,'<html data-theme="'+look()+'"');
    f.setAttribute('srcdoc',doc);
  };
  const show=()=>document.querySelectorAll('main section:not([hidden]) iframe.pk-frame').forEach(load);
  document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>setTimeout(show,0)));
  show();
}

async function boot(){
  routeTabs(); wireRows();
  let failed=false;
  try{
    const r=await fetch(STATE_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const st=await r.json();
    ST.sched=st.schedule||[]; ST.odds=st.odds||{}; ST.state=st;
    ST.season=+st.season||(ST.sched[0]?+String(ST.sched[0].game_id).slice(0,4):null);
  }catch(e){
    el('pkBoard').innerHTML=`<div class="pk-note"><b>The season could not be loaded.</b> ${esc(e.message||e)}<br>This tab reads <code>betting/state.json</code>; nothing is stored here.</div>`;
    failed=true;
  }
  /* the frames are wired either way: the betting tabs do not depend on this tab's fetch */
  frames();
  if(failed){ foot(); return; }
  const weeks=[...new Set(ST.sched.map(g=>+g.week))].sort((a,b)=>a-b);
  /* this week: the first with a game still to play */
  const openOn=weeks.find(w=>ST.sched.some(g=>+g.week===w&&g.result==null))||weeks[weeks.length-1];
  el('pkWeek').innerHTML=weeks.map(x=>`<option value="${x}" ${x===openOn?'selected':''}>${weekName(x)}</option>`).join('');
  el('pkWeek').addEventListener('change',render);
  el('pkNow').addEventListener('click',readScores);
  render(); foot();
  /* read once on load, so a game that has finished since the job last ran shows its result
     without being asked. The scoreboard is mapped onto the prop model's schedule, so this
     waits for the prop model to have one. */
  const ready=new Promise(res=>{ if(typeof S==='object'&&S&&S.sched) res(); else document.addEventListener('app-ready',res,{once:true}); });
  /* the prop model holds the book's totals, so the predictions fill in once it is up */
  ready.then(()=>{ render(); setTimeout(readScores,300); });
}
boot();
})();
</script>
