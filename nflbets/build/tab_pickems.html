<!-- The Pick'ems tab: its own styles, its section, its script. build.js sets these into the
     prop model's page, so every class and id here is prefixed pk- to stay clear of the prop
     model's own, which share the page. The script is one closure for the same reason. -->
<style>
/* the board row: the betting app's columns -- date, matchup, split bar, confidence, final
   score -- at the Props tab's size and type, so the two tabs read as one page: the same
   grid gutters, the same row padding, the same 13px display-face matchup and tags, the same
   date block, the same 20px score */
/* the split bar is back at the betting board's width; the free space goes between the columns, evenly */
.pk-gamehead,.pk-game{display:grid;grid-template-columns:120px 175px minmax(278px,358px) 138px 132px;gap:14px;align-items:center;justify-content:space-between}
.pk-gamehead{padding:0 16px 8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pk-gamehead .pk-c{text-align:center}
.pk-game{background:var(--panel);border:1px solid transparent;border-radius:var(--r-lg);padding:13px 16px;margin-bottom:10px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--sh-sm);transition:box-shadow .2s var(--ease),transform .2s var(--ease),border-color .2s var(--ease)}
.pk-game:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.pk-game.pk-open{border-color:var(--line-2)}
.pk-game .pk-when{color:var(--ink-2);font-size:12px;line-height:1.35}
.pk-game .pk-when b{color:var(--ink);font-weight:600;display:block;font-size:13px;margin-bottom:5px}
.pk-matchup{font-family:var(--display);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;line-height:1;white-space:nowrap;min-width:0}
.pk-matchup .pk-at{color:var(--muted);font-size:11px;font-family:var(--body);font-weight:500;letter-spacing:.02em;flex:none}
.pk-matchup .pk-tw{position:relative;display:inline-flex;flex:none}
.pk-matchup .pk-res{position:absolute;top:-8px;width:16px;height:16px;border-radius:50%;background:var(--panel);border:1.5px solid currentColor;font-size:11px;font-weight:800;line-height:13px;text-align:center;font-family:var(--body);box-shadow:0 1px 2px rgba(15,27,45,.2)}
.pk-matchup .pk-tw.pk-away .pk-res{left:-9px} .pk-matchup .pk-tw.pk-home .pk-res{right:-9px}
.pk-matchup .pk-res.pk-ok{color:var(--pick)} .pk-matchup .pk-res.pk-bad{color:var(--miss)}
.pk-ttag{display:inline-block;text-align:center;font-family:var(--display);font-size:13px;font-weight:700;line-height:1;padding:5px 8px;border-radius:7px;border:1.5px solid;letter-spacing:.03em;flex:none;box-shadow:0 1px 2px rgba(15,27,45,.18),inset 0 1px 0 rgba(255,255,255,.18);text-shadow:0 1px 0 rgba(0,0,0,.12)}
.pk-ttag.pk-win{font-weight:800;box-shadow:0 2px 6px -1px rgba(15,27,45,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.pk-ttag.pk-mini{padding:4px 5px;min-width:40px;vertical-align:-1px}
.pk-probrow{display:flex;align-items:center;gap:10px;padding:0 14px;justify-content:center;min-width:0}
.pk-tlab{font-family:var(--display);font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.02em;flex:none;min-width:40px;text-align:center}
.pk-tlab.pk-win{color:var(--ink);font-weight:800}
.pk-probrow .pk-prob{flex:1;min-width:0}
.pk-prob{position:relative;height:28px;border-radius:999px;overflow:hidden;background:#E6EBF1;display:flex;box-shadow:inset 0 1px 3px rgba(15,27,45,.12)}
.pk-prob .pk-a,.pk-prob .pk-h{display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden}
.pk-prob .pk-a{justify-content:flex-start;border-right:1px solid rgba(15,27,45,.18)} .pk-prob .pk-h{justify-content:flex-end;margin-left:auto}
.pk-prob .pk-a span.pk-w,.pk-prob .pk-h span.pk-w{font-weight:800}
.pk-conf{text-align:center}
.pk-tier{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 10px 4px 8px;border-radius:999px;background:#E9EEF4;color:var(--ink-2);white-space:nowrap}
.pk-tier::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
.pk-tier.pk-high{background:var(--pick-soft);color:var(--pick)} .pk-tier.pk-med{background:var(--gold-soft);color:#8A5E05} .pk-tier.pk-coin{background:#FCECEA;color:#A8453A}
.pk-result{text-align:center;line-height:1.2;white-space:nowrap}
.pk-sc{display:block;font-family:var(--display);font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.pk-sc.pk-pend{color:var(--muted)}
.pk-result .pk-mwin{display:block;font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums;margin-bottom:3px}
.pk-result .pk-mwin.pk-ok{color:var(--pick)} .pk-result .pk-mwin.pk-bad{color:var(--miss)} .pk-result .pk-mwin.pk-tie{color:var(--ink-2)}
.pk-result .pk-muted{display:block;font-size:11px;color:var(--ink-2);line-height:1.3}
/* the prop model's Game bets card, opened inside the same row. Its classes are the prop
   model's, so it is styled by the prop model's stylesheet; only the card chrome comes off */
.pk-gbody{grid-column:1/-1;border-top:1px solid var(--line);padding:12px 2px 2px;cursor:default}
.pk-gbody .gbets{background:none;border:0;border-radius:0;padding:0;margin:0;box-shadow:none}
.pk-gbody .gbets h2{font-size:16px;margin:0 0 6px}
.livestamp.bad{color:var(--miss)}
.pk-tolegs{margin:10px 0 0;font-size:12px;color:var(--muted)}
.pk-tolegs a{color:var(--ink-2)}
.pk-note{margin:0 0 14px;padding:12px 16px;background:var(--gold-soft);border-radius:var(--r-md);color:#8A5E05;line-height:1.55}
/* a framed betting tab: full width, no border, as tall as the tab it shows */
.pk-frame{display:block;width:100%;border:0;min-height:360px;background:transparent}
.pk-foot{margin:24px 0 0;color:var(--muted);font-size:12px;line-height:1.7}
.pk-foot a{color:var(--ink-2)}
@media(max-width:900px){
  .pk-gamehead{display:none}
  /* one card per game, laid out the way the Props tab lays its out */
  .pk-game{grid-template-columns:1fr 1fr auto;gap:6px 10px;padding:13px 14px;justify-content:normal}
  .pk-game .pk-when{grid-column:1/3;grid-row:1;display:flex;gap:8px;align-items:baseline}
  .pk-game .pk-when b{display:inline;font-size:13px;margin:0}
  .pk-game .pk-result{grid-column:3;grid-row:1/3;align-self:center;padding-left:6px}
  .pk-matchup{grid-column:1/3;grid-row:2}
  .pk-probrow{grid-column:1/-1;grid-row:3;margin-top:4px;padding:0}
  .pk-conf{grid-column:1/-1;grid-row:4;text-align:left}
  .pk-game .pk-gbody{grid-row:5}
  .pk-gbody table.rungs{display:block;overflow-x:auto;white-space:nowrap}
}
</style>
<section id="tab-pickems">
  <div class="bar">
    <label>Week <select id="pkWeek"></select></label>
    <span class="rec" id="pkWeekRec"></span>
    <span class="rec" id="pkSeasonRec"></span>
    <span class="grow"></span>
    <span class="livestamp" id="pkStamp"></span>
    <button class="btn quiet" id="pkNow" title="Read the scoreboard from ESPN now. Free: no odds-API credits, no job.">Refresh scores</button>
  </div>
  <div id="pkBoard"></div>
  <p class="pk-foot" id="pkFoot"></p>
</section>
<script>
/* ---------- the Pick'ems tab ----------
   Two models, one board. The call on each game is the betting model's, published by its own
   job in state.json because re-deriving it here would mean a second copy of a model that
   already exists. Open a game and the prop model's Game Bets sit underneath: the chance each
   side wins and covers, off its own team ratings, against what a book is charging. The prop
   model is the rest of this page, so its prices are its own functions on its own state.

   Nothing is stored and nothing is picked here yet. */
(function(){
/*BETTING*/
const STATE_URL='../betting/state.json';
const ST={sched:[],processed:{},picks:{}};
/* the scoreboard as last read, by game id: nothing here is saved anywhere */
const PK_LIVE={games:{},at:0,err:null,busy:false};
const el=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* the betting app's tag, in this tab's own class names */
const tag=(...a)=>BET.tag(...a).replace(/class="([^"]*)"/,(m,c)=>'class="'+c.split(' ').map(x=>'pk-'+x).join(' ')+'"');

/* the prop model's schedule row for a game, which is where its spread and the book's prices
   live. Keyed by the same nflverse id both sites use; null until the prop model has booted. */
const mkt=gid=>(typeof S==='object'&&S&&S.sched||[]).find(x=>x.id===gid)||null;

function fmtDate(g){
  if(!g.gameday) return ['',''];
  const d=new Date(g.gameday+'T12:00:00');
  const day=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  let t=g.gametime||'';
  if(t){ const [h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; const h12=h%12||12; t=`${h12}:${String(m).padStart(2,'0')} ${ap} ET`; }
  return [day,t];
}
const winnerOf=g=>g.result==null?null:(g.result>0?g.home_team:(g.result<0?g.away_team:null));
/* where a game stands: the published result when the job has graded it, otherwise what the
   scoreboard said when it was last read. final says the game is over; live says it is on. */
function outcome(g){
  if(g.result!=null) return {final:true,live:false,as:g.away_score,hs:g.home_score,winner:winnerOf(g),clock:''};
  const s=PK_LIVE.games[g.game_id];
  if(!s||s.as==null||s.hs==null||s.state==='pre') return null;
  const winner=s.hs>s.as?g.home_team:(s.as>s.hs?g.away_team:null);
  return {final:s.state==='post',live:s.state==='live',as:s.as,hs:s.hs,winner,clock:s.clock||''};
}

/* what the betting model says: the published call for an ungraded game, what was logged for
   a graded one */
function call(g){
  const done=ST.processed[g.game_id];
  if(done) return {pick:done.pick,conf:done.conf,pHome:done.pHome,graded:true,correct:done.correct};
  const p=ST.picks[g.game_id];
  return p?{pick:p.pick,conf:p.conf,pHome:p.pHome,graded:false,correct:null}:null;
}

/* the prop model's Game bets card for this game, exactly as the game's own page draws it:
   both teams, to win and to cover, a box on each line while the game can still be bet and
   a tick or a cross on each once it has a score. The card is the prop model's own function
   on its own schedule row, so this is the same card and not a copy of one. */
function gameBody(g){
  if(typeof S!=='object'||!S||!S.sched) return `<div class="pk-gbody"><span class="muted">The prop model is still loading. Close and open the game again in a moment.</span></div>`;
  const row=mkt(g.game_id);
  if(!row||!gameBet(row,row.h,'ml')) return `<div class="pk-gbody"><span class="muted">The prop model has no line for this game, so there is nothing to price it against.</span></div>`;
  const locked=gameStarted(row);
  let card=gameBetsCard(row,locked);
  if(card.split('class="card gbets"').length!==2) throw new Error("the Game bets card is not the shape this tab expects");
  card=card.replace('class="card gbets"','class="gbets"');
  const onHere=Object.keys(S.parlay||{}).filter(k=>k.startsWith(g.game_id+'|team:')).length;
  const note=locked?''
    :`<p class="pk-tolegs">Ticked lines go to <a href="#parlay">Parlay Builders</a>.${onHere?` ${onHere} from this game ${onHere===1?'is':'are'} on the parlay.`:''}</p>`;
  return `<div class="pk-gbody">${card}${note}</div>`;
}
/* a tick goes through the prop model's own toggleLeg, then the game's prices are redrawn
   so the row shows what is on the parlay now */
function wireLegs(){
  /* the parlay changed on another device: every open game redraws its ticks */
  document.addEventListener('nflsync-applied',()=>{
    el('pkBoard').querySelectorAll('.pk-game.pk-open').forEach(card=>{
      const g=ST.sched.find(x=>x.game_id===card.dataset.game), body=card.querySelector('.pk-gbody');
      if(g&&body) body.outerHTML=gameBody(g); });
  });
  el('pkBoard').addEventListener('change',e=>{
    const box=e.target; if(!box.matches||!box.matches('input[data-leg]')) return;
    const card=box.closest('.pk-game'), g=card&&ST.sched.find(x=>x.game_id===card.dataset.game); if(!g) return;
    toggleLeg(box.dataset.leg,+box.dataset.k,mkt(g.game_id),box.dataset.side||'over',box.dataset.main==='1');
    const body=card.querySelector('.pk-gbody'); if(body) body.outerHTML=gameBody(g);
  });
}

/* did the call land: the job's grade once it has one, the scoreboard's winner until then */
function landed(c,o){
  if(!c||!o||!o.final) return null;
  if(c.graded) return c.correct;
  return o.winner?c.pick===o.winner:null;
}
function resultCell(g,c){
  const o=outcome(g);
  if(!o) return '<b class="pk-sc pk-pend">0 : 0</b>';
  const score=`${o.as}–${o.hs}`;
  if(o.live){
    /* on now: who leads, coloured by whether the call is ahead, the clock under it */
    const line=o.winner?`${o.winner} leading ${score}`:`Tied ${score}`;
    const cls=!c||!o.winner?'tie':(c.pick===o.winner?'ok':'bad');
    return `<span class="pk-mwin pk-${cls}">${esc(line)}</span><span class="pk-muted">${esc(o.clock)}</span>`;
  }
  const line=o.winner?`${o.winner} won ${score}`:`Tie ${score}`;
  const hit=landed(c,o);
  if(hit===null) return `<span class="pk-mwin pk-tie">${esc(line)}</span><span class="pk-muted">${c&&c.graded?'':'Awaiting stats'}</span>`;
  return `<span class="pk-mwin ${hit?'pk-ok':'pk-bad'}">${esc(line)}</span><span class="pk-muted">${hit?'Pick hit':'Pick missed'}</span>`;
}
function render(){
  const w=+el('pkWeek').value;
  const games=ST.sched.filter(g=>+g.week===w)
    .sort((a,b)=>((a.gameday||'')+(a.gametime||'')).localeCompare((b.gameday||'')+(b.gametime||'')));
  records(w);
  if(!games.length){ el('pkBoard').innerHTML='<div class="empty">No games scheduled for that week.</div>'; return; }
  const HEAD='<div class="pk-gamehead"><div>Date</div><div>Matchup</div><div class="pk-c">Win probability</div><div class="pk-c">Confidence</div><div class="pk-c">Final score</div></div>';
  const wasOpen=new Set([...el('pkBoard').querySelectorAll('.pk-game.pk-open')].map(x=>x.dataset.game));
  el('pkBoard').innerHTML=HEAD+games.map(g=>{
    const c=call(g), [day,time]=fmtDate(g), o=outcome(g), win=o&&o.final?o.winner:null;
    const pick=c?c.pick:null;
    const pa=c?Math.round((1-c.pHome)*100):50, ph=100-pa;
    const [tc,tl]=c?BET.tier(c.conf):['','–'];
    /* tick or cross on the winner's tag: did the model's pick win? */
    let markA='',markH='';
    const hit=landed(c,o);
    if(win&&hit!==null){
      const mk=`<span class="pk-res ${hit?'pk-ok':'pk-bad'}" title="${hit?'Pick hit':'Pick missed'}">${hit?'✓':'✗'}</span>`;
      if(win===g.away_team) markA=mk; else markH=mk; }
    return `<div class="pk-game${o&&o.final?' pk-played':''}" data-game="${esc(g.game_id)}" role="button" aria-expanded="false">
      <div class="pk-when"><b>${esc(day)}</b>${esc(time)}</div>
      <div class="pk-matchup"><span class="pk-tw pk-away">${tag(g.away_team,BET.tagColor(g.away_team),pick===g.away_team,'mini')}${markA}</span><span class="pk-at">at</span><span class="pk-tw pk-home">${tag(g.home_team,BET.tagColor(g.home_team),pick===g.home_team,'mini')}${markH}</span></div>
      <div class="pk-probrow" aria-label="${esc(g.away_team)} ${pa}%, ${esc(g.home_team)} ${ph}%">
        <span class="pk-tlab${pick===g.away_team?' pk-win':''}">${esc(g.away_team)}</span>
        <div class="pk-prob"><div class="pk-a" style="width:${pa}%;background:${pa>=ph?BET.PROB_HI:BET.PROB_LO};color:#0B162A"><span class="${pick===g.away_team?'pk-w':''}">${pa>=14?pa+'%':''}</span></div><div class="pk-h" style="width:${ph}%;background:${ph>pa?BET.PROB_HI:BET.PROB_LO};color:#0B162A"><span class="${pick===g.home_team?'pk-w':''}">${ph>=14?ph+'%':''}</span></div></div>
        <span class="pk-tlab${pick===g.home_team?' pk-win':''}">${esc(g.home_team)}</span>
      </div>
      <div class="pk-conf">${c?`<span class="pk-tier pk-${tc}">${tl} ${Math.round(c.conf*100)}%</span>`:'<span class="pk-tier">no call yet</span>'}</div>
      <div class="pk-result">${resultCell(g,c)}</div>
    </div>`;
  }).join('');
  el('pkBoard').querySelectorAll('.pk-game').forEach(card=>card.addEventListener('click',e=>{
    if(e.target.closest('.pk-gbody')) return;          /* the prices are not a toggle */
    const open=card.classList.toggle('pk-open');
    card.setAttribute('aria-expanded',open?'true':'false');
    const had=card.querySelector('.pk-gbody');
    if(open&&!had){ const g=ST.sched.find(x=>x.game_id===card.dataset.game); card.insertAdjacentHTML('beforeend',gameBody(g)); }
    else if(!open&&had) had.remove();
  }));
  for(const gid of wasOpen){ const card=el('pkBoard').querySelector(`.pk-game[data-game="${CSS.escape(gid)}"]`); if(card) card.click(); }
}

/* the scoreboard, read from ESPN in this browser: free, no odds-API credits, no job. One
   call covers the week on screen. The prop model's own ESPN reader maps the games, since
   both sites key them the same way. Nothing read here is stored or graded: the week is
   still settled by the betting job, from nflverse, on its next run. */
async function readScores(){
  if(PK_LIVE.busy) return;
  PK_LIVE.busy=true; stamp('reading…');
  try{
    const wk=+el('pkWeek').value;
    const r=await fetch(`${ESPN_SB}?seasontype=2&week=${wk}&dates=${SEASON}`,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    PK_LIVE.games=espnGames(await r.json(),(typeof S==='object'&&S&&S.sched)||[]);
    PK_LIVE.err=null; PK_LIVE.at=Date.now();
  }catch(e){ PK_LIVE.err=String(e&&e.message||e); }
  finally{ PK_LIVE.busy=false; }
  stamp(); render();
}
function stamp(text){
  const s=el('pkStamp'); if(!s) return;
  s.classList.toggle('bad',!!PK_LIVE.err);
  s.textContent=text!=null?text:(PK_LIVE.err?'scores not loading':(PK_LIVE.at?'scores '+new Date(PK_LIVE.at).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',second:'2-digit'}):''));
}

/* the Props tab's stamp, in this page's words: nothing until the scoreboard has been read,
   then when, or that it is not loading. The prop model's own version opens on "scores off",
   which named a picker this page does not have. */
window.slateStamp=function(){
  const s=document.getElementById('slateStamp'); if(!s) return;
  s.classList.toggle('bad',!!LIVE.err);
  s.textContent=LIVE.err?'scores not loading':(LIVE.at?'scores '+new Date(LIVE.at).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',second:'2-digit'}):(LIVE.busy?'reading…':''));
};

/* the betting model's record, counted the way its own Records tab counts it */
function records(w){
  const rows=Object.values(ST.processed);
  const line=f=>{ const r=rows.filter(f); const won=r.filter(x=>x.correct===true).length, lost=r.filter(x=>x.correct===false).length;
    return `${won}–${lost}`; };
  el('pkWeekRec').innerHTML=`Week ${w} <b>${line(r=>+r.week===w)}</b>`;
  el('pkSeasonRec').innerHTML=`Season <b>${line(()=>true)}</b>`;
}

function foot(){
  el('pkFoot').innerHTML=`The call on each game is the betting model's, published by its own job. Open a game and the numbers underneath are the prop model's: the chance each side wins and covers, from its team ratings, with what a book would charge beside what one is charging. Two models, neither of them changed to sit here.
    <br>Nothing is picked on this tab yet.`;
}

/* tabs as addresses: #props opens the Props tab, and a reload stays where it was */
function routeTabs(){
  const btns=[...document.querySelectorAll('#tabs button')];
  const go=()=>{ const b=btns.find(x=>'#'+x.dataset.tab===location.hash); if(b&&b.getAttribute('aria-selected')!=='true') b.click(); };
  btns.forEach(b=>b.addEventListener('click',()=>{ if(location.hash!=='#'+b.dataset.tab) history.replaceState(null,'','#'+b.dataset.tab); }));
  window.addEventListener('hashchange',go); go();
}

/* the betting tabs are the betting site's own page, framed. A frame loads the first time its
   tab is opened and then follows the height of what it shows, so the page scrolls as one.

   The frame's document is this page's own: the betting app is carried here as a string
   (BET_APP, set by the build) and becomes the frame's srcdoc when its tab is first opened,
   with the tab's name written in front of it. Nothing is fetched for it and nothing can be
   cached apart from this page, so a refresh of this page refreshes the frames with it. */
function frames(){
  const load=f=>{
    if(f.dataset.loaded||!f.dataset.embed||typeof BET_APP!=='string') return;
    f.dataset.loaded='1';
    f.addEventListener('load',()=>{
      let doc=null; try{ doc=f.contentDocument; }catch(e){ return; }
      if(!doc||!doc.documentElement) return;
      const fit=()=>{ const h=doc.documentElement.scrollHeight; if(h>0&&Math.abs(h-(parseFloat(f.style.height)||0))>2) f.style.height=h+'px'; };
      fit();
      if(window.ResizeObserver&&doc.body) new ResizeObserver(fit).observe(doc.body); else setInterval(fit,800);
    });
    f.setAttribute('srcdoc',BET_APP.replace('window.EMBED_TAB=null','window.EMBED_TAB='+JSON.stringify(f.dataset.embed)));
  };
  const show=()=>document.querySelectorAll('main section:not([hidden]) iframe.pk-frame').forEach(load);
  document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>setTimeout(show,0)));
  show();
}

async function boot(){
  routeTabs(); wireLegs();
  let failed=false;
  try{
    const r=await fetch(STATE_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const st=await r.json();
    ST.sched=st.schedule||[]; ST.processed=st.processed||{}; ST.picks=st.picks||{};
  }catch(e){
    el('pkBoard').innerHTML=`<div class="pk-note"><b>The season could not be loaded.</b> ${esc(e.message||e)}<br>This tab reads <code>betting/state.json</code>; nothing is stored here.</div>`;
    failed=true;
  }
  /* the frames are wired either way: the betting tabs do not depend on this tab's fetch */
  frames();
  if(failed){ foot(); return; }
  const weeks=[...new Set(ST.sched.map(g=>+g.week))].sort((a,b)=>a-b);
  const graded=new Set(Object.values(ST.processed).map(r=>+r.week));
  const openOn=Object.keys(ST.picks).length
    ? +ST.sched.find(g=>ST.picks[g.game_id]).week
    : (weeks.filter(x=>graded.has(x)).pop()||weeks[0]);
  el('pkWeek').innerHTML=weeks.map(x=>`<option value="${x}" ${x===openOn?'selected':''}>${x>18?'Playoffs '+(x-18):'Week '+x}</option>`).join('');
  el('pkWeek').addEventListener('change',render);
  el('pkNow').addEventListener('click',readScores);
  render(); foot();
  /* read once on load, so a game that has finished since the job last ran shows its result
     without being asked. The scoreboard is mapped onto the prop model's schedule, so this
     waits for the prop model to have one. */
  const ready=new Promise(res=>{ if(typeof S==='object'&&S&&S.sched) res(); else document.addEventListener('app-ready',res,{once:true}); });
  ready.then(()=>setTimeout(readScores,300));
}
boot();
})();
</script>
