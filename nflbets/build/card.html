<!-- A parlay from the builder as a card: its styles, its window, its script. build.js sets these
     into the Bets and Stats page the way it sets the Pick'ems and Player Elo tabs in, every class
     and id prefixed pc-, the script one closure.

     X's parlays are a file (liveparlays/parlays.json, which nobody's page writes; since app v125 shown on the
     admin's devices alone), so no device keeps a list of its own: the Parlay Builder is everyone's to use,
     and its Save and lock is Finish parlay on every device (Pull from DraftKings, below, on the admin's alone). Finish parlay opens
     this window with the parlay drawn as a card -- every leg with its price, the parlay's price,
     the stake and what it pays, the book's fair chance first (DraftKings' prices with the margin
     taken out, parlayFair in the props parts; est. where a leg is priced on one side only), the
     model's chance beside it (an Elo pick's own, the Elo's) and the chance the price implies, the
     week and its dates, and the site's mark -- and Download saves it as a PNG, drawn on a canvas at
     twice its size. A parlay with a leg on no book price has no fair chance: the card gives the
     model's chance alone and says the fair chance needs every leg's book price. Where
     the browser can share a file (a phone), the share sheet is offered too, which is how an image
     reaches Photos.

     Open in DraftKings opens the parlay on DraftKings' betslip from DraftKings' own ids: for a team's line
     and the total, the ids the site's read of DraftKings' lines on ESPN carries (the props job's published
     read, a Refresh odds press, or this card's own check when it opens: PAY.dk, entries a read made); for a
     player's line, which ESPN gives no id for, only Pull from DraftKings, below, on the site owner's devices
     alone. The note under the buttons names any leg it cannot open and why (a visitor's player legs go on
     DraftKings by hand, and the note says so). Share link sends the parlay as a few lines of text with that
     link, by the share sheet or the clipboard. Neither touches the image.

     Pull from DraftKings (the owner's call of 20 October 2026: ESPN-only prices for everyone, and on his own
     devices, the admin link's, a button on the card that spends his Odds API credits on the parlay at hand
     alone): DraftKings' own prices and slip ids for the card's player legs, read through window.HUB_ADMIN
     (nflbets/build/admin.js, the only code on the page that holds the key or sends it, and only to The Odds
     API). A free look-up of the week's events, an inline confirm saying what it may spend (up to one credit a
     game and market, the markets DraftKings has not posted costing nothing), then one call a game. What it
     reads is kept in this window's memory alone (never S, never this browser's storage), placed on the
     game's players by the job's own name rule (props/build/names.py, ported here with its nicknames.json),
     and re-prices the builder and this card by the builder's own sums (window.dkPulledFor, read by the props
     parts' parlayLegs, legPrice and legFair). See "Pull from DraftKings" below.

     Since 19 October 2026 (the owner, on Monday night's Commanders at 49ers: "same thing again.... put in
     that link and its only showing" one leg of four) the card checks DraftKings' current lines when it
     opens: the page's own Refresh odds reader (espnRefresh in props/build/part3.js) reads the parlay's games
     alone, one at a time, and while it reads Open in DraftKings and Share link wait (at most CHECK_CAP_MS);
     then the plan is worked again, so a total or spread DraftKings has moved goes on at its current number
     on the id the read found, and a player's line DraftKings has moved since the pull read its id is said
     to add by hand at its new number, since the slip drops a moved id (dkLeg's moved rule, below).

     Nothing is saved: not to the prop model's saved list, not to X's parlays, not to any key of
     this page. The builder keeps its legs, so the parlay can be changed and finished again; Start
     over clears it. A suggested parlay (a tier of the Parlay Builder's suggestions, or one of its
     Elo picks) is finished the same way, from its own Finish button, on the amount in the panel's
     Bet amount box, which is the builder's own stake (pbStake()) and the one its tier pays on.

     The builder's numbers are the builder's own: build.js lifts its pricing block out of
     renderParlay in props/build/part3.js into quote() below (the /*QUOTE*/ slot), so the card's
     price can never drift from the one the builder shows. -->
<style>

<script>
window.PARLAY_CARD=(function(){
  const SITE='demon-x13.github.io/nfl-hub';
  const $=id=>document.getElementById(id);
  const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  /* every dollar figure whole, with its thousands marked: $17,620.00 */
  const money=v=>'$'+(+v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const pct=p=>p>0&&p<0.0005?'<0.1%':(p*100).toFixed(1)+'%';      // a long shot reads as under a tenth of a percent, not 0.0%
  const ml=x=>x==null||!isFinite(x)?'–':(x>0?'+'+x:'−'+Math.abs(x));
  /* the playoffs run on as weeks 19-22 */
  const weekText=w=>w==null?'':(w<=18?'Week '+w:({19:'Wild Card round',20:'Divisional round',21:'Conference championships',22:'Super Bowl'}[w]||'Week '+w));
  const game=gid=>(typeof S==='object'&&S&&Array.isArray(S.sched))?S.sched.find(x=>x.id===gid)||null:null;
  const ET={timeZone:'America/New_York'};
  const kick=g=>{ try{ return typeof kickoff==='function'&&g?kickoff(g):null; }catch(e){ return null; } };
  const dayOf=d=>d.toLocaleDateString('en-US',Object.assign({weekday:'short',month:'short',day:'numeric'},ET));
  const whenOf=d=>d.toLocaleString('en-US',Object.assign({weekday:'short',hour:'numeric',minute:'2-digit'},ET))+' ET';
  /* when DraftKings' lines were read: the day and date too, since a read can be a day or two old */
  const readOf=d=>d.toLocaleString('en-US',Object.assign({weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'},ET))+' ET';
  /* the days the legs are played on: one day, or the first and the last */
  function dates(legs){
    const ks=legs.map(l=>kick(game(l.gid))).filter(Boolean).sort((a,b)=>a-b);
    if(!ks.length) return '';
    const a=dayOf(ks[0]), b=dayOf(ks[ks.length-1]);
    return a===b?a:a+' – '+b;
  }
  /* the builder's numbers, as renderParlay works them out: its own lines, lifted at build time */
  function quote(){
    if(typeof S!=='object'||!S||typeof parlayLegs!=='function') return null;
    const legs=parlayLegs(); if(!legs.length) return null;
/*QUOTE*/
    return {legs,wks,pr,fair,prices,allBook,bookDec,sg,fairML,stake,override,realPrice,estPrice,useDec,payout,profit};
  }
  /* one leg as the card shows it: who, what (the market, the line and the side, as the builder
     labels it), the game and its kickoff, and its price with where the price came from */
  function leg(l,price,src){
    const g=game(l.gid), k=kick(g), team=l.grp==='TEAM';
    const meta=[team?'':l.pos, l.team&&l.opp?l.team+' v '+l.opp:'', k?whenOf(k):''].filter(Boolean).join(' · ');
    return {who:l.name||l.team||'', what:l.label||'', meta, price:ml(price), tag:src==='real'?'book':(src==='fair'?'fair':'est.')};
  }
  /* ---- DraftKings: the parlay on DraftKings' betslip ----
     PAY.dk is DraftKings' own id for an outcome, under the week and the game, keyed the way a leg is named here:
     <pid>|<stat>|over|<point> (or under: a player's line at DraftKings' point), <pid>|any_td (his touchdown),
     team:<ABBR>|ml, team:<ABBR>|ats|<the team's own line>, game|total|over|<point> (or under) and event (the
     game's page), with at (when a game's player prices, and so their ids, were read) and glat (when its game
     lines were). Since 20 October 2026 (the owner's call: no paid pull on any schedule, DraftKings' lines read
     from ESPN for everyone) the props job bakes it empty, and every entry in it is one a read of DraftKings' lines
     on ESPN made: the job's published read, a Refresh odds press, or this card's check when it opens. ESPN carries
     DraftKings' ids for a game's lines and its page, never for a player's line, so those entries hold team:,
     game| and event keys alone, and a player's leg has an id only from Pull from DraftKings (below), on the site
     owner's devices: everyone else adds a player's leg on DraftKings by hand, and the note says so. The paths that
     read a player's id from PAY.dk (the rung rule, the moved rule on the pull's ids, "when its prices were read")
     stand for a payload baked with ids by a pull run by hand (props/data/oddsfetch.py, which no job runs).
     DraftKings opens several outcomes on its betslip at ?outcomes=<id>+<id>, each '#' written %23; a leg
     DraftKings has only at another number goes on at DraftKings' number, and the note says so (dkLeg, app v109);
     a leg it cannot open at all is named with why. An id names one outcome at one number, so a line DraftKings
     has moved (or pulled) since the read is not on the slip, and DraftKings drops it without a word: the note
     dates the read (the oldest of the legs it opens) and says the link opens the legs as DraftKings had them
     then, never that every leg will land. With no leg to open, the button and Share link take the visitor to the
     game's DraftKings page, or to DraftKings' NFL page, to add the legs by hand, and each leg says why. The
     builder shows under each of its own legs what this card will do with it (dkPlan's each, read by
     renderParlay). */
  const DKS='https://sportsbook.draftkings.com/', DKNFL=DKS+'leagues/football/nfl';
  const dkUrl=ids=>DKS+'?outcomes='+ids.map(encodeURIComponent).join('+');
  /* a player's leg priced from DraftKings' line read on ESPN (src 'dkline'): ESPN gives no id for a player's line, so
     with nothing from a pull it goes on DraftKings by hand. On the admin's device, Pull from DraftKings reads it where
     its market is one the pull reads (PULL_BASE, below) */
  const DKLINE_WHY='price estimated from DraftKings\u2019 line read on ESPN, which gives no DraftKings id for a player\u2019s line: add it on DraftKings by hand';
  const DKLINE_BRIEF='no DraftKings id: add it by hand';
  const pt=x=>String(+x), signed=x=>(+x>0?'+':'')+pt(x);
  function dkGame(l){ try{ const D=typeof PAY==='object'&&PAY&&PAY.dk, W=D&&D[String(l.week)]; return (W&&W[l.gid])||null; }catch(e){ return null; } }
  /* a payload baked with ids at all (dk), as against one baked before them */
  function dkBaked(){ try{ return typeof PAY==='object'&&!!PAY&&!!PAY.dk&&typeof PAY.dk==='object'; }catch(e){ return false; } }
  /* a player's id among a game's: anything but its game lines, its page and the read times */
  const dkHasPlayer=D=>Object.keys(D).some(k=>!/^(team:|game\|)/.test(k)&&!['event','at','glat'].includes(k));
  /* when the ids a leg is looked up in were read: a team's line and the total with the game lines
     (glat), a player's with his game's prices (at); null where the payload does not say */
  function dkRead(l,D){ const s=D&&(['ml','ats','total'].includes(l.stat)?D.glat:D.at), t=s?Date.parse(s):NaN; return isFinite(t)?new Date(t):null; }
  /* a team's line or the total that a Refresh odds press read (app v107) is dated by that press
     (espnIdAt in part3.js keeps the time of each id it gave or found as the pull had it); any other id
     by its pull, so a paid id at a number the press shows DraftKings has moved off keeps its own date */
  function dkIdAt(l,key,at){ try{ const t=typeof espnIdAt==='function'?espnIdAt(l.gid,key):null; return t&&(!at||t>+at)?new Date(t):at; }catch(e){ return at; } }
  /* the moved rule (19 October 2026, the owner's Monday night: "same thing again.... put in that link and its
     only showing" one leg of four, McLaurin's receiving yards among those dropped, read by the pull at 47.5 and
     moved by DraftKings to 49.5 since). An id names one outcome at one number, and DraftKings re-posts a player's
     line it moves under a new id and drops the old one without a word; ESPN carries no id for a player's line,
     so no free read gives the new one. What a read does give is DraftKings' main line for him now: the newest
     read of his game's player lines (a Refresh odds press, or this card's own read when it opens; espnGame, as
     the page keeps it, null where it was read at or after kickoff). Where that read came after the pull read the
     id and has DraftKings' main line for the player and stat at another number than the id's own, the id is
     dead and the leg goes on no slip: the plan says DraftKings has moved it and to add it by hand there. A read
     with no line for him on the stat says nothing (DraftKings may simply not list it there: the id stands), and
     the anytime touchdown and 2+ touchdowns have no number to move. What no read can catch: a line moved and
     moved back, or re-posted at the same number, which also takes a new id (the note's caution stands for it) */
  function dkReadLine(l){
    try{ const g=game(l.gid), wk=l.week!=null?l.week:(g&&g.w), e=typeof espnGame==='function'?espnGame(l.gid,wk):null; if(!e) return null;
      const at=Date.parse(e.at), q=typeof espnLineOf==='function'?espnLineOf(e,l.pid,l.stat):null;
      return isFinite(at)&&q!=null?{at,q}:null; }catch(e){ return null; } }
  /* the reason a leg on a dead id gives, in full and in a few words (Share link's text, the builder's row). A main
     line is added by hand at DraftKings' new number, as a leg DraftKings has at another number is converted (app
     v109). A ladder rung k+ is DraftKings' Over k-0.5 (or the whole k-1), so only at one of those is the main line
     the same bet; at any other (4+ receptions with the main line moved to 4.5, which is 5+) the leg's own bet is
     named, and that the main line is another (the review of 19 October 2026). pulled: the id was Pull from DraftKings'
     (since 20 October 2026), said so, and the admin can pull again */
  const dkMoved=(l,R,at,pulled)=>{ const q=pt(R.q), s=statLbl(l.stat), since=pulled?'you pulled from DraftKings':'its prices were read', was=pulled?'pulled':'read', again=pulled?' (or pull again)':'';
    const head=`DraftKings has moved his ${s} line to ${q} since ${since} (${readOf(at)}), and its slip drops a moved line: `;
    if(l.main||+R.q===+l.k-0.5||+R.q===+l.k-1) return {why:head+`add it by hand at ${q}`+again,brief:`moved to ${q} since it was ${was}`,moved:R.q};
    return {why:head+`add ${pt(l.k)}+ ${s} by hand (DraftKings’ Over ${q} is another bet)`+again,brief:`moved to ${q} since it was ${was}; add ${pt(l.k)}+ by hand, not Over ${q}`,moved:R.q}; };
  /* the player markets Pull from DraftKings reads, a page stat each, as The Odds API names them (props/data/oddsfetch.py's
     MARKETS, turned round), and the ones with an alternate ladder there (its FULL_EXTRA): a rung k+ is asked of the

  async function fonts(){
    try{ const F=document.fonts; if(!F||typeof F.load!=='function') return;
      await Promise.race([Promise.all(['700 22px Unbounded','500 14px Manrope','700 14px Manrope'].map(f=>F.load(f).catch(()=>null))),new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  }
  function rr(x,a,b,w,hh,r){ x.beginPath(); x.moveTo(a+r,b); x.lineTo(a+w-r,b); x.quadraticCurveTo(a+w,b,a+w,b+r); x.lineTo(a+w,b+hh-r); x.quadraticCurveTo(a+w,b+hh,a+w-r,b+hh);
    x.lineTo(a+r,b+hh); x.quadraticCurveTo(a,b+hh,a,b+hh-r); x.lineTo(a,b+r); x.quadraticCurveTo(a,b,a+r,b); x.closePath(); }
  /* text cut to a width, with an ellipsis */
  function fit(x,t,max){ t=String(t||''); if(x.measureText(t).width<=max) return t;
    while(t.length>1&&x.measureText(t+'…').width>max) t=t.slice(0,-1); return t+'…'; }
  function text(x,t,a,b,font,color,align,max){ x.font=font; x.fillStyle=color; x.textAlign=align||'left'; x.textBaseline='alphabetic';
    const s=max?fit(x,t,max):String(t); x.fillText(s,a,b); return x.measureText(s).width; }
  const LEG_H=74, HEAD_H=134, TILE_H=58, TILE_GAP=8;
  /* what it pays: Stake, Pays and Profit, every figure whole. Three across, the figures step down
     from 19px to 14px until each fits its tile; if one still does not, the tiles take two rows
     (Stake and Pays, then Profit the card's width), then one to a row; only past anything a real
     stake makes does the font go under 14px. Never fit()'s ellipsis on a dollar figure. */
  function tiles(x,m,L,R){
    if(!m.stake) return null;
    const vals=[['STAKE',money(m.stake),C.ink],['PAYS',money(m.payout),C.ink],['PROFIT','+'+money(m.profit),C.pick]];
    const wid=(t,px)=>{ x.font='700 '+px+'px '+FD; return x.measureText(t).width; };
    const lay=per=>{ const rows=[]; for(let i=0;i<vals.length;i+=per) rows.push(vals.slice(i,i+per));
      return rows.map(r=>{ const tw=(R-L-(r.length-1)*TILE_GAP)/r.length; return r.map(([k,v,col])=>({k,v,col,tw})); }); };
    for(const per of [3,2,1]){ const rows=lay(per);
      for(let px=19;px>=14;px--) if(rows.every(r=>r.every(t=>wid(t.v,px)<=t.tw-20))) return {rows,px}; }
    const rows=lay(1), w=Math.max(...rows.map(r=>wid(r[0].v,19)));
    return {rows,px:Math.min(14,Math.floor(19*(rows[0][0].tw-20)/w*10)/10)};
  }
  const tilesH=t=>t?4+t.rows.length*TILE_H+(t.rows.length-1)*TILE_GAP+12:0;
  const CHANCE_H=58;
  function size(m,t){ return HEAD_H+10+m.legs.length*LEG_H+tilesH(t)+CHANCE_H+52; }
  async function draw(m,scale){
    scale=scale||2;
    await fonts();
    const c=document.createElement('canvas');
    const x=c.getContext&&c.getContext('2d'); if(!x) return null;
    /* the tiles are laid out first, by measure, since their rows set the card's height; sizing
       the canvas then resets the context, so the scale comes after */
    const CW=W-2*M, L=M+P, R=M+CW-P, t=tiles(x,m,L,R), CH=size(m,t), H=CH+2*M;
    c.width=Math.round(W*scale); c.height=Math.round(H*scale);
    x.scale(scale,scale);
    x.fillStyle=C.bg; x.fillRect(0,0,W,H);
    /* the card, with a soft shadow, and its header band */
    x.save(); x.shadowColor='rgba(0,0,0,.35)'; x.shadowBlur=24; x.shadowOffsetY=8; rr(x,M,M,CW,CH,18); x.fillStyle=C.panel; x.fill(); x.restore();
    x.save(); rr(x,M,M,CW,CH,18); x.clip();
    const g=x.createLinearGradient(M,M,M+CW,M+HEAD_H); g.addColorStop(0,C.n0); g.addColorStop(.55,C.n1); g.addColorStop(1,C.n2);
    x.fillStyle=g; x.fillRect(M,M,CW,HEAD_H);
    const gl=x.createLinearGradient(M,0,M+CW,0); gl.addColorStop(0,'rgba(255,209,102,0)'); gl.addColorStop(.5,'rgba(255,209,102,.85)'); gl.addColorStop(1,'rgba(255,209,102,0)');
    x.fillStyle=gl; x.fillRect(M,M+HEAD_H-2,CW,2);
    x.restore();
    /* the mark, the kicker, the title and the price */
    let y=M+30;
    if('letterSpacing' in x) x.letterSpacing='1px';
    const mw=text(x,'NFL HUB',L,y,'800 11px '+FB,C.head2);
    if('letterSpacing' in x) x.letterSpacing='0px';
    x.beginPath(); x.arc(L+mw+9,y-4,3,0,Math.PI*2); x.fillStyle=C.gold; x.fill();
    { x.font='700 10.5px '+FB; const k=String(m.kicker||'').toUpperCase(), kw=x.measureText(k).width+18;
      rr(x,R-kw,y-14,kw,20,10); x.fillStyle='rgba(255,209,102,.16)'; x.fill(); text(x,k,R-kw/2,y,'700 10.5px '+FB,C.goldT,'center'); }
    y=M+76;
    const pw=text(x,m.price,R,y,'700 28px '+FD,C.goldT,'right');
    text(x,m.title,L,y,'700 22px '+FD,C.ink,'left',R-L-pw-16);
    y=M+108;
    const right=m.dec+' decimal · '+m.implied+' implied';
    const rw=text(x,right,R,y,'500 12.5px '+FB,C.head2,'right');
    text(x,[m.weekText,m.dateText].filter(Boolean).join(' · '),L,y,'500 12.5px '+FB,C.head2,'left',R-L-rw-14);
    text(x,m.priceNote,R,y+16,'500 11px '+FB,C.muted,'right');
    /* the legs */
    y=M+HEAD_H+10;
    m.legs.forEach((l,i)=>{
      if(i){ x.fillStyle=C.line; x.fillRect(L,y,R-L,1); }
      x.beginPath(); x.arc(L+11,y+22,11,0,Math.PI*2); x.lineWidth=1.5; x.strokeStyle=C.line2; x.stroke();
      text(x,String(i+1),L+11,y+26,'700 11px '+FB,C.ink2,'center');
      const lpw=Math.max(text(x,l.price,R,y+26,'700 15px '+FD,C.ink,'right'),
        text(x,String(l.tag||'').toUpperCase(),R,y+44,'600 10px '+FB,C.muted,'right'));
      const tx=L+34, tw=R-tx-lpw-14;
      text(x,l.who,tx,y+25,'700 15.5px '+FB,C.ink,'left',tw);
      text(x,l.what,tx,y+45,'500 14px '+FB,C.ink,'left',tw);
      if(l.meta) text(x,l.meta,tx,y+63,'500 12px '+FB,C.muted,'left',R-tx);
      y+=LEG_H;
    });
    /* what it pays */
    if(t){
      let ty=y+4;
      t.rows.forEach(r=>{ let tx=L;
        r.forEach(tl=>{
          rr(x,tx,ty,tl.tw,TILE_H,10); x.fillStyle=C.panel2; x.fill(); x.lineWidth=1; x.strokeStyle=C.line; x.stroke();
          text(x,tl.k,tx+11,ty+20,'700 10px '+FB,C.muted);
          text(x,tl.v,tx+11,ty+46,'700 '+t.px+'px '+FD,tl.col);
          tx+=tl.tw+TILE_GAP; });
        ty+=TILE_H+TILE_GAP; });
      y+=tilesH(t);
    }
    /* the chance: the book's fair chance first, then the model's (or the Elo's) and the price's */
    chanceLines(m).forEach((ln,i)=>{ let cx=L; const yy=y+24+i*18;
      for(const [t1,b] of ln) cx+=text(x,t1,cx,yy,(b?'700 ':'500 ')+'13px '+FB,b?C.ink:C.ink2); });
    y+=CHANCE_H;
    /* the site's mark */
    x.fillStyle=C.line; x.fillRect(M,y,CW,1);
    text(x,'Made '+m.made,R,y+31,'500 12px '+FB,C.muted,'right');
    text(x,m.site,L,y+31,'600 12px '+FB,C.ink2,'left',R-L-120);
    return c;
  }
  /* the card as a PNG */
  async function png(m){
    const c=await draw(m||cur,2);
    if(!c) throw new Error('this browser cannot draw the image');
    return await new Promise((res,rej)=>{ try{ c.toBlob(b=>b?res(b):rej(new Error('the image came out empty')),'image/png'); }catch(e){ rej(e); } });
  }
  function saveFile(blob,name){
    const u=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=u; a.download=name; a.rel='noopener'; a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>{ try{ URL.revokeObjectURL(u); }catch(e){} },30000);
  }
  async function download(){
    const m=cur; if(!m) return false; say('Drawing the image…');
    try{ saveFile(await png(m),m.file); say('Saved as '+m.file+'.'); return true; }
    catch(e){ say('The image could not be made: '+(e&&e.message||e)); return false; }
  }
  async function share(){
    const m=cur; if(!m) return false; say('Drawing the image…');
    let blob=null;
    try{ blob=await png(m);
      const f=new File([blob],m.file,{type:'image/png'});
      if(canShareFiles()&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:'NFL Hub: '+m.title}); say(''); return true; } }
    catch(e){ if(e&&e.name==='AbortError'){ say(''); return false; } }
    /* no share sheet after all: the download */
    try{ if(!blob) blob=await png(m); saveFile(blob,m.file); say('Saved as '+m.file+'.'); return true; }
    catch(e){ say('The image could not be made: '+(e&&e.message||e)); return false; }
  }
  /* Share link: the parlay as one plain text, the DraftKings link inside it. Each leg, its bet and
     price (labelled est. or fair where it is not the book's, as on the card, and the title's price
     likewise); the stake and what it pays; the chances; then the DraftKings link on a line of its
     own under a line saying what it opens ("DraftKings betslip (all 3 legs):", "(2 of the 4 legs;
     add legs 3 and 4 by hand):"; with no leg on the slip the game's page where every leg is in one
     game to come, else DraftKings' NFL page, "(add the legs by hand)"); when DraftKings' lines were
     read, and that a line moved or pulled since will not be on the slip; the legs to add by hand,
     each with why in a few words; the site's address last. By the share sheet where the browser has
     one (navigator.share), else copied: the same text either way.

     The link is in the text and never in the share's url field (the owner, October 2026: "sometimes
     when i copy the button to share the draft kings link it like compresses the url and doesnt show
     all legs"). On an iPhone WebKit hands the share sheet the text and the url as two items:
     Messages draws the url as a card showing only sportsbook.draftkings.com (some apps send only the
     bare domain), and the sheet's Copy keeps the text and drops the url (WebKit bug 203221), so a
     paste had the legs and the site's address and no DraftKings link at all. Android's Chrome joins
     the two, which is why it happened only sometimes. One text survives every one of those, the
     whole betslip link in it to tap.

     Never the image: that is Download's and the share sheet's above. A share sheet cancelled is no
     error and does nothing */
  function linkText(m){
    const P=s=>String(s==null?'':s).replace(/−/g,'-'), dk=m.dk||{};
    /* a price that is not the book's says so, as on the card: +210 est., +150 fair */
    const lines=m.legs.map((l,i)=>`${i+1}. ${l.who}: ${l.what} (${P(l.price)}${l.tag&&l.tag!=='book'?' '+l.tag:''})`);
    if(m.stake) lines.push(`Stake ${money(m.stake)} · Pays ${money(m.payout)}`);
    lines.push(chanceLines(m).map(lineText).join(' · '));
    /* always a DraftKings link, alone on its line: the betslip, else the game's page, else DraftKings' NFL page */
    const miss=dk.miss||[], url=dk.url||(dk.multi?null:(dk.n?dk.home||DKNFL:null)), them=dk.n===1?'the leg':'the legs';
    if(dk.url){
      /* what the link holds, in the note's own words (dkWhich): never "all", since a line moved since drops off */
      lines.push(`DraftKings betslip (opens ${dkWhich(dk)} as DraftKings had ${dk.ok.length===1?'it':'them'}${miss.length?`; add ${legNums(miss)} by hand`:''}):`, dk.url);
      lines.push(`DraftKings lines as ${dk.read?'read '+readOf(dk.read):'last read'}: a leg whose line DraftKings has moved or pulled since will not be on the slip, so check it before you bet`);
      /* a leg that goes on at DraftKings' number, and that DraftKings prices it there */
      const sw=dk.swaps||[];
      if(sw.length) lines.push(`On DraftKings’ slip at its own line: ${sw.map(x=>`leg ${x.n} as ${x.swap}${x.swapPx!=null&&isFinite(x.swapPx)?` (${P(ml(x.swapPx))})`:''}`).join('; ')} (DraftKings prices ${sw.length===1?'it':'them'} at its own line, so its payout can differ)`); }
    else if(dk.multi){
      /* (app v121) a same-game parlay mixed with other games: a link for each game's, since one with them all does not open */
      /* (app v123) every leg on one slip first, as the try, then a link for each game as the fallback */
      lines.push(`DraftKings betslip, ${miss.length?dkWhich(dk):'every leg'} on one slip (DraftKings may not open a same-game parlay mixed with other games; if it does not, use each game’s link below)${miss.length?`; add ${legNums(miss)} by hand`:''}:`, dk.all);
      lines.push('Each game on its own:');
      for(const G of dk.games) lines.push(`${G.name}, ${legNums(G.ok)}:`, G.url);
      lines.push(`DraftKings lines as ${dk.read?'read '+readOf(dk.read):'last read'}: a leg whose line DraftKings has moved or pulled since will not be on the slip, so check it before you bet`);
      const sw=dk.swaps||[];
      if(sw.length) lines.push(`On DraftKings’ slip at its own line: ${sw.map(x=>`leg ${x.n} as ${x.swap}${x.swapPx!=null&&isFinite(x.swapPx)?` (${P(ml(x.swapPx))})`:''}`).join('; ')} (DraftKings prices ${sw.length===1?'it':'them'} at its own line, so its payout can differ)`); }
    else if(url) lines.push(dk.event?`DraftKings, the game’s page (add ${them} by hand):`:`DraftKings’ NFL page (add ${them} by hand):`, url);
    /* the legs the slip cannot take, each with why in a few words, and where to add them */
    if(miss.length){
      lines.push(dk.url?'Add by hand at DraftKings:':dk.event?'Add by hand on the game’s DraftKings page:':'Add by hand at DraftKings:');
      for(const x of miss) lines.push(`${x.n}. ${x.who} ${x.what} (${x.brief||x.why})`); }
    lines.push(SITE);
    /* url is what the text links to, for the record: it is in the text, never shared on its own */
    return {title:`${m.title} ${P(m.price)}${m.priceNote&&m.priceNote!=='book price'?' ('+m.priceNote+')':''}`,text:lines.join('\n'),url,urls:dk.multi?[dk.all,...dk.games.map(G=>G.url)]:(url?[url]:[])};
  }
  async function copyText(t){
    try{ if(navigator.clipboard&&typeof navigator.clipboard.writeText==='function'){ await navigator.clipboard.writeText(t); return true; } }catch(e){}
    /* a browser without the clipboard call: a hidden box, selected and copied */
    const back=document.activeElement, ta=document.createElement('textarea');
    try{ ta.value=t; ta.setAttribute('readonly',''); ta.setAttribute('aria-hidden','true'); ta.tabIndex=-1;
      ta.style.cssText='position:fixed;top:0;left:-9999px;opacity:0';
      ($('pcModal')||document.body).appendChild(ta); ta.select();
      return typeof document.execCommand==='function'&&!!document.execCommand('copy'); }
    catch(e){ return false; }
    finally{ ta.remove(); try{ if(back&&back.focus) back.focus({preventScroll:true}); }catch(e){} }
  }
  async function shareLink(){
    /* while the card checks DraftKings' current lines, Share link waits: the text would carry the plan before it. A
       press says so in the card's status line, so it is never a press that does nothing */
    const m=cur; if(!m) return false;
    if(waiting()){ flash(!!ck&&ck.state==='busy'?'Checking DraftKings’ lines first…':'Pulling DraftKings’ prices first…'); return false; }
    /* title and text only: the link is in the text (see linkText), never a url of its own */
    const s=linkText(m), data={title:s.title,text:s.text};
    if(typeof navigator.share==='function'){
      let can=true; try{ if(typeof navigator.canShare==='function') can=navigator.canShare(data)!==false; }catch(e){ can=false; }
      if(can){ try{ await navigator.share(data); say(''); return true; }
        catch(e){ if(e&&e.name==='AbortError'){ say(''); return false; } } } }
    /* no share sheet, or one that failed: the same text, the link in it, copied */
    if(await copyText(s.text)){ flash(s.url?'Link copied':(s.urls&&s.urls.length>1?'Links copied':'Parlay copied')); return true; }
    say('The link could not be copied.'); return false;
  }
  /* Start over: the builder emptied, in this browser only, as its own Clear ALL does */
  function again(){
    if(typeof S!=='object'||!S) return;
    S.parlay={}; S.bookPrice=null;
    try{ if(typeof save==='function') save(); }catch(e){}
    close();
    try{ if(typeof renderParlay==='function') renderParlay(); if(S.ui&&S.ui.game&&typeof renderGame==='function') renderGame(); }catch(e){}
    /* Finish went with the legs: the focus goes to the first control of the tab on the screen (the Parlay
       Builder's choices, or Suggested Parlays' first Add to builder), else (no game to build from) the chosen tab's
       button, never the page's body */
    try{ const b=[...document.querySelectorAll('main section:not([hidden]) [data-pb-mix], #pbPanel [data-pb-mix]')].find(visible)||[...document.querySelectorAll('main section:not([hidden]) [data-sp-add]')].find(visible)||chosenTab();
      if(b){ b.focus(); keepFocus(b); } }catch(e){}
  }

  /* ---- on every device: Finish where Save was ---- */
  const FINISH_TIP='Opens this parlay as a card you can download. Nothing is saved: not here, not in X’s parlays.';
  /* the builder's Save and lock, after every redraw of the builder: the same button, with the
     builder's own rule for when it can be pressed (one week, and a price), cloned so its save
     goes with the old one */
  function finishBuilder(){
    const b=$('pSave'); if(!b) return false;
    const nb=b.cloneNode(true);
    nb.id='pFinish'; nb.textContent='Finish parlay';
    nb.title=nb.disabled?String(b.title||'').replace(/ to save$/,' to finish'):FINISH_TIP;
    b.replaceWith(nb);
    nb.addEventListener('click',()=>{ const m=fromBuilder(); if(m) open(m,nb); });
    return true;
  }
  /* a suggested tier's Finish (data-pc-finish="sp|2026_06_SEA_DEN:med", "sp|2026_07_SUN:elo-med"): the tab draws the button
     wherever this card is on the page, and one listener opens the card for whichever is pressed */
  function finishFrom(btn){
    /* a game kicked off since the panel was drawn: redraw it rather than open a parlay nobody saw */
    if(typeof window.pbStale==='function'&&window.pbStale()){ if(typeof window.renderParlay==='function') window.renderParlay(); return false; }
    const [kind,id]=String(btn.getAttribute('data-pc-finish')||'').split('|');
    const m=fromTier(kind,id); if(m) open(m,btn); return !!m;
  }
  /* wiring: the window's own buttons, Escape (ahead of the windows beneath it, so it closes this
     one alone), a click outside the card, Tab kept inside, and the suggestions window watched */
  function wire(){
    const md=$('pcModal'); if(!md||md.dataset.wired) return; md.dataset.wired='1';
    $('pcClose').addEventListener('click',close);
    $('pcDownload').addEventListener('click',download);
    $('pcShare').addEventListener('click',share);
    $('pcLink').addEventListener('click',shareLink);
    /* Open in DraftKings while the card checks DraftKings' lines: no address, and a press does nothing */
    $('pcDk').addEventListener('click',e=>{ if($('pcDk').getAttribute('aria-disabled')==='true'||!$('pcDk').hasAttribute('href')){ e.preventDefault(); } });
    $('pcAgain').addEventListener('click',again);
    /* Pull from DraftKings (the admin's card alone: on a visitor's there is no button to press) and its question */
    md.addEventListener('click',e=>{ const t=e.target&&e.target.closest?e.target:null; if(!t) return;
      if(t.closest('[data-pc-pull]')){ e.preventDefault(); pressPull(); return; }
      const go=t.closest('[data-pc-pullgo]'); if(go){ e.preventDefault(); runPull(go.getAttribute('data-pc-pullgo')==='all'); return; }
      if(t.closest('#pcPullNo')){ e.preventDefault(); cancelPull(); } });
    md.addEventListener('click',e=>{ if(e.target===md) close(); });
    window.addEventListener('keydown',e=>{
      if(!isOpen()) return;
      /* Escape answers Pull from DraftKings' question with Cancel, else closes the card */
      if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); if(PULL_RUN.state==='confirm'&&PULL_RUN.m===cur) cancelPull(); else close(); return; }
      if(e.key!=='Tab') return;
      const f=[...md.querySelectorAll('button,a[href],input,select,[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled&&!el.hidden&&!el.closest('[hidden]'));
      if(!f.length) return;
      const first=f[0], last=f[f.length-1], at=document.activeElement;
      if(e.shiftKey&&(at===first||!md.contains(at))){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey&&(at===last||!md.contains(at))){ e.preventDefault(); first.focus(); }
    },true);
    document.addEventListener('click',e=>{ const b=e.target&&e.target.closest&&e.target.closest('[data-pc-finish]');
      if(b&&!b.disabled&&!md.contains(b)) finishFrom(b); });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',wire); else wire();
  /* checking(): a promise that settles once the open card's DraftKings part is final (its read done, or the cap
     passed); checkState(): the open card's check, {state: none, busy, done, failed or late (the cap passed), at, games} */
  const checking=()=>ck?ck.ready:Promise.resolve();
  const checkState=()=>ck?{state:ck.state,at:ck.at,games:ck.gids.slice()}:null;
  /* Pull from DraftKings: pullPlan(legs?) the open card's plan (or some legs'); pull() presses the button (a promise that
     settles once the look-up is answered and the question asked, or it stopped); pullState() where it stands ({state,
     spent, left, at, msg, games}: the games pulled this load); pulledFor(leg) what the pull has for a leg; nameRule(desc,
     players) the name rule (test_dkname.js) */
  const pullState=()=>({state:PULL_RUN.state,spent:PULL_RUN.spent!=null?PULL_RUN.spent:null,left:PULL_RUN.left!=null?PULL_RUN.left:null,at:PULL_RUN.at||null,msg:PULL_RUN.msg||null,games:Object.keys(PULL)});
  return {quote,fromBuilder,fromTier,open,close,isOpen,draw,png,download,share,shareLink,linkText,chanceLines,dkPlan,finishBuilder,finishFrom,checking,checkState,current:()=>cur,
    pullPlan:legs=>pullPlan(legs),pull:pressPull,pullState,pulledFor:l=>pullFor(l),nameRule:dkNameRule};
})();
</script>
