</style>
<section id="tab-elo" hidden>
  <div class="bar">
    <span class="rec" id="peWalkRec"></span>
    <span class="grow"></span>
    <span class="livestamp" id="peStamp"></span>
  </div>
  <div id="peBody" class="pe-wrap"></div>
</section>
<script>
/* ---------- the Player Elo tab ----------
   Every player rated by position, game by game since 2012, and a third game model built on
   nothing but those ratings. elo/build.py does the work on the job's schedule and writes
   elo/data/players.json, model.json and matchups.json; this reads them on every load. The
   model's calls and its record live on the Pick'em Record tab beside the other models'; this
   tab is the rankings, and a click on a player opens his window: his rating and his matchup
   this week. */
(function(){
const P_URL='../elo/data/players.json', M_URL='../elo/data/model.json', MU_URL='../elo/data/matchups.json';
const D={players:null,model:null,mu:null,pos:'QB',more:false};
const el=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=p=>Math.round(p*100)+'%';
const tag=(t,mini)=>window.pkTag?window.pkTag(t,window.pkTagColor?window.pkTagColor(t):null,false,mini?'mini':'')
  :'<span class="pill">'+esc(t)+'</span>';
/* the tier is the betting app's own, as betting/tools/tiers.js reshapes it, on the same scale the
   teams wear: HOF 1750+ (a gem), Elite 1700+,
   Master 1650+, Diamond 1600+, Platinum 1550+, Gold 1500+, Silver 1450+, Bronze 1400+, Iron 1350+,
   and Wood under it */
const shield=elo=>window.pkTierBadge?window.pkTierBadge(elo):'';
const tierName=elo=>{ const t=window.pkEloTier?window.pkEloTier(elo):null; return t?t[0]:''; };
function spark(pts){
  if(!pts||pts.length<2) return '';
  const v=pts.map(p=>p[1]), lo=Math.min(...v), hi=Math.max(...v), W=84, H=22;
  const x=i=>(i/(v.length-1))*(W-2)+1, y=e=>hi===lo?H/2:H-1-((e-lo)/(hi-lo))*(H-2);
  const d=v.map((e,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(e).toFixed(1)).join(' ');
  const up=v[v.length-1]>=v[0];
  return `<svg class="pe-spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="${up?'var(--pick)':'var(--miss)'}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function move(r){
  const d=r.start_rank-r.rank;
  if(!d) return '<span class="pe-flat">–</span>';
  return d>0?`<span class="pe-up">▲${d}</span>`:`<span class="pe-down">▼${-d}</span>`;
}
/* ---- matchups: the coming week's projections from form, Elo and the defenders faced ----
   elo/build.py fits, for every position and stat, a player's next game on his recent average
   (half-life four games), home, what the defence has allowed, his own Elo and the Elo of the
   opposing DL, LB and DB he will face, on every regular's game since 2016, and the same
   without the two Elo terms. The difference between the two is the Elo nudge. A stat's
   nudge is trusted when, called season by season by the fit on the seasons before, it
   lowered the error and its biggest fifth of nudges landed on their side 53% of the time
   or better; the others are shown faded and are not used for Elo picks. */
const MU_LBL={passing_yards:'Pass yds',passing_tds:'Pass TD',attempts:'Att',completions:'Comp',passing_interceptions:'INT',
  rushing_yards:'Rush yds',carries:'Carries',receptions:'Rec',receiving_yards:'Rec yds',targets:'Tgt',scrim_yards:'Rush+rec',any_td:'TDs'};
function muTrusted(g,st){ const r=D.mu&&D.mu.record&&D.mu.record[g+'|'+st]; const p=r&&r.past;
  return !!p&&p.rmse_elo<p.rmse_form&&p.right_top>=0.53; }
function muNudge(pid,st){ const pl=D.mu&&D.mu.players&&D.mu.players[pid]; if(!pl||!pl.stats[st]||!muTrusted(pl.group,st)) return null;
  const f=D.mu.fit[pl.group+'|'+st]; return f?{nudge:pl.stats[st][2],sd:f.sd,proj:pl.stats[st][1],form:pl.stats[st][0]}:null; }
/* the matchups file is rebuilt every morning from that day's injury report (its Outs only),
   and the props payload too, from which the page keeps the week's Out and Doubtful in
   S.inactive. A Doubtful player, or one ruled out since the Elo build, is
   still an expected starter in the file, so a player's window and the Mismatches leave him out
   here rather than show a matchup he will not play. */
const ruledOut=pid=>!!(typeof S==='object'&&S&&S.inactive&&S.inactive[pid]);
window.eloRuledOut=ruledOut;
/* each defence's units ranked across the league (`league.defs`, all 32), 1st the best (the
   highest rated); a file without it falls back to the teams playing this week */
function defRanks(){
  const byTeam={}; for(const v of Object.values((D.mu&&D.mu.players)||{})) if(v.opp_def) byTeam[v.opp]=v.opp_def;
  if(D.mu&&D.mu.league&&D.mu.league.defs) Object.assign(byTeam,D.mu.league.defs);
  const teams=Object.keys(byTeam), out={n:teams.length};
  for(const u of ['DL','LB','DB']){ const order=teams.slice().sort((a,b)=>byTeam[b][u]-byTeam[a][u]); out[u]=Object.fromEntries(order.map((t,i)=>[t,i+1])); }
  return out;
}
const UNIT_NAME={DL:'Pass rush and run front (DL)',LB:'Linebackers',DB:'Secondary'};
/* a player's window, opened from his row in the rankings: his place this season, then the
   coming game as the matchup formula sees it, a row a stat (faded where the Elo part has not
   held up season by season since 2017, and not used for Elo picks) */
function playerModal(pid){
  const P=D.players, g=D.pos, r=(P.groups[g].top||[]).find(x=>x.id===pid); if(!r) return;
  let m=el('pePlModal');
  if(!m){ m=document.createElement('div'); m.id='pePlModal'; m.className='modal'; m.hidden=true;
    m.innerHTML='<div class="modal-panel" role="dialog" aria-modal="true" aria-label="Player"><div id="pePlView"></div></div>';
    (el('tab-elo')||document.body).appendChild(m);
    m.addEventListener('click',e=>{ if(e.target===m) plClose(); });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!m.hidden) plClose(); }); }
  const M=D.mu, v=M&&M.players&&M.players[pid], stats=M&&M.stats&&M.stats[g];
  const dec=x=>Math.abs(x)>=10?x.toFixed(0):x.toFixed(1);
  let mu;
  if(!stats) mu=`<p class="pe-sub">There is no matchup formula for ${esc(P.groups[g].label.toLowerCase())}: the projections cover quarterbacks, running backs, receivers and tight ends.</p>`;
  else if(!v) mu=`<p class="pe-sub">No matchup for week ${esc(M.week)}: he is not an expected starter in this week's file, or his team is on its bye.</p>`;
  else if(ruledOut(pid)) mu=`<p class="pe-sub">Ruled out for week ${esc(M.week)} on the injury report, so there is no matchup to show.</p>`;
  else {
    const R=defRanks(), rk=u=>R[u]&&R[u][v.opp]?`${ordinal(R[u][v.opp])} of ${R.n}`:'–';
    const rows=stats.map(st=>{ const a=v.stats[st]; if(!a) return '';
      const [form,proj,n]=a, shown=dec(Math.abs(n)), zero=/^0(\.0)?$/.test(shown), cls=zero?'flat':(n>0?'up':'dn');
      return `<tr class="${muTrusted(g,st)?'':'pe-weak'}"><td>${MU_LBL[st]||st}</td><td class="pe-n">${dec(form)}</td>
        <td class="pe-n"><span class="pe-nud ${cls}" style="display:inline">${zero?'0.0':(n>0?'+':'−')+shown}</span></td><td class="pe-n"><b>${dec(proj)}</b></td></tr>`; }).join('');
    mu=`<h3>Week ${esc(M.week)}: ${tag(v.team,true)} <span class="muted" style="font-weight:500">${v.home?'vs':'at'}</span> ${tag(v.opp,true)}</h3>
      <div class="pe-pl-def">${['DL','LB','DB'].map(u=>`<span>${UNIT_NAME[u]}: <b>${rk(u)}</b></span>`).join('')}</div>
      <table class="pe-t"><thead><tr><th>Stat</th><th class="pe-n">Recent form</th><th class="pe-n">Elo matchup</th><th class="pe-n">Projection</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="pe-note">Recent form is his recent average (the latest games count most). The Elo matchup is what his own rating and the ratings of the ${esc(v.opp)} defenders he faces add or take away; the defences are ranked among all 32, 1st the best. Faded rows are stats where the Elo part has not held up in past seasons, and are not used for Elo picks.</p>`;
  }
  el('pePlView').innerHTML=`<div class="card pe-pl"><h2>${shield(r.elo)}${esc(r.name)} <span class="pill">${esc(r.pos)} · ${esc(r.team)}</span><span style="flex:1"></span><button class="btn quiet" id="pePlClose">Close</button></h2>
    <div class="pe-pl-tiles">
      <div><span>Season Elo</span><b>${r.elo}</b><small>${esc(tierName(r.elo))}</small></div>
      <div><span>Rank</span><b>#${r.rank}</b><small>of ${esc(P.groups[g].active)} ${esc(P.groups[g].label.toLowerCase())}</small></div>
      <div><span>Career</span><b>${r.career!=null?r.career:'–'}</b><small>peak ${r.peak} in ${r.peak_season}</small></div>
      <div><span>This season</span><b>${r.games}</b><small>game${r.games===1?'':'s'} rated</small></div>
    </div>${mu}</div>`;
  el('pePlClose').addEventListener('click',plClose);
  m.hidden=false; document.body.classList.add('modal-open'); m.scrollTop=0;
}
function plClose(){ const m=el('pePlModal'); if(m){ m.hidden=true; if(!document.querySelector('.modal:not([hidden])')) document.body.classList.remove('modal-open'); } }
/* the ladder as a bell curve: how many of the position's ranked players wear each shield,
   beside what a normal curve on the same scale expects (elo/build.py, THE LADDER) */
function curveChart(vals,label){
  if(!vals||vals.length<5||!window.pkEloTier) return '';
  /* 50-point bins from 1200 to 1800 (six standard deviations), edges clamped in; each bin
     wears the shield its range earns, and the dashed line is n players on a normal curve */
  const n=vals.length, LO=1200, HI=1800, BW=50, W=640, H=200, padB=46, padT=22, nb=(HI-LO)/BW, cw=W/nb, gap=2;
  const bins=Array.from({length:nb},(_,i)=>{ const lo=LO+i*BW, t=window.pkEloTier(lo+1);
    const cnt=vals.filter(v=>Math.min(HI-1,Math.max(LO,v))>=lo&&Math.min(HI-1,Math.max(LO,v))<lo+BW).length;
    return {lo,name:t[0],fill:t[0]==='HOF'?'url(#tg-hof-gem)':t[2],cnt}; });
  const dens=e=>n*BW*Math.exp(-(((e-1500)/100)**2)/2)/(100*Math.sqrt(2*Math.PI));
  const top=Math.max(...bins.map(b=>b.cnt),dens(1500),1), y=v=>padT+(H-padT-padB)*(1-v/top), base=H-padB, X=e=>(e-LO)/(HI-LO)*W;
  const bars=bins.map((b,i)=>{ const x=i*cw+gap/2, w=cw-gap, yy=y(b.cnt), h=base-yy, r=Math.min(4,h/2);
    const path=h>0?`M${x} ${base}V${yy+r}Q${x} ${yy} ${x+r} ${yy}H${x+w-r}Q${x+w} ${yy} ${x+w} ${yy+r}V${base}Z`:'';

/* ---- market + form: a second price on every player leg the book has priced ----
   The prop model's own chance on a book line has run over-confident: on weeks 1 and 2 it
   said 62% and 51% happened, while the book's own price said 54%. What did carry signal
   looked to be the player's rating: overs on the top players hit, unders on them missed,
   and the reverse below. So this price starts from the book's chance and moves it by the
   player's Elo on the side of the bet: logit p = -0.05 + 0.8 logit(book) + 0.3 z s, z the
   rating's distance from 1500 in 40-point steps, s +1 for an over and -1 for an under.
   Fitted on weeks 1 and 2 of 2026 (765 lines), but with the ratings as they stood after
   those weeks, which had already seen the games. Replayed on the ratings each week began
   with, the pull is nothing in week 1 (-0.03 +/- 0.13), real in week 2 (+0.29 +/- 0.13),
   and the price about ties the book (Brier 0.2486 against 0.2498). So the Prop Record grades
   it on the rating each player took into the week (preElo), and it stays beside the model's

/* ---- Elo picks: parlays of ranked players whose rating says they beat the book's price ----

   stake. Plus-money legs come first, then the best expected return; prices are held

   where the rating's nudge is least trustworthy and a parlay of them almost never lands.

/* a leg's chance by the Elo matchup: the book's chance with a typical two-way margin

function muP(l,imp){ const m=muNudge(l.pid,l.stat); if(!m||!(m.sd>0)) return null;
  const fair=Math.min(0.99,Math.max(0.01,imp/EP.vig));
  return ncdf(nq(fair)+(l.side==='under'?-1:1)*m.nudge/m.sd); }

function eloPicks(){
  if(!D.players||typeof pricedLegs!=='function'||typeof mlProb!=='function') return null;
  let legs; try{ legs=pricedLegs(); }catch(e){ return null; }
  const c=[];
  for(const l of legs){
    if(l.grp==='TEAM'||l.src!=='real'||!isFinite(l.price)||l.price<EP.lo||l.price>EP.hi) continue;
    if(typeof sideAllows==='function'&&!sideAllows(l)) continue;   /* the window's side switch */

        <button class="btn ${saved?'quiet':'go'}" data-elo-save="${t.id}" ${saved?'disabled':''}>${saved?'Saved':'Add to saved parlays'}</button>
      </div>`; }).join('')}</div>
    <p class="muted" style="margin:12px 0 0;font-size:12px">A fun model, not an edge: the matchup nudge has landed on its side 53 to 63% of the time on its biggest calls since 2017, depending on the stat, which is less than a book's cut on most single legs.</p>`;
  v.insertAdjacentHTML('beforeend',`<div class="card sugg pe-sugg"><div class="sugg-hd"><h2>Elo picks</h2><span class="pill">week ${w}</span></div>${body}</div>`);
  v.querySelectorAll('[data-elo-save]').forEach(b=>b.addEventListener('click',()=>{
    const t=r.tiers.find(x=>x.id===b.dataset.eloSave); if(!t) return;
    const stake=Math.max(0,+S.stake||0);
    if(!confirm(`Save the ${t.label} parlay at ${fmtML(decToML(t.dec))} for $${stake.toFixed(2)}?\n\nIt goes to Saved parlays and settles like any other.`)) return;
    S.saved.push({id:'sp'+Date.now(),saved:new Date().toISOString(),week:t.legs[0].week,
      legs:t.legs.map(l=>{ const {pe,ev,imp,...x}=l; return x; }),
      stake,price:decToML(t.dec),priceSrc:'real',pCorr:t.p,pIndep:t.p,payout:stake*t.dec,suggested:'Elo',suggestSig:t.sig});
    save(); renderParlay(); if(typeof suggestOpen==='function'&&suggestOpen()) fillSuggest(); }));
}
window.eloPicks=eloPicks;
if(typeof fillSuggest==='function'){ const drawSugg=fillSuggest;
  fillSuggest=function(){ const r=drawSugg.apply(this,arguments); eloSuggest(); return r; }; }
if(typeof renderTrack==='function'){ const drawTrack=renderTrack;
  renderTrack=function(){ const r=drawTrack.apply(this,arguments); trackAlt(); return r; }; }
if(typeof renderParlay==='function'){ const drawParlay=renderParlay;
  renderParlay=function(){ const r=drawParlay.apply(this,arguments); decorate(); return r; }; }
/* ---- mismatches: where a player's Elo meets a weak unit ----
   Each expected starter this week (matchups.json) scored as how far his Elo stands above
   his position's (in standard deviations, among every team's starters) plus how far the unit
   he faces stands below the league's (among all 32 defences, `league` in matchups.json; the
   games still to play alone were the pool before, and on a Monday that was two teams, the
   weaker of two defences shown as "ranked 2nd"): a quarterback against the
   opposing secondary and line together, a receiver or tight end against the secondary, a
   back against the line and linebackers. The top five sit over the Props game list as
   bubbles; Show more opens the top thirty. Each carries the matchup formula's projection for
   the player's leading stat. Only on the week the matchups are for. */
const MM_UNIT={QB:{units:['DB','DL'],name:'pass defense'},WR:{units:['DB'],name:'pass defense'},TE:{units:['DB'],name:'pass defense'},RB:{units:['DL','LB'],name:'run defense'}};
/* how big an edge is, in words and a colour: 3 and up huge, 2 big, 1 solid, less slight */
const mmGrade=s=>{const x=Math.round(s*10)/10; return x>=3?['Huge','pe-g4']:x>=2?['Big','pe-g3']:x>=1?['Solid','pe-g2']:['Slight','pe-g1'];};
const MM_LEAD={QB:'passing_yards',RB:'rushing_yards',WR:'receiving_yards',TE:'receiving_yards'};
function mismatches(){
  const M=D.mu; if(!M||!M.players) return [];
  const P=Object.entries(M.players).map(([pid,v])=>({pid,...v})).filter(v=>MM_UNIT[v.group]&&!ruledOut(v.pid));
  const unitOf=v=>MM_UNIT[v.group].units.reduce((a,u)=>a+v.opp_def[u],0)/MM_UNIT[v.group].units.length;
  const zs=(arr)=>{ const m=arr.reduce((a,x)=>a+x,0)/arr.length, sd=Math.sqrt(arr.reduce((a,x)=>a+(x-m)**2,0)/Math.max(1,arr.length-1))||1; return x=>(x-m)/sd; };
  const pz={}, dz={}, L=M.league||{};
  const norm=(m,sd)=>x=>(x-m)/(sd||1);
  for(const g of Object.keys(MM_UNIT)){ const n=L.norms&&L.norms[g];
    if(n) pz[g]=norm(n[0],n[1]); else { const grp=P.filter(v=>v.group===g); if(grp.length>1) pz[g]=zs(grp.map(v=>v.elo)); } }
  /* each defence once per unit mix: the whole league when the file carries it, else the teams playing this week */
  const byTeam={}; for(const v of P) byTeam[v.opp]=v.opp_def;
  if(L.defs) Object.assign(byTeam,L.defs);
  for(const g of Object.keys(MM_UNIT)){ const vals=Object.values(byTeam).map(d=>MM_UNIT[g].units.reduce((a,u)=>a+d[u],0)/MM_UNIT[g].units.length); dz[g]=zs(vals); }
  /* each unit ranked among the league's defences (this week's without league.defs), 1 the best */
  const rankOf={}; for(const g of Object.keys(MM_UNIT)){ const vals=Object.entries(byTeam).map(([t,d])=>[t,MM_UNIT[g].units.reduce((a,u)=>a+d[u],0)/MM_UNIT[g].units.length]).sort((x,y)=>y[1]-x[1]);
    rankOf[g]={n:vals.length,r:Object.fromEntries(vals.map(([t],i)=>[t,i+1]))}; }
  return P.filter(v=>pz[v.group]).map(v=>{ const d=unitOf(v), a=pz[v.group](v.elo), b=dz[v.group](d);
      const lead=MM_LEAD[v.group], st=v.stats&&v.stats[lead];
      return {...v,unit:Math.round(d),unitName:MM_UNIT[v.group].name,defRank:rankOf[v.group].r[v.opp],defN:rankOf[v.group].n,zp:a,zd:b,score:a-b,lead,proj:st?st[1]:null,nudge:st?st[2]:null}; })
    .filter(v=>v.zp>0&&v.zd<0).sort((x,y)=>y.score-x.score);
}
const MM_LBL={passing_yards:'pass yds',rushing_yards:'rush yds',receiving_yards:'rec yds'};
const ordinal=n=>n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]||'th');
/* the plain words: a Diamond RB against a run D ranked 30th */
const mmLine=v=>`vs a ${esc(v.unitName)} ranked ${ordinal(v.defRank)}`;
const mmProj=v=>v.proj==null?'':`<b>${Math.round(v.proj)} ${MM_LBL[v.lead]}</b> projected${v.nudge?` (${v.nudge>=0?'+':'−'}${Math.abs(v.nudge).toFixed(1)} from the matchup)`:''}`;
function mmName(pid){ return (D.players&&D.players.players&&D.players.players[pid]&&D.players.players[pid].name)||pid; }
/* a click on a player opens his game with his stats already open, scrolled to and highlighted */
function mmOpen(gid,pid){ if(typeof S!=='object'||!S||!S.ui||typeof renderGame!=='function') return;
  S.ui.game=gid; S.ui.open=pid?{[pid]:true}:{}; if(typeof save==='function') save(); renderGame(); if(pid) mmFocus(pid); }
function mmFocus(pid){
  const view=document.getElementById('gameView'), modal=document.getElementById('gameModal'); if(!view) return;
  const row=[...view.querySelectorAll('[data-open]')].find(b=>b.dataset.open===pid); if(!row) return;
  const body=row.nextElementSibling&&row.nextElementSibling.classList.contains('plrbody')?row.nextElementSibling:null;
  for(const n of [row,body]) if(n) n.classList.add('pe-hl');
  if(modal&&!modal.hidden) modal.scrollTop+=row.getBoundingClientRect().top-modal.getBoundingClientRect().top-72;
  else row.scrollIntoView({block:'start'});
}
function mismatchCard(){
  const view=document.getElementById('slateView'); if(!view) return;
  const old=document.getElementById('peMism'); if(old) old.remove();
  const sel=document.getElementById('weekSel'), wk=sel?+sel.value:null;
  if(!D.mu||!D.players||!wk||+D.mu.week!==wk) return;
  const rows=mismatches(); if(!rows.length) return;
  const max=rows[0].score||1;
  const bubble=(v,i)=>`<button class="pe-mm-b" data-mm-game="${esc(v.game_id)}" data-mm-pid="${esc(v.pid)}" title="Open ${esc(mmName(v.pid))}'s stats in ${esc(v.team)} ${v.home?'vs':'at'} ${esc(v.opp)}">
      <span class="pe-mm-n" title="Mismatch rank this week">${i+1}</span>
      <div class="pe-mm-top"><span class="pe-mm-sh" title="${esc(tierName(v.elo))}">${shield(v.elo)}</span><span class="pe-mm-nm">${esc(mmName(v.pid))}<small>(${esc(v.group)})</small></span></div>
      <div class="pe-mm-vs">${tag(v.team,true)}<span>${v.home?'vs':'at'}</span>${tag(v.opp,true)}</div>
      <div class="pe-mm-score"><b class="${mmGrade(v.score)[1]}" title="${mmGrade(v.score)[0]} edge">${v.score.toFixed(1)}</b><span class="pe-mm-bar"><i style="width:${Math.max(6,Math.round(100*v.score/max))}%"></i></span></div>
      <div class="pe-mm-sub">${mmLine(v)}.<br>${mmProj(v)}.</div></button>`;
  const html=`<div class="card pe-mm" id="peMism"><h2>Mismatches <small>week ${esc(D.mu.week)}: the best players against the weakest units they face</small></h2>
    <div class="pe-mm-row">${rows.slice(0,5).map(bubble).join('')}</div>
    ${rows.length>5?`<div class="pe-mm-more"><button class="btn quiet" id="peMmMore">Show the top ${Math.min(30,rows.length)}</button></div>`:''}</div>`;
  const bar=view.querySelector('.bar'); if(bar) bar.insertAdjacentHTML('afterend',html); else view.insertAdjacentHTML('afterbegin',html);
  const card=document.getElementById('peMism');
  card.querySelectorAll('[data-mm-game]').forEach(b=>b.addEventListener('click',()=>mmOpen(b.dataset.mmGame,b.dataset.mmPid)));
  const more=document.getElementById('peMmMore'); if(more) more.addEventListener('click',()=>mismatchModal(rows.slice(0,30)));
}
function mismatchModal(rows){
  let m=document.getElementById('peMmModal');
  if(!m){ m=document.createElement('div'); m.id='peMmModal'; m.className='modal'; m.hidden=true;
    m.innerHTML='<div class="modal-panel" role="dialog" aria-modal="true" aria-label="Mismatches"><div id="peMmView"></div></div>';
    (document.getElementById('tab-slate')||document.body).appendChild(m);
    m.addEventListener('click',e=>{ if(e.target===m) mmClose(); });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!m.hidden) mmClose(); }); }
  const body=rows.map((v,i)=>`<tr data-mm-game="${esc(v.game_id)}" data-mm-pid="${esc(v.pid)}" style="cursor:pointer"><td class="pe-n">${i+1}</td><td class="pe-name">${badge(v.pid)}${esc(mmName(v.pid))} <span class="muted" style="font-weight:600">(${esc(v.group)})</span></td>
    <td class="pe-c">${tag(v.team,true)} <span class="muted">${v.home?'vs':'at'}</span> ${tag(v.opp,true)}</td><td class="pe-c">${ordinal(v.defRank)} of ${v.defN}<small class="muted" style="display:block;font-size:11px">${esc(v.unitName)}</small></td>
    <td class="pe-c pe-edge ${mmGrade(v.score)[1]}"><b>${v.score.toFixed(1)}</b><small>${mmGrade(v.score)[0]}</small></td><td class="pe-n">${v.proj==null?'–':Math.round(v.proj)+' '+MM_LBL[v.lead]}${v.nudge?`<small class="muted" style="display:block;font-size:11px">${v.nudge>=0?'+':'−'}${Math.abs(v.nudge).toFixed(1)} from the matchup</small>`:''}</td></tr>`).join('');
  document.getElementById('peMmView').innerHTML=`<div class="card"><h2 style="display:flex;align-items:center;gap:10px">Mismatches, week ${esc(D.mu.week)} <span class="pill">top ${rows.length}</span><span style="flex:1"></span><button class="btn quiet" id="peMmClose">Close</button></h2>
    <p class="pe-sub">The biggest edges this week between an expected starter and the defense he faces. <b>Edge</b> is how far above his position's average the player stands plus how far below the league's average that defense stands, both in standard deviations: 3 and up is huge, 2 to 3 big, 1 to 2 solid, under 1 slight. <b>Facing</b> ranks the defense among all 32, 1st the best: quarterbacks, receivers and tight ends against the pass defense, backs against the run defense. Click a row to open the game at his stats.</p>
    <div style="overflow-x:auto"><table class="pe-t pe-mm-t"><thead><tr><th class="pe-n">#</th><th>Player</th><th class="pe-c">Game</th><th class="pe-c">Facing</th><th class="pe-c" title="How lopsided the matchup is: the player's standing at his position plus the defence's weakness, in standard deviations">Edge</th><th class="pe-n">Projection</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
  document.getElementById('peMmClose').addEventListener('click',mmClose);
  m.querySelectorAll('tr[data-mm-game]').forEach(r=>r.addEventListener('click',()=>{ mmClose(); mmOpen(r.dataset.mmGame,r.dataset.mmPid); }));
  m.hidden=false; document.body.classList.add('modal-open'); m.scrollTop=0;
}
function mmClose(){ const m=document.getElementById('peMmModal'); if(m){ m.hidden=true; if(!document.querySelector('.modal:not([hidden])')) document.body.classList.remove('modal-open'); } }
window.eloMismatches=mismatches;
if(typeof renderSlate==='function'){ const drawSlate=renderSlate;
  renderSlate=function(){ const r=drawSlate.apply(this,arguments); try{ mismatchCard(); }catch(e){} return r; }; }
if(typeof renderGame==='function'){ const drawGame=renderGame;
  renderGame=function(){ const r=drawGame.apply(this,arguments); decorate(); return r; }; }
/* the Pick'ems board draws a game's players itself when a game is opened */
document.addEventListener('click',()=>setTimeout(decorate,0),true);
document.addEventListener('app-ready',decorate);
function draw(){
  const body=el('peBody');
  if(!D.players||!D.model){ body.innerHTML=`<div class="card"><h2>ELO Ratings</h2><p class="pe-sub">${D.err?esc(D.err):'Loading the ratings…'}</p></div>`; return; }
  defs(); decorate(); trackAlt();
  body.innerHTML=rankings();
  body.querySelectorAll('tr.pe-plrow').forEach(tr=>tr.addEventListener('click',()=>playerModal(tr.dataset.pePl)));
  body.querySelectorAll('.pe-pos button').forEach(b=>b.addEventListener('click',()=>{ D.pos=b.dataset.pos; draw(); }));
  const more=el('peMore'); if(more) more.addEventListener('click',()=>{ D.more=!D.more; draw(); });
  curveHover(body);
  const r=D.model.record, wf=D.model.walk_forward||{}, ws=Object.keys(wf).sort();
  const prior=ws.filter(s=>+s<r.season);
  if(prior.length){ const tot=prior.reduce((a,s)=>a+wf[s].games,0), ok=prior.reduce((a,s)=>a+Math.round(wf[s].accuracy*wf[s].games),0);
    el('peWalkRec').textContent=`${prior[0]}–${prior[prior.length-1]} ${pct(ok/tot)} walk-forward`; }
  const d=new Date(D.model.built_at);
  el('peStamp').textContent=isNaN(d)?'':'rated '+d.toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}
async function boot(){
  const get=async u=>{ const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error(u.replace(/^\.\.\//,'')+' '+r.status); return r.json(); };
  try{
    const [p,m]=await Promise.all([get(P_URL),get(M_URL)]);
    D.players=p; D.model=m;
  }catch(e){ D.err='The ratings could not be loaded: '+(e.message||e); }
  try{ D.mu=await get(MU_URL); }catch(e){}
  draw();
  try{ mismatchCard(); }catch(e){}
}
draw();
boot();
})();
</script>
