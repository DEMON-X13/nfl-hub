<section id="tab-elo" hidden>

    <span class="grow"></span>

<script>
/* ---------- the Player Elo tab ----------
   Every player rated by position, game by game since 2012, and a third game model built on
   those ratings, whose calls since 19 October 2026 start from the Joker's chance and the Elo
   matchup moves it (THE JOKER BASELINE in elo/build.py). elo/build.py does the work on the job's schedule and writes
   elo/data/players.json, model.json and matchups.json; this reads them on every load. The
   model's calls and its record live on the Pick'em Record tab beside the other models'; this
   tab is the rankings, and a click on a player opens his window: his rating and his matchup
   this week. */
(function(){
const P_URL='elo/data/players.json', M_URL='elo/data/model.json', MU_URL='elo/data/matchups.json';
const D={players:null,model:null,mu:null,pos:'QB',more:false,unit:null,tsort:null};
const el=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=p=>Math.round(p*100)+'%';
const tag=(t,mini)=>window.pkTag?window.pkTag(t,window.pkTagColor?window.pkTagColor(t):null,false,mini?'mini':'')
  :'<span class="pill">'+esc(t)+'</span>';
/* the tier is the betting app's own, as betting/tools/tiers.js reshapes it, on the same scale the
   teams wear: HOF 1750+ (a gem), Elite 1700+,
   Master 1650+, Diamond 1600+, Platinum 1550+, Gold 1500+, Silver 1450+, Bronze 1400+, Iron 1350+,
   and Wood under it */
const shield=elo=>window.pkTierBadge?window.pkTierBadge(elo):'';
const tierName=elo=>{ const t=window.pkEloTier?window.pkEloTier(elo):null; return t?t[0]:''; };
function spark(pts){
  if(!pts||!pts.length) return '';
  /* one game in (all of week 1): the line runs from 1500, where every player starts the season */
  if(pts.length<2) pts=[[pts[0][0]-1,1500],pts[0]];
  const v=pts.map(p=>p[1]), lo=Math.min(...v), hi=Math.max(...v), W=84, H=22;
  const x=i=>(i/(v.length-1))*(W-2)+1, y=e=>hi===lo?H/2:H-1-((e-lo)/(hi-lo))*(H-2);
  const d=v.map((e,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(e).toFixed(1)).join(' ');
  const up=v[v.length-1]>=v[0];
  return `<svg class="pe-spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="${up?'var(--pick)':'var(--miss)'}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function move(r){
  const d=r.start_rank-r.rank;
  if(!d) return '<span class="pe-flat">–</span>';
  return d>0?`<span class="pe-up">▲${d}</span>`:`<span class="pe-down">▼${-d}</span>`;
}
/* ---- matchups: the coming week's projections from form, Elo and the defenders faced ----
   elo/build.py fits, for every position and stat, a player's next game on his recent average
   (half-life four games), home, what the defence has allowed, his own Elo and the Elo of the
   opposing DL, LB and DB he will face, on every regular's game since 2016, and the same
   without the two Elo terms. The difference between the two is the Elo nudge. A stat's
   nudge is trusted when, called season by season by the fit on the seasons before, it
   lowered the error and its biggest fifth of nudges landed on their side 53% of the time
   or better; the others are shown faded and are not used for Elo picks. */
const MU_LBL={passing_yards:'Pass yds',passing_tds:'Pass TD',attempts:'Att',completions:'Comp',passing_interceptions:'INT',
  rushing_yards:'Rush yds',carries:'Carries',receptions:'Rec',receiving_yards:'Rec yds',targets:'Tgt',scrim_yards:'Rush+rec',any_td:'TDs'};
function muTrusted(g,st){ const r=D.mu&&D.mu.record&&D.mu.record[g+'|'+st]; const p=r&&r.past;
  return !!p&&p.rmse_elo<p.rmse_form&&p.right_top>=0.53; }
function muNudge(pid,st){ const pl=D.mu&&D.mu.players&&D.mu.players[pid]; if(!pl||!pl.stats[st]||!muTrusted(pl.group,st)) return null;
  const f=D.mu.fit[pl.group+'|'+st]; return f?{nudge:pl.stats[st][2],sd:f.sd,proj:pl.stats[st][1],form:pl.stats[st][0]}:null; }
/* who will not play. The matchups file is rebuilt from that day's roster and injury report:
   Out and Doubtful, and before a club files its statuses, anyone out at its last report who has
   not practised since (or whose club has filed nothing yet) are off its expected lineup, and
   `out` says why for each. The props payload is read on every load too, and the page keeps the
   week's Out and Doubtful in S.inactive; a player ruled out since the Elo build is still in the
   file, so a player's window and the Mismatches leave him out here rather than show a matchup
   he will not play. */
const outWhy=pid=>(D.mu&&D.mu.out&&D.mu.out[pid])||null;
const ruledOut=pid=>!!((typeof S==='object'&&S&&S.inactive&&S.inactive[pid])||outWhy(pid));
window.eloRuledOut=ruledOut;
/* a game that has kicked off is not this week's matchup any more: the file is built in the
   morning and stands until the next build, so the page checks the clock itself (the props
   parts' gameStarted, on the schedule the page already has) */
function gameOn(gid){
  if(typeof S!=='object'||!S||!Array.isArray(S.sched)||typeof gameStarted!=='function') return false;
  const g=S.sched.find(x=>x.id===gid); return !!g&&gameStarted(g);
}
window.eloGameOn=gameOn;
/* a player's season shield, the same one his ranking and his builder badge wear (the season
   rating on the position's bell curve); null when he has no place this season */
const seOf=pid=>{ const e=D.players&&D.players.players&&D.players.players[pid]; return e&&e.se!=null?e.se:null; };
/* each defence's units ranked across the league (`league.defs`, all 32), 1st the best (the
   highest rated), clubs level on a unit sharing its rank; a file without it falls back to the teams playing this week.
   Level is read to the hundredth (mmKey): the file writes a unit to the tenth and a mix of two averages them, so two

/* a window is its tab's own (21 October 2026, with app v126, where the prop model closes the game's page the same
   way): the player's and the team's windows live on the ELO Ratings tab and the Mismatches' list on the Props tab,
   so leaving the tab (another tab's button, or the address moved by Back or a link, which routeTabs turns into a
   click on the tab's button) closes the ones on it. Left open, one hidden with its tab held body's modal-open, so the
   tab the address went to could not scroll, and still answered Escape. Each is read against the tab it lives on, not
   against which sections are hidden yet, so the order the click's listeners run in does not matter; the prop model's
   switch gives a focus left in one to the chosen tab's button */
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{
  for(const [id,shut] of [['peMmModal',mmClose],['pePlModal',plClose],['peTmModal',tmClose]]){
    const m=document.getElementById(id), sec=m&&m.closest('section');
    if(m&&!m.hidden&&sec&&sec.id!=='tab-'+b.dataset.tab) shut(); } }));
window.eloMismatches=mismatches;
/* and the way a Mismatches bubble brings a player's row into view and highlights it, for the Game
   snapshot's Starters names (pkBoard's openOnProps) */
window.eloFocusPlayer=mmFocus;
/* the hub's matchup bubble (glance.js, 17 October 2026) reads a player's matchup as this tab does: the stats where
   the Elo part has held up (muTrusted) and their labels, the defense he faces, a mismatch's grade and what the
   Mismatches set him against, and why the matchups file has him out.
   The defense he faces is one of this tab's own unit tables (model.json's units), the one the Game snapshot's
   position matchups set against his side of the ball (deepdive.js ELO): a quarterback against the opponent's
   Overall Defense (units.def; the owner's call of 16 October 2026, "QB needs to be vs team defense overall"), a back
   against its Run Defense (units.run_def), a receiver or tight end against its Pass Defense (units.pass_def). It is
   named as the tab names the table and ranked as the table draws the club (the file's rank, the # column, with a
   club yet to play shown on its carried rating and marked carried, as carryTag marks it), out of the clubs the
   table lists, as a team's window counts them. None for a kicker, before a team has a rating (the tab draws no
   unit pill: unitsOn) or on a file without that table (unitKeys). Until 18 October 2026 this ranked the Mismatches'
   player-Elo unit averages (matchups.json) and called them "pass defense" and "run defense", which put Green Bay's
   pass defense 14th for Dak Prescott and 3rd for George Pickens in the same game while the Pass Defense table drew it
   18th: the Mismatches' edge stays the matchup formula's, and its words say so (mmAgainst), with no rank of its own */
const FACE_TABLE={QB:'def',RB:'run_def',WR:'pass_def',TE:'pass_def'};
function unitFaced(group,opp){
  const key=FACE_TABLE[group]; if(!key||!opp||!unitsOn()||!unitKeys().includes(key)) return null;
  const U=D.model.units, T=U[key], v=T&&T[opp]; if(!v||v.rank==null) return null;
  const C=unitCarry();
  return {key,name:key==='def'?'Overall Defense':String(U.tables[key].label),team:opp,rank:v.rank,n:Object.keys(T).length,elo:v.elo,carried:!!(v.carried&&C),from:C?C.from:null};
}
/* what the Mismatches' edge sets a player against: the matchups file's player ratings of the opponent's units */
const MM_WORDS={DB:'secondary',DL:'defensive line',LB:'linebackers'};
const mmAgainst=g=>MM_UNIT[g]?MM_UNIT[g].units.map(u=>MM_WORDS[u]||u).join(' and '):null;
window.eloGlance={trusted:muTrusted,labels:MU_LBL,unit:unitFaced,grade:mmGrade,against:mmAgainst,outWhy};
if(typeof renderSlate==='function'){ const drawSlate=renderSlate;
  renderSlate=function(){ const r=drawSlate.apply(this,arguments); try{ mismatchCard(); }catch(e){} return r; }; }
if(typeof renderGame==='function'){ const drawGame=renderGame;
  renderGame=function(){ const r=drawGame.apply(this,arguments); decorate(); return r; }; }
/* a game's page draws its players itself when a game is opened (renderGame, or a tab's click) */
document.addEventListener('click',()=>setTimeout(decorate,0),true);
document.addEventListener('app-ready',decorate);
function draw(){
  const body=el('peBody');
  if(!D.players||!D.model){ body.innerHTML=`<div class="card"><h2>ELO Ratings</h2><p class="pe-sub">${D.err?esc(D.err):'Loading the ratings…'}</p></div>`; return; }
  defs(); decorate();
  body.innerHTML=rankings();
  body.querySelectorAll('.pe-pos button[data-unit]').forEach(b=>b.addEventListener('click',()=>{ if(D.unit!==b.dataset.unit) D.tsort=null; D.unit=b.dataset.unit; draw(); }));
  body.querySelectorAll('tr.pe-plrow').forEach(tr=>tr.addEventListener('click',()=>playerModal(tr.dataset.pePl)));
  body.querySelectorAll('tr.pe-tmrow').forEach(tr=>tr.addEventListener('click',()=>teamModal(tr.dataset.team)));
  /* a column sorts best first; the same column again turns it round */
  body.querySelectorAll('table.pe-tt th[data-sort]').forEach(th=>th.addEventListener('click',()=>{ const k=th.dataset.sort, cur=D.tsort||{key:'rank',dir:1};
    D.tsort={key:k,dir:cur.key===k?-cur.dir:1}; draw(); }));
  body.querySelectorAll('.pe-pos button[data-pos]').forEach(b=>b.addEventListener('click',()=>{ D.pos=b.dataset.pos; D.unit=null; draw(); }));
  const more=el('peMore'); if(more) more.addEventListener('click',()=>{ D.more=!D.more; draw(); });
  body.querySelectorAll('.pe-curve').forEach(c=>curveHover(c.parentElement));
  /* the ELO Model's record and its walk-forward on the Joker's baseline were two pills on this bar until 22 October
     2026 (the owner's call: "in elo ratings get rid of the visual buttons"); the Pick'em Record grades the calls */
  const d=new Date(D.model.built_at);
  el('peStamp').textContent=isNaN(d)?'':'rated '+d.toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}
/* the Game snapshot on the Pick'ems tab (nflbets/build/snapshot.html) draws from these same three
   files: it waits on this one read of them rather than asking for them again */
let filesRead=null; const FILES=new Promise(r=>{ filesRead=r; });
window.eloFiles=()=>FILES;
async function boot(){
  const get=async u=>{ const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error(u.replace(/^\.\.\//,'')+' '+r.status); return r.json(); };
  try{
    const [p,m]=await Promise.all([get(P_URL),get(M_URL)]);
    D.players=p; D.model=m;
  }catch(e){ D.err='The ratings could not be loaded: '+(e.message||e); }
  let muErr=null;
  try{ D.mu=await get(MU_URL); }catch(e){ muErr=String(e&&e.message||e); }
  D.muDone=true;
  filesRead({players:D.players,model:D.model,mu:D.mu,err:D.err||null,muErr});
  draw();
  /* the Elo picks and the builder's Elo leans stand on the ratings and the matchups, so the tabs are drawn again now */
  try{ if(typeof S==='object'&&S&&S.sched&&typeof renderPb==='function') renderPb(); }catch(e){}
  try{ mismatchCard(); }catch(e){}
}
draw();
boot();
})();
</script>
