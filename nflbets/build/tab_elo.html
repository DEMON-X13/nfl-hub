<script>
/* ---------- the Player Elo tab ----------
   Every player rated by position, game by game since 2012, and a third game model built on
   those ratings, whose calls since 19 October 2026 start from the Joker's chance and the Elo
   matchup moves it (THE JOKER BASELINE in elo/build.py). elo/build.py does the work on the job's schedule and writes
   elo/data/players.json, model.json and matchups.json; this reads them on every load. The
   model's calls and its record live on the Pick'em Record tab beside the other models'; this
   tab is the rankings, and a click on a player opens his window: his rating and his matchup
   this week. */
(function(){
const P_URL='elo/data/players.json', M_URL='elo/data/model.json', MU_URL='elo/data/matchups.json';
const D={players:null,model:null,mu:null,pos:'QB',more:false,unit:null,tsort:null};
const el=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=p=>Math.round(p*100)+'%';
const tag=(t,mini)=>window.pkTag?window.pkTag(t,window.pkTagColor?window.pkTagColor(t):null,false,mini?'mini':'')
  :'<span class="pill">'+esc(t)+'</span>';
/* the tier is the betting app's own, as betting/tools/tiers.js reshapes it, on the same scale the
   teams wear: HOF 1750+ (a gem), Elite 1700+,
   Master 1650+, Diamond 1600+, Platinum 1550+, Gold 1500+, Silver 1450+, Bronze 1400+, Iron 1350+,
   and Wood under it */
const shield=elo=>window.pkTierBadge?window.pkTierBadge(elo):'';
const tierName=elo=>{ const t=window.pkEloTier?window.pkEloTier(elo):null; return t?t[0]:''; };
function spark(pts){
  if(!pts||!pts.length) return '';
  /* one game in (all of week 1): the line runs from 1500, where every player starts the season */
  if(pts.length<2) pts=[[pts[0][0]-1,1500],pts[0]];
  const v=pts.map(p=>p[1]), lo=Math.min(...v), hi=Math.max(...v), W=84, H=22;
  const x=i=>(i/(v.length-1))*(W-2)+1, y=e=>hi===lo?H/2:H-1-((e-lo)/(hi-lo))*(H-2);
  const d=v.map((e,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(e).toFixed(1)).join(' ');
  const up=v[v.length-1]>=v[0];
  return `<svg class="pe-spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="${up?'var(--pick)':'var(--miss)'}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function move(r){
  const d=r.start_rank-r.rank;
  if(!d) return '<span class="pe-flat">–</span>';
  return d>0?`<span class="pe-up">▲${d}</span>`:`<span class="pe-down">▼${-d}</span>`;
}
/* ---- matchups: the coming week's projections ----
   (29 October 2026) The Elo-adjusted averages (elo/build.py, ELO-ADJUSTED AVERAGES; the owner's call: "i want for elo
   suggestions to match up certain averages vs other averages and adjusted for their overall elo rating ... it shouldnt be
   1:1 comparison it should be dependent on averages on the elo level they face ... there should be some level of ranking
   adjustment each week so that we get accurate estimates based on their current elo ... I want this for every single
   positional leg"): for each expected starter (a club's charted QB1, RB1, WR1-3, TE1 and K1 with three regular games
   behind him) and each leg of his position, his average (his regular games, the recent ones weighing more) times a smooth
   curve in the opposing defence's table on this tab (Pass Defense for receiving and passing, Run Defense for rushing,
   Overall Defense for some touchdowns) and his own Elo, with the matchup formula's other terms where they earned their
   place (elo/tools/elo_avg_fit.py fits it on every expected starter's game of 2016 to the last finished season and
   freezes it; the build applies it every run on the ratings as they stand). matchups.json's `avg` holds each player's
   legs (avg, his average; proj; no_elo, the same leg fitted with no Elo terms; elo, the Elo part, proj less no_elo, in
   the stat's units; sd, the stat's spread at the projection; z, the Elo part in that sd; def_x and elo_x, the Elo
   part's split, the defence's multiplier against the league's average defence and his Elo's (given his average, the
   rest), no_elo x def_x x elo_x = proj, so the two point the Elo part's way; vs, the table he faces, its Elo and rank;
   since 4 November 2026, on a leg reading THE INPUTS, in_x {vol, game, q}, each kind's multiplier inside no_elo against
   a typical starter's inputs, on the twin's own coefficients, so no_elo over their product is the twin at a typical
   starter's inputs), each player's `in` (what the inputs read for him: his snap
   shares, his shares of his club's targets, carries and air yards, its implied points and spread, the wind at kickoff and
   where it came from), and `avg_fit.legs` each leg's fit (its terms, the inputs among them) and record: trusted where, called season by season on 2019-2025 by
   fits on the seasons before, its Elo part lowered the miss and its largest fifth landed on its side more than half the
   time. An untrusted leg is shown faded and leans no Elo pick. A file built before the block carries the matchup
   formula's projections alone (players' stats [recent form, projection, nudge], fit's sd and record's past: the rule
   until 29 October 2026, his recent average, home, what the defence allowed, his Elo and the opposing DL, LB and DB,
   trusted where the nudge lowered the error and its biggest fifth landed 53% of the time or better) and is read as before,
   so an older elo/data never breaks the page. Since 4 November 2026 the Mismatches rank the block's own Elo part on a

/* Overall Offense and Overall Defense: every team's offense and defense on this season's games,

  const unitOf=v=>MM_UNIT[v.group].units.reduce((a,u)=>a+v.opp_def[u],0)/MM_UNIT[v.group].units.length;
  const zs=(arr)=>{ const m=arr.reduce((a,x)=>a+x,0)/arr.length, sd=Math.sqrt(arr.reduce((a,x)=>a+(x-m)**2,0)/Math.max(1,arr.length-1))||1; return x=>(x-m)/sd; };
  const pz={}, dz={}, L=M.league||{};
  const norm=(m,sd)=>x=>(x-m)/(sd||1);
  for(const g of Object.keys(MM_UNIT)){ const n=L.norms&&L.norms[g];
    if(n) pz[g]=norm(n[0],n[1]); else { const grp=P.filter(v=>v.group===g); if(grp.length>1) pz[g]=zs(grp.map(v=>v.elo)); } }
  /* each defence once per unit mix: the whole league when the file carries it, else the teams playing this week */
  const byTeam={}; for(const v of P) byTeam[v.opp]=v.opp_def;
  if(L.defs) Object.assign(byTeam,L.defs);
  for(const g of Object.keys(MM_UNIT)){ const vals=Object.values(byTeam).map(d=>MM_UNIT[g].units.reduce((a,u)=>a+d[u],0)/MM_UNIT[g].units.length); dz[g]=zs(vals); }
  /* each unit ranked among the league's defences (this week's without league.defs), 1 the best; clubs level on it
     share a rank, one more than the clubs above them (20 October 2026: ATL and NO, level at 1512.6 on the secondary,
     read 24th and 23rd here by the order the page first met them as opponents, and the other way round in the Game
     snapshot's Starters headers, which sorted league.defs' own order) */
  const rankOf={}; for(const g of Object.keys(MM_UNIT)){ const vals=Object.entries(byTeam).map(([t,d])=>[t,MM_UNIT[g].units.reduce((a,u)=>a+d[u],0)/MM_UNIT[g].units.length]);
    rankOf[g]={n:vals.length,r:Object.fromEntries(vals.map(([t,x])=>[t,1+vals.filter(([,y])=>mmKey(y)>mmKey(x)).length]))}; }
  return P.filter(v=>pz[v.group]).map(v=>{ const d=unitOf(v), a=pz[v.group](v.elo), b=dz[v.group](d);
      const lead=MM_LEAD[v.group], x=muLine(v.pid,lead), ok=!!x&&isFinite(x.proj), tr=ok&&muTrusted(x.v.group,lead);
      return {...v,unit:Math.round(d),against:mmAgainst(v.group),grade:mmGrade(a-b)[0],defRank:rankOf[v.group].r[v.opp],defN:rankOf[v.group].n,zp:a,zd:b,score:a-b,lead,proj:ok?x.proj:null,nudge:tr&&isFinite(x.nudge)?x.nudge:null}; })
    .filter(v=>v.zp>0&&v.zd<0).sort((x,y)=>y.score-x.score);
}
const MM_LBL={passing_yards:'pass yds',rushing_yards:'rush yds',receiving_yards:'rec yds'};
/* the plain words. What a mismatch ranks is the matchup formula's units, the averages of the player ratings of the
   defenders he faces (the secondary for a receiver or tight end, the secondary and the line for a quarterback, the
   line and the linebackers for a back), never the ELO Ratings tab's Pass Defense or Run Defense table, which rate a
   defense on its plays and can rank the same club far apart (LAC 32nd of the one for Patrick Mahomes, 4th of the
   other, in week 6): so its words name the units and what ranks them, and "pass defense ranked" on the page is the
   table's alone (18 October 2026, beside the matchup bubble, whose Faces line is the table's) */
const mmLine=v=>`vs the ${esc(v.opp)} ${esc(v.against)}, ${ordinal(v.defRank)} by player Elo`;
const mmTitle=v=>`${mmGrade(v.score)[0]} mismatch this week: edge ${v.score.toFixed(1)}, ${v.group} vs the ${v.opp} ${v.against}, ranked ${ordinal(v.defRank)} of ${v.defN} on the matchup formula's player ratings`;
const mmProj=v=>v.proj==null?'':`<b>${Math.round(v.proj)} ${MM_LBL[v.lead]}</b> projected${v.nudge?` (${v.nudge>=0?'+':'−'}${Math.abs(v.nudge).toFixed(1)} from the matchup)`:''}`;
/* what the Mismatches' edge sets a player against: the matchups file's player ratings of the opponent's units */
const MM_WORDS={DB:'secondary',DL:'defensive line',LB:'linebackers'};
const mmAgainst=g=>MM_UNIT[g]?MM_UNIT[g].units.map(u=>MM_WORDS[u]||u).join(' and '):null;
/* the game page tags Solid and up; Suggested Parlays' cards say the grade */
const mmTaggedOld=v=>mmGrade(v.score)[0]!=='Slight';
function mmTagElOld(v,elo){
  const g=mmGrade(v.score)[0], t=document.createElement('span');
  t.className='pe-mmtag'; t.dataset.peMmtag=v.score.toFixed(1); t.dataset.peMmgrade=g;
  t.title=mmTitle(v);
  t.textContent=elo?g+' mismatch':'Mismatch'; return t;
}
const bubbleOld=(v,i,max)=>`<button class="pe-mm-b" data-mm-game="${esc(v.game_id)}" data-mm-pid="${esc(v.pid)}" title="Open ${esc(mmName(v.pid))}'s stats in ${esc(v.team)} ${v.home?'vs':'at'} ${esc(v.opp)}">
      <span class="pe-mm-n" title="Mismatch rank this week">${i+1}</span>
      <div class="pe-mm-top">${seOf(v.pid)!=null?`<span class="pe-mm-sh" title="${esc(tierName(seOf(v.pid)))} · this season">${shield(seOf(v.pid))}</span>`:''}<span class="pe-mm-nm">${esc(mmName(v.pid))}<small>(${esc(v.group)})</small></span></div>
      <div class="pe-mm-vs">${tag(v.team,true)}<span>${v.home?'vs':'at'}</span>${tag(v.opp,true)}</div>
      <div class="pe-mm-score"><b class="${mmGrade(v.score)[1]}" title="${mmGrade(v.score)[0]} edge">${v.score.toFixed(1)}</b><span class="pe-mm-bar"><i style="width:${Math.max(6,Math.round(100*v.score/max))}%"></i></span></div>
      <div class="pe-mm-sub">${mmLine(v)}.${mmProj(v)?`<br>${mmProj(v)}.`:''}</div></button>`;
const rowOld=(v,i)=>`<tr data-mm-game="${esc(v.game_id)}" data-mm-pid="${esc(v.pid)}" style="cursor:pointer"><td class="pe-n">${i+1}</td><td class="pe-name">${badge(v.pid)}${esc(mmName(v.pid))} <span class="muted" style="font-weight:600">(${esc(v.group)})</span></td>
    <td class="pe-c">${tag(v.team,true)} <span class="muted">${v.home?'vs':'at'}</span> ${tag(v.opp,true)}</td><td class="pe-c">${ordinal(v.defRank)} of ${v.defN}<small class="muted" style="display:block;font-size:11px">${esc(v.against)}</small></td>
    <td class="pe-c pe-edge ${mmGrade(v.score)[1]}"><b>${v.score.toFixed(1)}</b><small>${mmGrade(v.score)[0]}</small></td><td class="pe-n">${v.proj==null?'–':Math.round(v.proj)+' '+MM_LBL[v.lead]}${v.nudge?`<small class="muted" style="display:block;font-size:11px">${v.nudge>=0?'+':'−'}${Math.abs(v.nudge).toFixed(1)} from the matchup</small>`:''}</td></tr>`;
const MM_HEAD_OLD=`<th class="pe-n">#</th><th>Player</th><th class="pe-c">Game</th><th class="pe-c">Facing</th><th class="pe-c" title="How lopsided the matchup is: the player's standing at his position plus the defence's weakness, in standard deviations">Edge</th><th class="pe-n">Projection</th>`;
/* } OLD-MISMATCHES */
function mmName(pid){ return (D.players&&D.players.players&&D.players.players[pid]&&D.players.players[pid].name)||pid; }
/* a click on a player opens his game with his stats already open, scrolled to and highlighted */
function mmOpen(gid,pid){ if(typeof S!=='object'||!S||!S.ui||typeof renderGame!=='function') return;
  S.ui.game=gid; S.ui.open=pid?{[pid]:true}:{}; if(typeof save==='function') save(); renderGame(); if(pid) mmFocus(pid); }
function mmFocus(pid){
  const view=document.getElementById('gameView'), modal=document.getElementById('gameModal'); if(!view) return;
  const row=[...view.querySelectorAll('[data-open]')].find(b=>b.dataset.open===pid); if(!row) return;
  const body=row.nextElementSibling&&row.nextElementSibling.classList.contains('plrbody')?row.nextElementSibling:null;
  for(const n of [row,body]) if(n) n.classList.add('pe-hl');
  if(modal&&!modal.hidden) modal.scrollTop+=row.getBoundingClientRect().top-modal.getBoundingClientRect().top-72;
  else row.scrollIntoView({block:'start'});
}
function mismatchCard(){
  const view=document.getElementById('slateView'); if(!view) return;
  const old=document.getElementById('peMism'); if(old) old.remove();
  const sel=document.getElementById('weekSel'), wk=sel?+sel.value:null;
  if(!D.mu||!D.players||!wk||+D.mu.week!==wk) return;
  const rows=mismatches(); if(!rows.length) return;
  const max=(rows[0].v2?rows[0].shift:rows[0].score)||1;
  const bubble=(v,i)=>v.v2?bubbleV2(v,i,max):bubbleOld(v,i,max);
  /* until a club files its game statuses, who starts is the build's reading of the practice
     reports (a player out last week who has not practised since is counted out): the count alone
     says so (22 October 2026, the owner's call: no descriptions; the card's tagline went with it) */
  const rep=Object.values(D.mu.reports||{}).filter(r=>r.week===+D.mu.week), filed=rep.filter(r=>r.statuses_filed).length;
  const pending=rep.length&&filed<rep.length?`<p class="pe-mm-sub" style="margin:6px 0 0">Statuses filed: ${filed} of ${rep.length} clubs.</p>`:'';
  const html=`<div class="card pe-mm" id="peMism"><h2>Mismatches <small>week ${esc(D.mu.week)}</small></h2>${pending}
    <div class="pe-mm-row">${rows.slice(0,5).map(bubble).join('')}</div>
    ${rows.length>5?`<div class="pe-mm-more"><button class="btn quiet" id="peMmMore">Show the top ${Math.min(30,rows.length)}</button></div>`:''}</div>`;
  const bar=view.querySelector('.bar'); if(bar) bar.insertAdjacentHTML('afterend',html); else view.insertAdjacentHTML('afterbegin',html);
  const card=document.getElementById('peMism');
  card.querySelectorAll('[data-mm-game]').forEach(b=>b.addEventListener('click',()=>mmOpen(b.dataset.mmGame,b.dataset.mmPid)));
  const more=document.getElementById('peMmMore'); if(more) more.addEventListener('click',()=>mismatchModal(rows.slice(0,30)));
}
function mismatchModal(rows){
  let m=document.getElementById('peMmModal');
  if(!m){ m=document.createElement('div'); m.id='peMmModal'; m.className='modal'; m.hidden=true;
    m.innerHTML='<div class="modal-panel" role="dialog" aria-modal="true" aria-label="Mismatches"><div id="peMmView"></div></div>';
    (document.getElementById('tab-slate')||document.body).appendChild(m);
    m.addEventListener('click',e=>{ if(e.target===m) mmClose(); });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!m.hidden) mmClose(); }); }
  const v2=!!(rows[0]&&rows[0].v2), body=rows.map((v,i)=>v.v2?rowV2(v,i):rowOld(v,i)).join('');
  document.getElementById('peMmView').innerHTML=`<div class="card"><h2 style="display:flex;align-items:center;gap:10px">Mismatches, week ${esc(D.mu.week)} <span class="pill">top ${rows.length}</span><span style="flex:1"></span><button class="btn quiet" id="peMmClose">Close</button></h2>
    <div style="overflow-x:auto"><table class="pe-t pe-mm-t"><thead><tr>${v2?MM_HEAD_V2:MM_HEAD_OLD}</tr></thead><tbody>${body}</tbody></table></div></div>`;
  document.getElementById('peMmClose').addEventListener('click',mmClose);
  m.querySelectorAll('tr[data-mm-game]').forEach(r=>r.addEventListener('click',()=>{ mmClose(); mmOpen(r.dataset.mmGame,r.dataset.mmPid); }));
  m.hidden=false; document.body.classList.add('modal-open'); m.scrollTop=0;
}
function mmClose(){ const m=document.getElementById('peMmModal'); if(m){ m.hidden=true; if(!document.querySelector('.modal:not([hidden])')) document.body.classList.remove('modal-open'); } }
/* a window is its tab's own (21 October 2026, with app v126, where the prop model closes the game's page the same
   way): the player's and the team's windows live on the ELO Ratings tab and the Mismatches' list on the Props tab,
   so leaving the tab (another tab's button, or the address moved by Back or a link, which routeTabs turns into a
   click on the tab's button) closes the ones on it. Left open, one hidden with its tab held body's modal-open, so the
   tab the address went to could not scroll, and still answered Escape. Each is read against the tab it lives on, not
   against which sections are hidden yet, so the order the click's listeners run in does not matter; the prop model's
   switch gives a focus left in one to the chosen tab's button */
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{
  for(const [id,shut] of [['peMmModal',mmClose],['pePlModal',plClose],['peTmModal',tmClose]]){
    const m=document.getElementById(id), sec=m&&m.closest('section');
    if(m&&!m.hidden&&sec&&sec.id!=='tab-'+b.dataset.tab) shut(); } }));
window.eloMismatches=mismatches;
/* and the way a Mismatches bubble brings a player's row into view and highlights it, for the Game
   snapshot's Starters names (pkBoard's openOnProps) */
window.eloFocusPlayer=mmFocus;
/* the hub's matchup bubble (glance.js, 17 October 2026) reads a player's matchup as this tab does: the stats where
   the Elo part has held up (muTrusted) and their labels, the defense he faces, a mismatch's words (since 4 November
   2026 a score's row's title and its size, "+7 pts (+6.1 rec yds)"; a row of the old Mismatches carries its grade and
   what it was set against itself), and why the matchups file has him out.
   The defense he faces is one of this tab's own unit tables (model.json's units), the one the Game snapshot's
   position matchups set against his side of the ball (deepdive.js ELO): a quarterback against the opponent's
   Overall Defense (units.def; the owner's call of 16 October 2026, "QB needs to be vs team defense overall"), a back
   against its Run Defense (units.run_def), a receiver or tight end against its Pass Defense (units.pass_def). It is
   named as the tab names the table and ranked as the table draws the club (the file's rank, the # column, with a
   club yet to play shown on its carried rating and marked carried, as carryTag marks it), out of the clubs the
   table lists, as a team's window counts them. None for a kicker, before a team has a rating (the tab draws no
   unit pill: unitsOn) or on a file without that table (unitKeys). Until 18 October 2026 this ranked the Mismatches'
   player-Elo unit averages (matchups.json) and called them "pass defense" and "run defense", which put Green Bay's
   pass defense 14th for Dak Prescott and 3rd for George Pickens in the same game while the Pass Defense table drew it
   18th. Since 4 November 2026 the Mismatches name the same table (a back's Run Defense, a receiver's or tight end's Pass
   Defense), its rank the tab's own */
const FACE_TABLE={QB:'def',RB:'run_def',WR:'pass_def',TE:'pass_def'};
/* one club's row of one of the tab's team tables (key: 'def' or a position table's), as the table draws it, or null
   (before a team has a rating, a file without the table, no row for the club); a player's window ranks the three
   defence tables by it too (defPill) */
function unitRow(key,opp){
  if(!key||!opp||!unitsOn()||!unitKeys().includes(key)) return null;
  const U=D.model.units, T=U[key], v=T&&T[opp]; if(!v||v.rank==null) return null;
  const C=unitCarry();
  return {key,name:key==='def'?'Overall Defense':String(U.tables[key].label),team:opp,rank:v.rank,n:Object.keys(T).length,elo:v.elo,carried:!!(v.carried&&C),from:C?C.from:null};
}
const unitFaced=(group,opp)=>unitRow(FACE_TABLE[group],opp);
/* (29 October 2026) and a player's projections as this tab reads them, one shape whichever file (muLine): his entry's
   group, game, club and opponent, whether they are the Elo-adjusted averages (avg), his position's legs in the file's
   order and each leg's [his average or recent form, projection, Elo part]; null where the file has none of his */
function muGlance(pid){ const v=muEntry(pid); if(!v) return null; const order=muStats(v.group)||Object.keys(v.stats||{}), stats={};
  for(const st of order){ const x=muLine(pid,st); if(x&&isFinite(x.form)&&isFinite(x.proj)) stats[st]=[x.form,x.proj,x.nudge]; }
  return {group:v.group,game_id:v.game_id,team:v.team,opp:v.opp,avg:muAvgOn(),order,stats}; }
const mmGlTitle=v=>v&&v.v2?v.say.title:'', mmGlPts=v=>v&&v.v2?`${v.say.pts} (${v.say.yds})`:'';
window.eloGlance={trusted:muTrusted,labels:MU_LBL,unit:unitFaced,title:mmGlTitle,pts:mmGlPts,outWhy,entry:muGlance};
if(typeof renderSlate==='function'){ const drawSlate=renderSlate;
  renderSlate=function(){ const r=drawSlate.apply(this,arguments); try{ mismatchCard(); }catch(e){} return r; }; }
if(typeof renderGame==='function'){ const drawGame=renderGame;
  renderGame=function(){ const r=drawGame.apply(this,arguments); decorate(); return r; }; }
/* a game's page draws its players itself when a game is opened (renderGame, or a tab's click) */
document.addEventListener('click',()=>setTimeout(decorate,0),true);
document.addEventListener('app-ready',decorate);
function draw(){
  const body=el('peBody');
  if(!D.players||!D.model){ body.innerHTML=`<div class="card"><h2>ELO Ratings</h2><p class="pe-sub">${D.err?esc(D.err):'Loading the ratings…'}</p></div>`; return; }
  defs(); decorate();
  body.innerHTML=rankings();
  body.querySelectorAll('.pe-pos button[data-unit]').forEach(b=>b.addEventListener('click',()=>{ if(D.unit!==b.dataset.unit) D.tsort=null; D.unit=b.dataset.unit; draw(); }));
  body.querySelectorAll('tr.pe-plrow').forEach(tr=>tr.addEventListener('click',()=>playerModal(tr.dataset.pePl)));
  body.querySelectorAll('tr.pe-tmrow').forEach(tr=>tr.addEventListener('click',()=>teamModal(tr.dataset.team)));
  /* a column sorts best first; the same column again turns it round */
  body.querySelectorAll('table.pe-tt th[data-sort]').forEach(th=>th.addEventListener('click',()=>{ const k=th.dataset.sort, cur=D.tsort||{key:'rank',dir:1};
    D.tsort={key:k,dir:cur.key===k?-cur.dir:1}; draw(); }));
  body.querySelectorAll('.pe-pos button[data-pos]').forEach(b=>b.addEventListener('click',()=>{ D.pos=b.dataset.pos; D.unit=null; draw(); }));
  const more=el('peMore'); if(more) more.addEventListener('click',()=>{ D.more=!D.more; draw(); });
  body.querySelectorAll('.pe-curve').forEach(c=>curveHover(c.parentElement));
  /* the ELO Model's record and its walk-forward on the Joker's baseline were two pills on this bar until 22 October
     2026 (the owner's call: "in elo ratings get rid of the visual buttons"); the Pick'em Record grades the calls */
  const d=new Date(D.model.built_at);
  el('peStamp').textContent=isNaN(d)?'':'rated '+d.toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}
/* the Game snapshot on the Pick'ems tab (nflbets/build/snapshot.html) draws from these same three
   files: it waits on this one read of them rather than asking for them again */
let filesRead=null; const FILES=new Promise(r=>{ filesRead=r; });
window.eloFiles=()=>FILES;
async function boot(){
  const get=async u=>{ const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error(u.replace(/^\.\.\//,'')+' '+r.status); return r.json(); };
  try{
    const [p,m]=await Promise.all([get(P_URL),get(M_URL)]);
    D.players=p; D.model=m;
  }catch(e){ D.err='The ratings could not be loaded: '+(e.message||e); }
  let muErr=null;
  try{ D.mu=await get(MU_URL); }catch(e){ muErr=String(e&&e.message||e); }
  D.muDone=true;
  filesRead({players:D.players,model:D.model,mu:D.mu,err:D.err||null,muErr});
  draw();
  /* the Mismatch tags on Suggested Parlays and the builder's Elo leans stand on the ratings and the matchups, so the tabs
     are drawn again now */
  try{ if(typeof S==='object'&&S&&S.sched&&typeof renderPb==='function') renderPb(); }catch(e){}
  try{ mismatchCard(); }catch(e){}
}
draw();
boot();
})();
