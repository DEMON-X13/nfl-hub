<!-- The Game snapshot: one window with everything the site has on one game. build.js sets its
     styles in beside the tabs' and runs its script last, after the Player Elo tab's; every class
     and id is prefixed gs- and the script is one closure.

     A tap on a game on the Pick'ems board (its row is a button: a click, Enter or Space;
     tab_pickems.html) opens this window over the page -- the page's own modal, closed by Escape,
     Close or a click outside it, Tab kept inside, the focus back on the row after. It reads at a
     glance first, the details after:

       the header      (pinned) the two teams and the week; once the verdict's line has scrolled
                       away, the game in one line instead (each team's record and the spread, or
                       the score), so the matchup stays in view over the folded cards
       the verdict     (always shown) first the button to the game's own page on the Props tab
                       (Game bets and player props, where the Props tab can open it:
                       pkBoard.canProps); then the head: the away team and its record (3-2: the
                       season's regular-season results from betting/state.json, as Team Rankings
                       counts them), the middle, the home team and its record. The middle holds the
                       score once there is one, the kickoff in the viewer's time and the site, and
                       the preview: the week's one-sentence note on the game, written by Claude
                       each Wednesday into news/data/notes/<season>-w<week>.json (the players it
                       names, marked **so** there, in bold; the file's news and sources are not
                       shown, the owner's call of 14 October 2026), or until it is written an
                       automatic line for a game still to come (who visits whom, their records,
                       when); on a phone the two teams share the top row and the middle goes
                       under them. A
                       played game's note follows the head; then the headline -- "Jaguars favoured
                       by 7.5", its chance and the board's confidence, or once played who won and
                       whether it was an upset, with the line it was favoured by under it -- on the
                       board's own split bar; the spread, total and moneylines; and five
                       lines that answer the questions a visitor comes with, each a button that
                       opens its card: the model picks (how many of the three models agree with
                       Vegas, the ones that do not named, and once played how many calls were
                       right), the Team Elo gap, which side ranks higher on offense against
                       defense each way, who is out and how many starters are questionable, and
                       the top mismatch
       then a card each, folded (on a wide screen Model Picks and Team strength open, the rest
       folded; on a phone all folded; Open all and Close all), each a click to open. Model Picks,
       Team strength and Offense vs defense have no summary in their title and no note under them
       (the owner's call, 14 October 2026: the verdict says it, and the descriptions were redundant):
         model picks   Vegas, Alpha Model, the Joker and the ELO Model: pick and chance on one lean
                       chart (each bar leans from 50/50 to the side its call picks, in that team's
                       colour), graded once played
         team strength each team's Power Rating (elo/data/model.json `teams`): rating, shield,
                       rank, change since its last game, chance against an average team (a rating
                       from before a team's latest final starred, and said under the table)
         offense vs    Overall Offense against Overall Defense, both ways (`units`), one possession
         defense       under the other, laid out like the head, centred and limited (the owner's
                       call, 14 October 2026): its title ("Seahawks Possession"), the Deep Dive's tag
                       on the gap read as points under it (deepdive.js headTag), the two ratings in two
                       boxes of one size, the better rank's tinted; then the Deep Dive itself,
                       "Position matchups": that offense's four position matchups against that
                       defense, a compact row each, the unit, the two sides' clubs and Elo (the
                       owner's calls, 16 October 2026: the quarterback's own season Elo against the
                       Overall Defense, Pass Protection against Pass Rush, Run Offense against Run
                       Defense, Pass Offense against Pass Defense, from the Elo files the window
                       already has, deepdive.js eloSides; each Elo with its tier's shield before
                       it, the ELO Ratings tab's own; the higher marked; a side with no Elo its rank
                       as before, with no shield), the defense's position it faces (Overall defense,
                       Pass rush, Run defense, Coverage: the owner's call, 16 October 2026) and the
                       tag (deepdive.js possession, on news/data/units.json, where it is for this
                       game's week; the tag is the Deep Dive's own, never worked from the Elo, the
                       quarterback's still his passing against the pass defense), no names, no one
                       out and no other numbers (who plays is the Starters card's); a unit with no
                       game yet this season on its rating carried from last season, marked so.
                       What the ratings and the
                       Deep Dive rest on is said on hover (the boxes' title, deepdive.js basis as the
                       matchups' label's title, each side's title and the tag's, which gives the edge)
         mismatches    the Props tab's Mismatches (window.eloMismatches) in this game, each with
                       its edge on a four-step meter
         starters      the ranked players out first, then the Offense, Defense and Kicker tabs, the
                       two teams' header under them, and each team's expected starters
                       (matchups.json `lineups`) on those tabs, each name a button to his own row on
                       the game's page on the Props tab where the prop model draws one (the owner's
                       call, 16 October 2026; pkBoard.propsPlayers and openOnProps), each with
                       his season Elo, rank and shield as the ELO Ratings tab shows them and a Q
                       where the report has him questionable, the higher Elo of each pair marked
                       and each defensive unit's league rank at either end of its group's header
       (the Sources card, with the files' publish times and links to the full tabs, went on 14 October
       2026, the owner's call, and the Stat breakdown, the season's eleven team stats from
       news/data/stats.json as bars, on 16 October 2026, the owner's call: "get rid of stat breakdown
       section"; a news file still loading or that did not load is said in its own part)

     The side of a comparison with the edge wears one mark everywhere (gs-better): the higher
     rating, Elo and chance, the better rank. Nothing here is computed afresh: every number is a
     file's, or the board's and the Elo tab's own functions on those files (window.pkBoard,
     window.eloMismatches); the verdict's tallies and the Elo gap are counts and a difference of
     the numbers shown beneath them, and smoke.js holds each to the files (every element marked
     data-gs-n). The Elo files are the ones the ELO Ratings tab read on load (window.eloFiles):
     nothing is fetched a second time. The news job's files (news/data/units.json and the week's
     notes; stats.json is not read here since the Stat breakdown went) are fetched here with no-store
     as the page loads (the notes of the board's week once the board has its schedule, another week's
     the first time one of its games opens):
     each once a page load, the notes once a week, never baked into the page, so a news job publish
     is on the next load. A file that did not load, or has nothing for the game, says so in its card
     and its summary (the preview draws its automatic line); one still loading says that; the rest
     draws. A file answering, or the prop model
     coming up, draws the window again with the visitor's place kept: the focus on the same control
     and what was being read where it was on the screen. Opening and closing a card or a fold, or
     picking a Starters tab, never redraws the window, and nothing of it is saved. -->
<style>
/* the page's modal pads its top by 28px, and a sticky header sticks inside that padding, so the
   window's content showed in a band above it once scrolled: the gap is the panel's margin instead */
#gsModal{z-index:55;padding-top:0}
/* one type scale: 11 (labels), 13 (notes, summaries), 15 (text), 18 (titles, answers), 22 (the
   headline and records), 30 (the score); a phone takes the top two down to 20 and 26 */
#gsModal{--gs-t1:11px;--gs-t2:13px;--gs-t3:15px;--gs-t4:18px;--gs-t5:22px;--gs-t6:30px;--gs-th:64px}
/* red text on the red tint (the Upset chip, the out badge, a team's players-out heading) a shade
   darker than the page's red, which reads at 4.4:1 there; this is 5.3:1 (6.6 on white). The
   preview's dark theme sets its own */
#gsModal{--gs-miss-ink:#A93226}
/* the Big mismatch grade's green (the ELO tab's) is 4:1 on white; a shade darker reads at 4.9 */
#gsModal .pe-g3{color:#2E8050!important}
#gsModal .modal-panel{max-width:1000px;padding:0 0 24px;overflow:visible;margin-top:28px}
#gsModal button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.gs-top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;height:var(--gs-th);box-sizing:border-box;padding:0 20px;background:var(--bg-2);border-bottom:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 0 0}
.gs-top h2{margin:0;min-width:0;display:flex;flex-direction:column;gap:4px;line-height:1.15}
.gs-top .gs-tm{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:var(--gs-t3);font-weight:600;color:var(--muted)}
.gs-top .gs-tsub{font-family:var(--body);font-size:var(--gs-t2);font-weight:600;color:var(--ink-2)}
/* the game in one line, once the verdict's line has scrolled away */
.gs-mini{display:none;align-items:center;gap:8px;min-width:0;font-size:var(--gs-t2);font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.gs-mini b{font-family:var(--display);font-size:var(--gs-t3);font-weight:700;color:var(--ink)}
.gs-mini .gs-msep{color:var(--line-2)}
.gs-top.gs-stuck h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gs-top.gs-stuck .gs-mini{display:flex}
.gs-grow{flex:1}
#gsClose{min-height:44px;min-width:64px}
.gs-body{padding:16px 20px 0}
#gsModal .gs-sec.card{margin:0 0 14px;padding:0}

.gs-lab{display:block;font-size:var(--gs-t1);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.gs-msg{margin:0;font-size:var(--gs-t3);color:var(--ink-2);line-height:1.55}
.gs-note{margin:14px 0 0;font-size:var(--gs-t2);color:var(--muted);line-height:1.6}
.gs-note+.gs-note{margin-top:6px}
.gs-num{font-family:var(--display);font-weight:700;color:var(--ink)}
.gs-up{color:var(--pick);font-weight:700} .gs-down{color:var(--miss);font-weight:700} .gs-flat{color:var(--muted)}
.gs-sh{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.gs-sh .tierbadge{width:18px;height:20px;flex:none}
.gs-tiern{font-size:var(--gs-t2);font-weight:600;color:var(--ink-2)}
.gs-none{font-size:var(--gs-t2);color:var(--muted)}
.gs-nw{white-space:nowrap}
.gs-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#gsModal .pk-ttag.pk-mini{font-size:var(--gs-t1);padding:3px 5px;min-width:36px;border-radius:5px}
/* the one mark for the side of a comparison that has the edge; every compared value sits in a
   box of the same padding, marked or not, so the two sides line up */
.gs-v{display:inline-flex;align-items:baseline;gap:5px;border-radius:7px;padding:2px 7px}
.gs-better{background:var(--pick-soft);color:var(--pick)}
#gsModal .gs-better .gs-num,#gsModal .gs-better b,#gsModal .gs-better small,#gsModal .gs-better.gs-num,#gsModal .gs-pl .gs-pse.gs-better{color:var(--pick)}
.gs-key{display:inline-flex;align-items:center;gap:6px;font-size:var(--gs-t2);color:var(--muted);text-transform:none;letter-spacing:0;font-weight:600}
.gs-key i{display:inline-block;width:14px;height:10px;border-radius:3px;background:var(--pick-soft);box-shadow:inset 0 0 0 1.5px var(--pick)}
/* a model's dot, in its colour */
.gs-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gs-mc,var(--ink));flex:none;vertical-align:1px}
/* the edge of a mismatch on four steps (Slight, Solid, Big, Huge), in its grade's colour */
.gs-meter{display:inline-flex;align-items:flex-end;gap:2px;height:14px;vertical-align:-2px;flex:none}
.gs-meter i{display:block;width:4px;border-radius:1px;background:var(--line-2)}
.gs-meter i:nth-child(1){height:5px} .gs-meter i:nth-child(2){height:8px} .gs-meter i:nth-child(3){height:11px} .gs-meter i:nth-child(4){height:14px}
.gs-meter.gs-l1 i:nth-child(-n+1),.gs-meter.gs-l2 i:nth-child(-n+2),.gs-meter.gs-l3 i:nth-child(-n+3),.gs-meter.gs-l4 i:nth-child(-n+4){background:currentColor}

/* ---- the verdict ---- */
#gsModal .gs-verdict.card{padding:24px 24px 8px}
/* first in it, the game's own page on the Props tab */
#gsModal .gs-propsrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin:0 0 18px}
#gsModal .gs-props{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:8px 16px;font-size:var(--gs-t3);font-weight:600}
/* the head: the away team, the middle, the home team (the owner's ask, 14 October 2026: no "at" circle,
   the AWAY and HOME labels say it). The middle holds the score once there is one, the kickoff and site,
   and the preview; under 900px the two teams share the top row and the middle goes full width under them */
.gs-hero{display:grid;grid-template-columns:minmax(180px,1fr) minmax(0,2.5fr) minmax(180px,1fr);grid-template-areas:"away mid home";gap:16px 24px;align-items:start}
.gs-team{min-width:0;display:flex;flex-direction:column;gap:8px}
.gs-team.gs-away{grid-area:away}
.gs-team.gs-home{grid-area:home;align-items:flex-end;text-align:right}
.gs-tname{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
/* the tag over the name on every screen: the longest names (Commanders, Buccaneers) did not fit beside it
   in a 914px window, and one team stacked while the other did not */
.gs-home .gs-tname{align-items:flex-end}
.gs-tname .pk-ttag{font-size:var(--gs-t4);padding:7px 10px;border-radius:9px}
.gs-tname b{font-family:var(--display);font-size:var(--gs-t4);font-weight:600;color:var(--ink);min-width:0;overflow-wrap:break-word;line-height:1.15}
.gs-rec{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap;font-size:var(--gs-t2);color:var(--ink-2)}
.gs-home .gs-rec{justify-content:flex-end}
.gs-rec b{font-family:var(--display);font-size:var(--gs-t5);font-weight:700;color:var(--ink)}
.gs-lost .gs-tname b,.gs-lost .gs-rec b{color:var(--muted)}
.gs-mid{grid-area:mid;min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.gs-mid .gs-score{display:block;font-family:var(--display);font-size:var(--gs-t6);font-weight:700;letter-spacing:-.5px;color:var(--ink);white-space:nowrap;line-height:1}
.gs-mid .gs-sc{margin-top:26px}
.gs-mid .gs-sc small{display:block;font-size:var(--gs-t1);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:6px;white-space:nowrap}
.gs-when{margin:0;font-size:var(--gs-t2);color:var(--ink-2);line-height:1.5;text-wrap:balance}
.gs-when b{color:var(--ink);font-weight:600}
/* the preview: the week's note on the game (or the automatic line), in the middle under the kickoff */
#gsModal .gs-prev{align-self:stretch;margin:2px 0 0;padding:12px 16px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md)}
#gsModal .gs-pv{margin:0;font-size:var(--gs-t3);color:var(--ink);line-height:1.55}
#gsModal .gs-pv+.gs-pv{margin-top:8px}
#gsModal .gs-pv .gs-lab{display:inline;margin-right:8px;color:var(--ink-2)}
/* a player the note names, bold (the notes mark him **so**; the automatic line bolds each name it lists) */
#gsModal .gs-prev b.gs-pn{font-weight:700;color:var(--ink)}
#gsModal .gs-pauto{margin:6px 0 0;font-size:var(--gs-t2);color:var(--ink-2);line-height:1.5}
/* a played game: a slim note under the head, ruled in gold */
.gs-past{margin:18px auto 0;max-width:640px;padding:4px 0 4px 12px;border-left:3px solid var(--gold);font-size:var(--gs-t2);color:var(--ink-2);line-height:1.5}
.gs-past b{color:var(--ink)}
/* the headline: who is favoured and by how much, or who won; the chance and the board's
   confidence beside it, the board's own split bar under it */
.gs-fav{margin:20px 0 0;padding:16px 18px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md)}
.gs-favh{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.gs-favt{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-family:var(--display);font-size:var(--gs-t5);font-weight:700;color:var(--ink);line-height:1.2;min-width:0}
.gs-favp{display:inline-flex;align-items:center;gap:8px;font-size:var(--gs-t3);color:var(--ink-2);white-space:nowrap}
.gs-favp b{font-family:var(--display);font-size:var(--gs-t5);font-weight:700;color:var(--ink)}
.gs-favsub{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin:8px 0 0;font-size:var(--gs-t3);color:var(--ink-2)}
.gs-favsub b{color:var(--ink);font-weight:700}
.gs-res{display:inline-flex;align-items:center;gap:5px;font-family:var(--body);font-size:var(--gs-t1);font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line-2);color:var(--ink-2)}
.gs-res.gs-ok{color:var(--pick);background:var(--pick-soft);border-color:transparent} .gs-res.gs-bad{color:var(--gs-miss-ink);background:var(--miss-soft);border-color:transparent}
.gs-split{display:flex;align-items:center;gap:10px;margin:14px 0 0}
.gs-split .pk-prob{flex:1;min-width:0;height:26px}
.gs-split .gs-slab{font-family:var(--display);font-size:var(--gs-t2);font-weight:700;color:var(--muted);min-width:34px;text-align:center}
.gs-split .gs-slab.gs-w{color:var(--ink)}
.gs-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 0}
.gs-tiles>div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px;min-width:0}
.gs-tiles b{display:flex;flex-wrap:wrap;column-gap:6px;font-family:var(--display);font-size:var(--gs-t4);font-weight:700;color:var(--ink);margin:4px 0 0;line-height:1.3}
.gs-tiles b>span,[data-gs-spread]{white-space:nowrap}
/* at a glance: one line per question, each a button that opens its card */
.gs-glance{margin:16px -12px 0}
.gs-gl{display:block;width:100%;min-height:48px;margin:0;padding:0 12px;background:none;border:0;border-radius:var(--r-md);color:inherit;font:inherit;text-align:left;cursor:pointer}
.gs-gl:hover{background:var(--panel-2)}
.gs-gli{display:grid;grid-template-columns:152px 330px minmax(0,1fr) 18px;grid-template-areas:"lab gv gc go";gap:4px 18px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.gs-gl:hover .gs-gli,.gs-gl:hover+.gs-gl .gs-gli{border-top-color:transparent}
.gs-gli>.gs-lab{grid-area:lab}
.gs-gv{grid-area:gv;display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;min-width:0;font-family:var(--display);font-size:var(--gs-t4);font-weight:700;color:var(--ink);line-height:1.3}
.gs-gv .tierbadge{width:16px;height:18px;flex:none;vertical-align:-3px}
.gs-gv small{font-family:var(--body);font-size:var(--gs-t2);font-weight:600;color:var(--ink-2)}
.gs-gv .gs-load{font-family:var(--body);font-size:var(--gs-t3);font-weight:500;color:var(--ink-2)}
.gs-gc{grid-area:gc;min-width:0;font-size:var(--gs-t2);color:var(--ink-2);line-height:1.6}
.gs-gc b{color:var(--ink);font-weight:700}
.gs-gc .gs-v{padding:1px 6px}
.gs-gc .gs-mu{display:block}
.gs-gc .gs-meter{margin-right:4px}
.gs-go{grid-area:go;color:var(--muted);justify-self:end}
.gs-gl:hover .gs-go{color:var(--ink)}
/* each player out on a line of his own */
.gs-gout{display:block;font-family:var(--body);font-size:var(--gs-t3);font-weight:700;color:var(--miss);line-height:1.45}
.gs-gout small{font-size:var(--gs-t2);font-weight:600;color:var(--ink-2);white-space:nowrap}
.gs-dis{display:inline-flex;align-items:baseline;gap:5px;font-weight:600;color:var(--ink)}
.gs-mm1{display:inline;min-width:0}
.gs-mm1 small{white-space:nowrap}

/* ---- a folded card: its title, a badge and a one-line summary on a button, the body under it ---- */
.gs-dbar{display:flex;align-items:center;gap:10px;margin:24px 2px 10px}
.gs-dbar .gs-lab{flex:1;color:var(--ink-2)}
.gs-dbar .btn{min-height:44px;padding:7px 16px;font-size:var(--gs-t2);font-weight:600}
#gsModal .gs-shead{margin:0;font:inherit}
.gs-tog{display:flex;align-items:center;gap:4px 12px;width:100%;min-height:60px;padding:14px 20px;background:none;border:0;border-radius:var(--r-lg);cursor:pointer;text-align:left;color:var(--ink);flex-wrap:wrap}
.gs-tog:hover .gs-ttl{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.gs-ttl{font-family:var(--display);font-size:var(--gs-t4);font-weight:600;letter-spacing:-.2px;color:var(--ink)}
.gs-badge{display:inline-flex;align-items:center;font-size:var(--gs-t1);font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.gs-badge.gs-bout{background:var(--miss-soft);border-color:transparent;color:var(--gs-miss-ink)}
.gs-sum{flex:1 1 200px;min-width:0;font-size:var(--gs-t2);font-weight:500;color:var(--ink-2);line-height:1.6}
.gs-sum .pk-ttag.pk-mini{vertical-align:0}
.gs-sum b{color:var(--ink);font-weight:700}
.gs-chev{flex:none;margin-left:auto;color:var(--muted);transition:transform .18s var(--ease)}
.gs-open>.gs-shead .gs-chev{transform:rotate(180deg)}
.gs-secbody{padding:0 20px 20px}
.gs-secbody[hidden],[data-gs-panel][hidden]{display:none}
.gs-pair{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:14px;align-items:start}
.gs-pair>.gs-sec.card{margin:0 0 14px}
/* a half-width card: its summary on a line of its own under the title */
.gs-pair .gs-sum{flex-basis:100%;order:3}

/* every call: the lean chart, a row a call, its bar under its name and pick */
.gs-axis{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin:0 0 4px;padding:0 0 8px;border-bottom:1px solid var(--line);font-size:var(--gs-t1);font-weight:700;letter-spacing:.05em;color:var(--muted)}
.gs-axis span:last-child{text-align:right}
.gs-axis .gs-x50{text-align:center;letter-spacing:0}
ol.gs-calls{list-style:none;margin:0;padding:0}
li.gs-call{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"name pk hit" "track track track";gap:8px 12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
li.gs-call:last-child{border-bottom:0}
li.gs-call[data-gs-model="vegas"]{border-bottom:2px solid var(--line-2)}
li.gs-call.gs-nocall{grid-template-areas:"name why why"}
li.gs-call.gs-nocall .gs-none{grid-area:why;text-align:right}
.gs-mname{grid-area:name;display:flex;align-items:center;gap:8px;font-weight:600;font-size:var(--gs-t3);color:var(--ink);line-height:1.25;min-width:0}
.gs-mname small{font-size:var(--gs-t1);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gs-track{grid-area:track;position:relative;display:block;height:10px;border-radius:999px;background:var(--line)}
.gs-track::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--muted);border-radius:1px}
.gs-track em{position:absolute;top:0;bottom:0;background:var(--gs-tc,var(--ink-2));box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.gs-track em.gs-toh{left:50%;border-radius:0 999px 999px 0}
.gs-track em.gs-toa{right:50%;border-radius:999px 0 0 999px}
.gs-pk{grid-area:pk;display:inline-flex;align-items:center;gap:8px;justify-content:flex-end;white-space:nowrap}
.gs-pk b{font-family:var(--display);font-size:var(--gs-t3);font-weight:700;color:var(--ink);min-width:36px;text-align:right}
.gs-hit{grid-area:hit;font-weight:700;font-size:var(--gs-t2);white-space:nowrap;min-width:52px;text-align:right}
.gs-hit i{font-style:normal} .gs-hit.gs-ok{color:var(--pick)} .gs-hit.gs-bad{color:var(--miss)} .gs-hit.gs-tie{color:var(--muted);font-weight:600}

/* two teams side by side, the label down the middle */
#gsModal table.gs-vs{width:100%;table-layout:fixed;background:none;box-shadow:none;border-radius:0;border:0}
#gsModal table.gs-vs th{background:none;padding:0 4px 10px;border-bottom:1px solid var(--line);vertical-align:bottom}
#gsModal table.gs-vs td{padding:10px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
#gsModal table.gs-vs tr:last-child td{border-bottom:0}
#gsModal table.gs-vs tbody tr:hover{background:none}
#gsModal table.gs-vs .gs-mlab{width:24%;text-align:center;color:var(--muted);font-size:var(--gs-t1);font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.35}
table.gs-vs .gs-a{text-align:left} table.gs-vs .gs-h{text-align:right}
table.gs-vs .gs-num{font-size:var(--gs-t4)}
table.gs-vs th .gs-thn{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px 8px;max-width:100%;font-family:var(--display);font-size:var(--gs-t3);font-weight:600;color:var(--ink);letter-spacing:0;text-transform:none}
table.gs-vs th.gs-h .gs-thn{flex-direction:row-reverse}
table.gs-vs small{font-size:var(--gs-t2);color:var(--muted);font-weight:600}
.gs-lag{color:var(--gold);font-weight:700;margin-left:2px}

/* Overall Offense against Overall Defense, both ways, one possession under the other, laid out like the
   head, centred (the owner's call, 14 October 2026): its title, the Deep Dive's headline tag and points
   under it, the two ratings in two boxes of one size (the side with the edge tinted, its shape the same),
   then the position matchups, a compact centred row each */
.gs-units{display:grid;grid-template-columns:minmax(0,1fr);gap:32px}
.gs-unit{min-width:0}
.gs-uhd{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 0 14px;text-align:center}
.gs-uhd h4{margin:0;min-width:0;font-family:var(--display);font-size:var(--gs-t4);font-weight:600;color:var(--ink);line-height:1.25}
.gs-uhtag{display:inline-flex;align-items:center;gap:8px;font-size:var(--gs-t2);color:var(--ink-2);white-space:nowrap}
.gs-duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:stretch}
.gs-vsx{align-self:center;font-size:var(--gs-t1);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gs-ubox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0;box-sizing:border-box;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);text-align:center}
.gs-ubox.gs-better{background:var(--pick-soft);border-color:transparent}
/* the label a step darker than the window's other labels: the muted grey is under 4.5:1 on the tint */
.gs-ubox .gs-lab{color:var(--ink-2)}
.gs-urank{font-family:var(--display);font-size:var(--gs-t5);font-weight:700;color:var(--ink);line-height:1.1;white-space:nowrap}
.gs-urank small{font-family:var(--body);font-size:var(--gs-t2);font-weight:600;color:var(--ink-2)}
#gsModal .gs-ubox.gs-better .gs-urank,#gsModal .gs-ubox.gs-better .gs-urank small{color:var(--pick)}
.gs-ush{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px 6px;font-size:var(--gs-t2);color:var(--ink-2)}
.gs-ush .tierbadge{width:15px;height:17px;flex:none}
.gs-ush b{font-family:var(--display);font-weight:700;color:var(--ink)}
#gsModal .gs-ubox.gs-better .gs-ush b{color:var(--ink)}
.gs-utier{white-space:nowrap;color:var(--ink-2)}

/* the Deep Dive's tags, on each possession's overall meeting and each of its four rows: five steps from
   Easy to Very tough, each its own tint with its text at 4.5:1 or more (the hub look sets its own). Even
   wears a ring as well as its grey (the owner's call, 16 October 2026: "make 'even' tags more
   distinguishable, looks like its not a button or color blends in too much"): an inset shadow, so its
   shape and size are the others' to the pixel, the ring at 3:1 or more on the card */
#gsModal .dtag{display:inline-flex;align-items:center;font-size:var(--gs-t1);font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap;line-height:1.2}
#gsModal .dtag.easy{background:#DDF3E6;color:#17603D}
#gsModal .dtag.fav{background:#EEF8F2;color:#1B6E47}
#gsModal .dtag.even{background:#E9EEF4;color:#3F4D63;box-shadow:inset 0 0 0 1.5px #6F7E96}
#gsModal .dtag.tough{background:#FBEFD3;color:#7A5205}
#gsModal .dtag.vtough{background:#FAE1DE;color:#A93226}
#gsModal .gs-hpts{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
/* the Deep Dive: four rows a possession, each the offense's unit against the defense's it plays, compact
   and centred: the offense's unit to the left of the middle, the two clubs and ranks in it, the defense's
   position it faces and the tag to its right (.ddend; the position since the owner's call of 16 October
   2026), the middle column on the same axis as the "vs" between the boxes above */
#gsModal .gs-dd{display:block;margin:20px 0 0;text-align:center}
#gsModal .gs-dd>.gs-lab{display:block;margin:0 0 6px;cursor:help}
#gsModal .ddrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
#gsModal .ddrow:first-child{border-top:0}
#gsModal .ddunit{justify-self:end;text-align:right;font-size:var(--gs-t2);font-weight:600;color:var(--ink-2);line-height:1.3}
#gsModal .ddrks{display:inline-flex;align-items:baseline;justify-content:center;gap:6px;font-size:var(--gs-t3);color:var(--ink);white-space:nowrap}
#gsModal .ddside{cursor:help}
#gsModal .ddsn{font-weight:600;color:var(--ink-2)}
#gsModal .ddsep{color:var(--ink-2)}
#gsModal .ddrk{font-family:var(--display);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
/* a side's Elo (the owner's call, 16 October 2026), in the card's value box, the higher of the two marked
   as every comparison in the window is (gs-better) */
#gsModal .ddelo{font-family:var(--display);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;padding:1px 7px}
#gsModal .ddelo.gs-better{color:var(--pick)}
/* each Elo's tier shield (the owner's call, 16 October 2026: "elo in offense vs defense pls add elo icon"),
   the ELO Ratings tab's own, sized to the row's text and sat on its line */
#gsModal .ddside .tierbadge{width:15px;height:17px;flex:none;vertical-align:-3px;margin-left:2px}
#gsModal .ddend{justify-self:start;display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 8px;text-align:left}
#gsModal .dddu{font-size:var(--gs-t2);font-weight:600;color:var(--ink-2);line-height:1.3}
#gsModal .ddrow .dtag{cursor:help}
#gsModal .gs-ddwhy{margin:14px 0 0;font-size:var(--gs-t2);color:var(--ink-2);line-height:1.5}

/* position by position */
.gs-outs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}
.gs-outs>div{font-size:var(--gs-t2);color:var(--ink-2);line-height:1.55;min-width:0;padding:10px 12px;border-radius:var(--r-md);background:var(--panel-2);border:1px solid var(--line)}
.gs-outs>div.gs-hasout{background:var(--miss-soft);border-color:transparent}
.gs-outs h5{margin:0;font-size:var(--gs-t1);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.gs-outs .gs-hasout h5{color:var(--gs-miss-ink);margin-bottom:6px}
.gs-outs h5 .gs-none{text-transform:none;letter-spacing:0;font-weight:500;font-size:var(--gs-t2)}
.gs-outs ul{margin:0;padding:0 0 0 16px}
.gs-outs li{margin:0 0 4px}
.gs-outs li b{color:var(--ink)}
.gs-pteams{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 6px}
.gs-pteams .gs-thn{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:var(--gs-t3);font-weight:600;color:var(--ink);min-width:0}
.gs-ptabs{display:flex;gap:4px;padding:4px;margin:0 0 6px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;width:max-content;max-width:100%}
.gs-ptabs button{min-height:44px;padding:0 20px;border:0;border-radius:999px;background:transparent;color:var(--ink-2);font:600 var(--gs-t2)/1 var(--body);cursor:pointer}
.gs-ptabs button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
.gs-ptabs button:hover:not([aria-selected="true"]){color:var(--ink);background:var(--panel)}
/* fixed layout: the two columns stay half each, so a long name cannot widen its side past the card */
.gs-pos{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0}
#gsModal table.gs-pos{background:none;box-shadow:none;border-radius:0;border:0}
#gsModal table.gs-pos tbody tr:hover{background:none}
#gsModal .gs-pos .gs-grp td{padding:18px 10px 8px;border-bottom:1px solid var(--line-2);background:none}
.gs-grpin{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:8px}
.gs-glab{text-align:center;font-size:var(--gs-t1);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);line-height:1.3}
.gs-glab small{display:block;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted);font-size:var(--gs-t1)}
.gs-ur{font-size:var(--gs-t2);color:var(--ink-2);white-space:nowrap}
.gs-ur b{color:var(--ink);font-weight:700}
.gs-ur.gs-a{justify-self:start} .gs-ur.gs-h{justify-self:end}
#gsModal .gs-pos td{padding:10px 10px;vertical-align:top;width:50%;border-bottom:1px solid var(--line)}
#gsModal .gs-pos tr:last-child td{border-bottom:0}
.gs-pos td.gs-h{text-align:right}
.gs-pl{display:block;min-width:0}
/* the shield and the name box side by side; the Q is inside the name box, inline after the name, so
   a name that wraps carries its Q on its own last line and never leaves it at the edge beside the
   other team's player (as a flex item of its own it was pushed there, nearer the other player than
   its own, on 69 of the season's 510 Q's at 390px and 109 at 360) */
.gs-pl .gs-pn{display:inline-flex;align-items:center;gap:7px;max-width:100%;font-weight:600;font-size:var(--gs-t3);color:var(--ink)}
.gs-pl .gs-pnm{display:block;min-width:0;overflow-wrap:anywhere}
.gs-h .gs-pl .gs-pn{flex-direction:row-reverse}
.gs-pl .tierbadge{width:16px;height:18px;flex:none}
.gs-pst{display:block;margin-top:3px}
.gs-pl small{font-size:var(--gs-t2);color:var(--muted)}
.gs-pl .gs-pse{font-family:var(--display);font-size:var(--gs-t3);font-weight:700;color:var(--ink);padding:1px 6px}
.gs-pl .gs-outw{display:block;margin-top:2px}
/* a wide screen: each half's Elo at its inner edge, beside the other side's, the halves split by a rule */
@media(min-width:761px){
  .gs-pl{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"pn se" "meta se" "out se";column-gap:14px;align-items:center}
  .gs-h .gs-pl{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"se pn" "se meta" "se out"}
  .gs-pl .gs-pn{grid-area:pn;justify-self:start}
  .gs-h .gs-pl .gs-pn{justify-self:end}
  .gs-pst{display:contents}
  .gs-pl .gs-pse{grid-area:se;font-size:var(--gs-t4);min-width:56px;justify-content:center;padding:3px 7px}
  .gs-pl .gs-pmeta{grid-area:meta;display:block;margin-top:2px}
  .gs-pl .gs-outw{grid-area:out}
  .gs-psep{display:none}
  #gsModal .gs-pos tbody td.gs-h{border-left:1px solid var(--line)}
  #gsModal .gs-pos tbody tr.gs-grp td{border-left:0}
}
.gs-pl.gs-off .gs-pnm{text-decoration:line-through;text-decoration-color:var(--miss)}
.gs-pl .gs-outw{color:var(--miss);font-weight:600;white-space:normal}
.gs-pl .gs-pnm .pe-q{display:inline-block;margin-left:3px;white-space:nowrap;text-decoration:none}
/* a starter's name that opens his row on the Props tab (the owner's call, 16 October 2026): the name box
   itself, a button that reads as the name, a dotted line under it to say it goes somewhere, 44px to tap,
   the home side's still to the right; the window's focus ring is the button's own */
#gsModal .gs-pl button.gs-pnm{display:block;min-height:44px;margin:0;padding:0;border:0;background:none;font:inherit;color:inherit;text-align:inherit;cursor:pointer;text-decoration:underline dotted;text-decoration-color:var(--muted);text-underline-offset:4px}
#gsModal .gs-pl button.gs-pnm:hover{text-decoration-style:solid;text-decoration-color:currentColor}
#gsModal .gs-pl.gs-off button.gs-pnm{text-decoration:line-through;text-decoration-color:var(--miss)}

/* mismatches */
ul.gs-mm{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ul.gs-mm li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;margin:0;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;line-height:1.4}
.gs-mmn{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:28px;padding:0 6px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line-2);font-family:var(--display);font-weight:700;font-size:var(--gs-t2);color:var(--ink)}
.gs-mmwho{display:block;font-weight:600;font-size:var(--gs-t3);color:var(--ink)}
.gs-mmwho .tierbadge{width:16px;height:18px;vertical-align:-3px;margin-right:4px}
.gs-mmwho small{color:var(--muted);font-weight:600;font-size:var(--gs-t2)}
.gs-mmvs{display:inline-flex;align-items:center;gap:6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.gs-mmsub{display:block;font-size:var(--gs-t2);color:var(--ink-2);margin-top:4px;line-height:1.5}
.gs-mmsub b{color:var(--ink);font-weight:700}
.gs-mmsc{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:72px}
.gs-mmsc .gs-mmv{display:inline-flex;align-items:center;gap:8px}
.gs-mmsc b{font-family:var(--display);font-size:var(--gs-t4);line-height:1;color:var(--ink)}
.gs-mmsc small{font-size:var(--gs-t2);font-weight:700}
.gs-scale{display:flex;flex-wrap:wrap;gap:6px 16px;margin:14px 0 0;font-size:var(--gs-t2);color:var(--ink-2)}
.gs-scale>span{display:inline-flex;align-items:center;gap:6px}

@media(max-width:899px){
  .gs-pair{display:block}
  /* the head stacked: the two teams side by side on the top row, the middle (score, kickoff, preview)
     full width under them. Three columns left the middle 231-369px wide from 761 to 899px (238 at an
     iPad's 768, its preview a ribbon of sixteen lines); the phone's smaller sizes stay at 760px */
  .gs-hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"away home" "mid mid"}
  .gs-mid .gs-sc{margin-top:2px}
  .gs-gli{grid-template-columns:152px minmax(0,1fr) 18px;grid-template-areas:"lab gv go" "lab gc go"}
  .gs-gli>.gs-lab{align-self:start;padding-top:4px}
}
@media(max-width:760px){
  #gsModal{--gs-th:58px;--gs-t5:20px;--gs-t6:26px}
  #gsModal .modal-panel{margin-top:0}
  .gs-top{border-radius:0;padding:0 12px}
  .gs-body{padding:12px 12px 0}
  #gsModal .gs-verdict.card{padding:16px 14px 6px}
  .gs-hero{gap:14px 10px}
  .gs-tname .pk-ttag{font-size:var(--gs-t3);padding:6px 9px}
  .gs-tname b{font-size:var(--gs-t3)}
  .gs-team{gap:4px}
  .gs-mid{gap:8px}
  .gs-fav{padding:14px 12px;margin-top:14px}
  .gs-favt{display:block;text-wrap:balance}
  .gs-favt .pk-ttag{margin-right:4px;vertical-align:3px}
  .gs-favt .gs-res{margin-left:4px;vertical-align:3px}
  .gs-favsub .gs-fsep{display:none}
  .gs-split{margin-top:12px}
  .gs-tiles{gap:6px;margin-top:12px}
  .gs-tiles>div{padding:8px 8px}
  .gs-tiles b{font-size:var(--gs-t3)}
  /* the moneylines one over the other, so the three tiles keep one row */
  .gs-tiles [data-gs-ml]{flex-direction:column}
  .gs-tiles [data-gs-ml] .gs-mdot{display:none}
  .gs-glance{margin:12px -8px 0}
  .gs-gl{padding:0 8px}
  .gs-gli{grid-template-columns:minmax(0,1fr) 18px;grid-template-areas:"lab go" "gv gv" "gc gc";gap:4px 8px;padding:12px 0}
  .gs-gli>.gs-lab{padding-top:0}
  .gs-dbar{margin:18px 2px 8px}
  .gs-tog{padding:12px 14px;gap:4px 10px;min-height:56px}
  .gs-sum{flex-basis:100%;order:3}
  .gs-secbody{padding:0 14px 16px}
  /* a phone: the result is its tick or cross, the word kept for a screen reader */
  .gs-hw{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .gs-hit{min-width:18px}
  .gs-hit i{font-size:var(--gs-t3)}
  .gs-mname{font-size:var(--gs-t2)}
  #gsModal table.gs-vs .gs-mlab{width:32%;letter-spacing:.03em}
  table.gs-vs th .gs-thn{font-size:var(--gs-t2)}
  table.gs-vs th .gs-tnm{display:none}
  .gs-units{gap:28px}
  .gs-uhd h4{font-size:var(--gs-t3)}
  #gsModal .ddrow{gap:10px}
  #gsModal .gs-prev{padding:10px 12px}
  .gs-duel{gap:8px}
  .gs-ubox{padding:12px 8px}
  .gs-ptabs{width:100%}
  .gs-ptabs button{flex:1;padding:0 8px}
  .gs-pteams .gs-tnm{display:none}
  #gsModal .gs-pos td{padding:9px 6px}
  #gsModal .gs-pos .gs-grp td{padding:16px 6px 6px}
  .gs-pl .gs-pn{font-size:var(--gs-t2)}
  .gs-pl .gs-prk{white-space:nowrap}
  .gs-pl .gs-psep{display:none}
  .gs-pl .gs-pse+.gs-pmeta{margin-left:4px}
  /* the shield says the tier on a phone (its label names it), so the line under a name stays one line */
  .gs-pl .gs-ptier{display:none}
  .gs-outs{grid-template-columns:1fr}
  ul.gs-mm li{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:11px 12px}
  ul.gs-mm li .gs-mmn{grid-column:1/-1;justify-self:start;height:24px}
  .gs-mmvs{display:flex;margin:6px 0 0}
}
/* the narrowest phones: 'Commanders', the longest name, whole at 360px */
@media(max-width:400px){
  .gs-tname b{font-size:var(--gs-t2)}
  .gs-urank{font-size:var(--gs-t4)}
  .gs-mini .gs-mline,.gs-mini .gs-msep{display:none}
  .gs-ptabs button{padding:0 4px}
  /* the three tiles keep one row: the total's number is short, the spread and the moneylines are not */
  .gs-tiles{grid-template-columns:minmax(0,1.12fr) minmax(0,.76fr) minmax(0,1.12fr)}
  .gs-tiles>div{padding:8px 7px}
  .gs-tiles .gs-lab{letter-spacing:.04em}
}
/* a phone, and the narrow window up to 760px (where the right-hand column, the defense's position and
   the tag together, would wrap): a matchup row's two positions centred on a line of their own ("Quarterback
   vs Pass defense", the vs drawn by the style alone), the two clubs and ranks and the tag centred under

  const team=(t,cls)=>{ const r=recordOf(P,M,t), po=r.po[0]+r.po[1]+r.po[2];
    const res=win?(win===t?' gs-won':' gs-lost'):'';

      <div class="gs-rec"><b data-gs-rec="${esc(t)}"${r.fromFile?' title="The Elo file\'s count: it has a final the results have not taken in yet"':''}>${wl(r.reg)}</b>${po?` <span data-gs-po="${esc(t)}">playoffs ${wl(r.po)}</span>`:''}</div></div>`; };
  const score=o?`<div class="gs-sc"><span class="gs-score" data-gs-score>${o.as}–${o.hs}</span><small>${o.final?'Final':esc(o.clock||'On now')}</small></div>`:'';
  const where=neu?`${g.stadium?esc(g.stadium)+', ':''}a neutral site`:(g.stadium?esc(g.stadium):'');
  const past=st.fin?`<p class="gs-past" id="gsPast"><b>Played.</b> The calls were made before kickoff and are graded on the result; the ratings, lineups and units are the files as they stand now, after the game.</p>`:'';
  /* first in the window, the game's own page on the Props tab, where its game bets and every player

  const L=lineOf(P,g), c=L.c;
  /* the headline: who is favoured and by how much, its chance and the board's confidence; once

  let fav;
  if(c){
    const pa=Math.round((1-c.pHome)*100), ph=100-pa, pc=P.probCols(a,h), by=L.spSide===c.pick?` by ${Math.abs(L.sp)}`:L.sp===0?', a pick\'em spread':'';
    const [tc,tl]=P.BET&&P.BET.tier?P.BET.tier(c.conf):['',''];

        <p class="gs-favsub" data-gs-vegas>${tg(c.pick,true)} <span>was favoured${esc(by)}</span><span class="gs-fsep" aria-hidden="true">·</span>${chance}</p>`;
    } else head=`<div class="gs-favh"><span class="gs-favt" data-gs-vegas>${tg(c.pick,true)} <span>${esc(teamName(c.pick))} favoured${esc(by)}</span></span>${chance}</div>`;
    fav=`${head}
      <div class="gs-split" role="img" aria-label="Vegas win chance: ${esc(a)} ${pa}%, ${esc(h)} ${ph}%"><span class="gs-slab${c.pick===a?' gs-w':''}">${esc(a)}</span>
        <div class="pk-prob" aria-hidden="true"><div class="pk-a" style="width:${pa}%;background:${pc[0].bg};color:${pc[0].ink}"><span class="${c.pick===a?'pk-w':''}">${pa>=14?N('vaway',pa+'%'):''}</span></div><div class="pk-h" style="width:${ph}%;background:${pc[1].bg};color:${pc[1].ink}"><span class="${c.pick===h?'pk-w':''}">${ph>=14?N('vhome',ph+'%'):''}</span></div></div>

  const tile=(lab,val,attr)=>`<div><span class="gs-lab">${lab}</span><b${attr||''}>${val==null?'–':val}</b></div>`;
  const tiles=`<div class="gs-tiles">
    ${tile('Spread',L.spTxt?esc(L.spTxt):null,' data-gs-spread')}

  const loading=['<span class="gs-load">loading…</span>',''];
  const glance=`<div class="gs-glance">
    ${line('vote','Model picks','gsCalls',()=>{ const W=voteOf(P,g,F,st), past=st.fin;
      if(!W.n) return ['<span class="gs-load">No calls yet</span>','The models call a game in the week before it.'];
      let v;
      if(W.vg&&!W.mods.length) v=`${tg(W.base,true)}<small>Vegas's pick; no model has called it yet</small>`;
      else if(W.vg) v=`${tg(W.base,true)}${N('vote',W.count)}<small>models ${past?'agreed':'agree'} with Vegas</small>`;
      else if(W.base) v=`${tg(W.base,true)}${N('vote',W.count)}<small>models ${past?'picked':'pick'} ${esc(W.base)}</small>`;

      const other=W.base===a?h:a, dot=r=>`<span class="gs-dis" data-gs-dissent="${r.id}"><i class="gs-dot" style="--gs-mc:${r.col}"></i>${esc(r.label)}</span>`;
      const bits=[];
      if(past) bits.push(`${N('votehit',W.hits+' of '+W.n)} calls right`);
      if(W.base&&W.mods.length) bits.push(W.dis.length?`${and(W.dis.map(dot))} ${past?'picked':W.dis.length===1?'picks':'pick'} ${esc(other)}`:`No model ${past?'picked':'picks'} ${esc(other)}`);
      else if(!W.base&&W.mods.length) bits.push(`${esc(a)} ${W.nA}, ${esc(h)} ${W.nH}`);

    ${line('elo','Team Elo','gsTeams',()=>{ if(!F) return loading; const R=teamsOf(F,g);
      if(!R) return ['<span class="gs-load">No rating</span>',F.model&&F.model.teams?`The ratings file has no rating for ${esc(!F.model.teams[a]?a:h)}.`:'The team ratings did not load.'];
      const ea=R.T[a].elo, eh=R.T[h].elo, d=Math.abs(eh-ea), hi=eh>ea?h:ea>eh?a:null;
      const v=hi?`<span data-gs-n="tedge">${tg(hi,true)} +${d}</span><small>rating points ahead</small>`:`<span data-gs-n="tedge">Even</span>`;
      const side=t=>V(`${esc(t)} ${N('telo:'+t,R.T[t].elo)} · ${N('trank:'+t,'#'+R.rank(t))}`,hi===t);
      return [v,`${side(a)} ${side(h)}`]; })}
    ${line('units','Offense vs defense','gsUnits',()=>{ if(!F) return loading; const X=unitsOf(F);
      if(!X) return ['<span class="gs-load">Not loaded</span>','The unit ratings did not load.'];
      if(!X.on) return ['<span class="gs-load">Not yet</span>','They start once a team has a rated game this season.'];
      const p1=possession(X.U,a,h), p2=possession(X.U,h,a);
      if(!p1||!p2) return ['<span class="gs-load">No rating</span>','A team has no unit rating in the file.'];
      let v;
      if(p1.team&&p1.team===p2.team) v=`${tg(p1.team,true)}<span>ranks higher both ways</span>`;
      else if(p1.edge==='off'&&p2.edge==='off') v='<span>Both offenses rank higher</span>';
      else if(p1.edge==='def'&&p2.edge==='def') v='<span>Both defenses rank higher</span>';
      else v='<span>Even</span>';
      /* each side's label and its rank pill kept together (at about 900-930px a pill was left alone on a line) */
      const mu=(o,d,p)=>`<span class="gs-mu"><span class="gs-nw">${esc(o)} offense ${V(N('urank:off:'+o,ordinal(p.vo.rank)),p.edge==='off')}</span> vs <span class="gs-nw">${esc(d)} defense ${V(N('urank:def:'+d,ordinal(p.vd.rank)),p.edge==='def')}</span></span>`;
      return [v,mu(a,h,p1)+mu(h,a,p2)]; })}
    ${line('out','Who\'s out','gsPos',()=>{ if(!F) return loading; const Pl=F.players, mu=F.mu;
      if(!Pl||!Pl.groups) return ['<span class="gs-load">Not loaded</span>','The player ratings did not load.'];
      const xs=[a,h].flatMap(t=>sidelinedOf(Pl,t));
      const v=xs.length?`<span>${xs.map(x=>`<span class="gs-gout" title="${esc(x.why)}"><span data-gs-n="out:${esc(x.id)}">${esc(x.name)}</span> <small>${esc(x.team)} ${esc(x.grp)} · out</small></span>`).join(' ')}</span>`
        :'<span class="gs-load">No ranked player out</span>';
      const qa=qCount(mu,a), qh=qCount(mu,h);
      const cx=!mu||!mu.lineups?'The expected lineups did not load.'
        :qa||qh?`Questionable starters: ${esc(a)} ${qa?N('qn:'+a,qa):0}, ${esc(h)} ${qh?N('qn:'+h,qh):0}`:'No expected starter is questionable.';
      return [v,cx]; })}
    ${line('mism','Top mismatch','gsMism',()=>{ const R=mmOf(P,g,F);
      if(!R.mine) return [`<span class="gs-load">${esc(R.v)}</span>`,R.c];
      if(!R.mine.length) return ['<span class="gs-load">None in this game</span>','No starter here is above his position\'s average facing a unit below the league\'s.'];
      const v0=R.mine[0], [gw,gc,lv]=mmGrade(v0.score), se=plSe(F,v0.pid);
      const v=`<span class="gs-mm1">${se!=null?shield(se):''} <span data-gs-n="mm1:${esc(v0.pid)}">${esc(plName(F,v0.pid))}</span> <small>${esc(v0.group)} · ${esc(v0.team)}</small></span>`;
      const cx=`${meter(lv,gc)}${N('mm1score',v0.score.toFixed(1))} ${gw} edge, against a ${esc(v0.unitName)} ranked ${ordinal(v0.defRank)}${R.mine.length>1?` · all ${R.mine.length} in Mismatches`:''}`;
      return [v,cx]; })}
  </div>`;
  let prev=''; try{ prev=preview(P,g,F,st); }catch(e){ prev=''; }
  return `<section class="card gs-sec gs-verdict" id="gsMatch">${props}<div class="gs-hero">${team(a,'gs-away')}<div class="gs-mid">${score}<p class="gs-when"><b>${esc(day)}</b>${time?' · '+esc(time):''}${where?' · '+where:''}</p>${prev}</div>${team(h,'gs-home')}</div>${past}
    <div class="gs-fav">${fav}${tiles}</div>${glance}</section>`;
}
